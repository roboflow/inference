[pytest]
testpaths = tests inference_models/tests
addopts = --import-mode=importlib
pythonpath = . inference_models
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    sam3_extras: requires complete SAM3 and SAM3D dependencies (select with '-m sam3_extras')
    workflows: marks tests that run workflows (deselect with '-m "not workflows"')
