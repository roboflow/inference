spec:
  template:
    metadata:
      annotations:
        roboflow.com/staging-rollout: l40s-capacity-f-v14-process-nvdec
    spec:
      containers:
        - name: processor
          image: us-central1-docker.pkg.dev/roboflow-staging/video-proc/video-processor-process@sha256:4f1767d45ec3d90e07215f377ebbbba21b7c8b1a42ffa8acedf4b6217c06a70c
          env:
            - name: VIDEO_PROC_IMAGE
              value: us-central1-docker.pkg.dev/roboflow-staging/video-proc/video-processor-process@sha256:4f1767d45ec3d90e07215f377ebbbba21b7c8b1a42ffa8acedf4b6217c06a70c
            - name: VIDEO_PROC_GIT_SHA
              value: 008d5e64b27d19c7c5da6334ec9497ba756827ad
            - name: VIDEO_PROC_RUNTIME_VARIANT
              value: v14-process-nvdec
            - name: PROCESSOR_JOB_EXECUTION_MODE
              value: process
            - name: PROCESSOR_EXECUTION_DOMAIN_MODE
              value: in_process
            - name: PROCESSOR_VIDEO_INGEST_MODE
              value: gstreamer_cuda
            - name: ENABLE_TENSOR_DATA_REPRESENTATION
              value: "true"
            - name: USE_INFERENCE_MODELS
              value: "true"
            - name: WORKFLOWS_IMAGE_TENSOR_DEVICE
              value: cuda
            - name: VIDEO_SOURCE_ADAPTIVE_BACKPRESSURE
              value: "true"
            - name: ROBOFLOW_RTSP_LATENCY_MS
              value: "200"
            - name: ROBOFLOW_RTSP_PROTOCOLS
              value: tcp
            - name: ROBOFLOW_RTSP_VIDEO_CODEC
              value: h264
            - $patch: delete
              name: ENABLE_FRAME_DROP_ON_VIDEO_FILE_RATE_LIMITING
