spec:
  template:
    metadata:
      annotations:
        roboflow.com/staging-rollout: l40s-capacity-c-v14-nvdec
    spec:
      containers:
        - name: processor
          image: us-central1-docker.pkg.dev/roboflow-staging/video-proc/video-processor-nvdec@sha256:214196ff30e8ac912830617138d32789c08456349528e0dd44e42cba7e8ac326
          env:
            - name: VIDEO_PROC_IMAGE
              value: us-central1-docker.pkg.dev/roboflow-staging/video-proc/video-processor-nvdec@sha256:214196ff30e8ac912830617138d32789c08456349528e0dd44e42cba7e8ac326
            - name: VIDEO_PROC_GIT_SHA
              value: 6ca38194bdc3c312c0adf6a3a275b9014c79f4b6
            - name: VIDEO_PROC_RUNTIME_VARIANT
              value: v14-tensor-nvdec
            - name: PROCESSOR_VIDEO_INGEST_MODE
              value: gstreamer_cuda
