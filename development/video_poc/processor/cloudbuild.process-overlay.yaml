# Staging-only thin process-topology image. The exact processor base controls
# the inference runtime; this build changes only the worker files copied by
# Dockerfile.overlay. All four substitutions are required.
steps:
  - name: python:3.12-slim
    id: validate-staging-inputs
    entrypoint: python
    args:
      - -c
      - |
        import re
        import sys

        base, output, git_sha, variant = sys.argv[1:]
        digest = (
            r"us-central1-docker[.]pkg[.]dev/roboflow-staging/"
            r"video-proc/[a-z0-9-]+@sha256:[0-9a-f]{64}"
        )
        tag = (
            r"us-central1-docker[.]pkg[.]dev/roboflow-staging/"
            r"video-proc/[a-z0-9-]+:[a-zA-Z0-9_.-]+"
        )
        if re.fullmatch(digest, base) is None:
            raise SystemExit("_BASE_PROCESSOR_IMAGE must be a staging digest")
        if re.fullmatch(tag, output) is None:
            raise SystemExit("_OUTPUT must be a staging tag")
        if re.fullmatch(r"[0-9a-f]{40}", git_sha) is None:
            raise SystemExit("_GIT_SHA must be an exact commit")
        if re.fullmatch(r"[a-z0-9-]{1,64}", variant) is None:
            raise SystemExit("_RUNTIME_VARIANT is invalid")
      - ${_BASE_PROCESSOR_IMAGE}
      - ${_OUTPUT}
      - ${_GIT_SHA}
      - ${_RUNTIME_VARIANT}
  - name: gcr.io/cloud-builders/docker
    id: build-process-overlay
    args:
      - build
      - --platform=linux/amd64
      - --file=Dockerfile.overlay
      - --build-arg=BASE_PROCESSOR_IMAGE=${_BASE_PROCESSOR_IMAGE}
      - --build-arg=VIDEO_PROC_GIT_SHA=${_GIT_SHA}
      - --build-arg=VIDEO_PROC_RUNTIME_VARIANT=${_RUNTIME_VARIANT}
      - --tag=${_OUTPUT}
      - .
images:
  - ${_OUTPUT}
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 1800s
