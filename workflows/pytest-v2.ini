# Workflows V2 suites. Run from workflows/: python -m pytest -c pytest-v2.ini
# The default paths hold unit and static integration tests. Opt-in suites run
# by path: tests/v2/integration/external/{redis,models}. The compatibility
# suite has its own bootstrap: see tests/compatibility/v2/conftest.py.
[pytest]
addopts = --confcutdir=tests/v2
testpaths =
    tests/v2/unit
    tests/v2/integration/blocks
    tests/v2/integration/data
    tests/v2/integration/engine
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
