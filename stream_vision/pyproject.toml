[project]
name = "streamvision"
version = "0.1.1rc1"
description = "Video sources, InferencePipeline and the stream manager for Roboflow Inference"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=2.0.0,<2.4.0",
  "opencv-python>=4.8.1.78,<4.13.0",
  "pillow>=12.3.0,<13.0.0",
  "pydantic>=2.8.0,<2.12.0",
  "psutil>=7.0.0",
  "supervision>=0.30.6,<0.31.0",
]

[project.optional-dependencies]
webrtc = [
  "aiortc>=1.9.0",
  "av==14.2.0",
  "orjson>=3.11.6,<4.0.0",
  "requests>=2.33.0,<3.0.0",
]
workflows = [
  "roboflow-workflows>=0.2.4rc3",
  "torch>=2.0.1,<3.0.0",
]
nvdec = [
  "torch>=2.0.1,<3.0.0; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
  "pynvvideocodec>=2.1.0,<3.0.0; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
test = [
  "pytest>=9.0.3,<10.0.0",
  "requests-mock~=1.12.1",
  "tomli>=2.0.0; python_version < '3.11'",
  "pytest-asyncio<=0.21.1",
  "pytest-timeout>=2.2.0",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["streamvision*"]
exclude = ["tests*", "build_scripts*", "scripts*"]
