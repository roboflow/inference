[project]
name = "streamvision"
version = "0.1.0rc2"
description = "Video sources, InferencePipeline and the stream manager for Roboflow Inference"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=2.0.0,<2.4.0",
  "opencv-python>=4.8.1.78,<4.13.0",
  "supervision>=0.29.0,<0.30.0",
  "pydantic>=2.8.0,<2.12.0",
  "psutil>=7.0.0",
  "roboflow-workflows>=0.2.4rc1",
]

[project.optional-dependencies]
webrtc = [
  "aiortc>=1.9.0",
  "av==14.2.0",
]
test = [
  "pytest>=9.0.3,<10.0.0",
  "requests-mock~=1.12.1",
  "tomli>=2.0.0; python_version < '3.11'",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["streamvision*"]
exclude = ["tests*", "build_scripts*", "scripts*"]
