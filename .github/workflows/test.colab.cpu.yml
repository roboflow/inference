name: Google Colab CPU
permissions:
  contents: read
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build:
    if: ${{ !github.event.act }}
    runs-on:
      group: group8core
    timeout-minutes: 35

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: 🔨 Build Docker
        run: docker build -t inference-google-colab:cpu -f ./docker/dockerfiles/Dockerfile.google.colab.cpu .
      - name: 🧪 Run tests
        run: docker run -e ROBOFLOW_API_KEY=${{ secrets.API_KEY }} inference-google-colab:cpu
