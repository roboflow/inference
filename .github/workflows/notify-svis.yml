name: Notify SVIS of a post release
# A post release (e.g. 1.8.4-post1) is a manually dispatched CPU build, not a
# GitHub release: a release would start ~21 workflows (every image family,
# the PyPI publishes, docs, installers), and the PyPI uploads would collide
# because version.py still holds the base version. Its annotated git tag is
# what maps the version to its commit:
#
#   git tag -a v1.8.4-post1 <commit> -m "1.8.4-post1"
#   git push origin v1.8.4-post1
#
# Pushing that tag runs this workflow, which pings
# streaming-video-inference-services the same way notify-svis in
# docker.cpu.yml does for GitHub releases, so its inference pin gets a bump
# PR. Push the tag once the post release images are published. The tag can
# point at a commit that is not on main (a base release plus a fix), but that
# commit must contain this file, or the push starts nothing.
#
# Fire-and-forget: holds no permissions of its own and nothing flows back
# from SVIS. The App key lives in the svis-dispatch environment, restricted
# to v* tag refs; creating v* tags is restricted to release owners. The job is
# a no-op until the App client id and key exist.

on:
  push:
    tags: ['v*-post*']

permissions: {}

# One run per tag; a ping is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify-svis:
    if: github.repository == 'roboflow/inference'
    runs-on: ubuntu-latest
    environment: svis-dispatch
    timeout-minutes: 5
    permissions: {}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      HAS_APP: ${{ secrets.SVIS_DISPATCH_APP_PRIVATE_KEY != '' && vars.SVIS_DISPATCH_APP_CLIENT_ID != '' }}
    steps:
      - name: Only announce X.Y.Z-postN tags
        id: filter
        run: |
          version="${RELEASE_TAG#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-post[0-9]+$ ]]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "Not a post release tag ($RELEASE_TAG); nothing to announce."
          fi
      - name: Mint a token scoped to the SVIS repository
        id: app-token
        if: ${{ steps.filter.outputs.version != '' && env.HAS_APP == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SVIS_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SVIS_DISPATCH_APP_PRIVATE_KEY }}
          owner: roboflow
          repositories: streaming-video-inference-services
          permission-contents: write # required by repository_dispatch
      # GITHUB_SHA is the commit the tag points at; SVIS checks it equals
      # the commit of tag v<version>.
      - name: Ping SVIS
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.filter.outputs.version }}
        run: |
          gh api repos/roboflow/streaming-video-inference-services/dispatches \
            -f event_type=inference-release \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[sha]=$GITHUB_SHA"
          echo "Announced $VERSION ($GITHUB_SHA) to streaming-video-inference-services"
