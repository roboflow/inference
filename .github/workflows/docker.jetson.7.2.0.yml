name: Build and Push Jetson 7.2.0 Container
permissions:
  contents: read
on:
  release:
    types: [created]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_push:
        type: boolean
        description: "Do you want to push image after build?"
        default: false
      custom_tag:
        type: string
        description: "Custom tag to use for the image (overrides VERSION)"
        default: ""
      rebuild_media:
        type: boolean
        description: "Build the media image from this ref before the server image"
        default: false

env:
  VERSION: "0.0.0"
  BASE_IMAGE: "roboflow/roboflow-inference-server-jetson-7.2.0"
  MEDIA_BASE_IMAGE: "roboflow/roboflow-inference-media-jetson-7.2.0"

jobs:
  docker:
    runs-on:
      labels: depot-ubuntu-24.04-4
      group: public-depot
    timeout-minutes: 1440
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
      - name: Read version from file
        run: echo "VERSION=$(DISABLE_VERSION_CHECK=true python ./inference/core/version.py)" >> "$GITHUB_ENV"
      - name: Determine Image Tags
        id: tags
        uses: ./.github/actions/determine-tags
        with:
          custom_tag: ${{ github.event.inputs.custom_tag }}
          version: ${{ env.VERSION }}
          base_image: ${{ env.BASE_IMAGE }}
          force_push: ${{ github.event.inputs.force_push }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Depot CLI
        uses: depot/setup-action@v1
      - name: Validate media rebuild tag
        if: ${{ inputs.rebuild_media }}
        env:
          CUSTOM_TAG: ${{ inputs.custom_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$CUSTOM_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,121}$ ]]; then
            echo "A valid custom tag is required for media rebuilds (122 characters maximum before -media)." >&2
            exit 1
          fi
      - name: Build media image from current ref
        if: ${{ inputs.rebuild_media }}
        id: media
        uses: depot/build-push-action@v1
        with:
          project: v1xzfwkc4b
          context: .
          file: ./docker/dockerfiles/Dockerfile.media.jetson.7.2.0
          platforms: linux/arm64
          push: true
          tags: ${{ env.MEDIA_BASE_IMAGE }}:${{ inputs.custom_tag }}-media
      - name: Use current-ref media image
        if: ${{ inputs.rebuild_media }}
        env:
          CUSTOM_TAG: ${{ inputs.custom_tag }}
          MEDIA_DIGEST: ${{ steps.media.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$CUSTOM_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,121}$ || ! "$MEDIA_DIGEST" =~ ^sha256:[a-f0-9]{64}$ || ! "$MEDIA_BASE_IMAGE" =~ ^[a-z0-9][a-z0-9._:/-]*$ ]]; then
            echo "Invalid media image reference." >&2
            exit 1
          fi
          printf 'JETSON_MEDIA_IMAGE=%s:%s-media@%s\n' "$MEDIA_BASE_IMAGE" "$CUSTOM_TAG" "$MEDIA_DIGEST" >> "$GITHUB_ENV"
      - name: Build image
        uses: depot/bake-action@v1
        env:
          JETSON_SERVER_TAGS: ${{ steps.tags.outputs.image_tags }}
        with:
          files: ./docker/docker-bake.jetson.7.2.0.hcl
          targets: jetson-server-jp72
          project: v1xzfwkc4b
          push: ${{ github.event_name == 'release' || inputs.force_push == true }}
          save: ${{ github.event_name != 'release' && !inputs.force_push }}
          save-tag: ${{ github.event_name != 'release' && !inputs.force_push && format('server-jp72-{0}', github.sha) || '' }}
