name: Build and Push Jetson 7.2.0 Container
permissions:
  contents: read
  actions: read
on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_run_id:
        type: string
        description: Original coordinator run supplying prepared locks (optional for non-release builds)
        default: ""
      force_push:
        type: boolean
        description: "Do you want to push image after build?"
        default: false
      custom_tag:
        type: string
        description: "Custom tag to use for the image (overrides VERSION)"
        default: ""
      rebuild_media:
        type: boolean
        description: "Build the media image from this ref before the server image"
        default: false

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  VERSION: "0.0.0"
  BASE_IMAGE: "roboflow/roboflow-inference-server-jetson-7.2.0"
  MEDIA_BASE_IMAGE: "roboflow/roboflow-inference-media-jetson-7.2.0"

jobs:
  release_inputs:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/prepare.release-image-inputs.yml
    with:
      coordinator_run_id: ${{ inputs.release_run_id || '' }}

  docker:
    needs: release_inputs
    runs-on:
      labels: depot-ubuntu-24.04-4
      group: public-depot
    timeout-minutes: 1440
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
      - name: Restore prepared release image inputs
        id: prepared_inputs
        if: ${{ needs.release_inputs.outputs.run_id != '' }}
        uses: ./.github/actions/restore-release-inputs
        with:
          run_id: ${{ needs.release_inputs.outputs.run_id }}
          artifact_id: ${{ needs.release_inputs.outputs.artifact_id }}
      - name: Read version from file
        run: echo "VERSION=$(DISABLE_VERSION_CHECK=true python ./inference/core/version.py)" >> "$GITHUB_ENV"
      - name: Determine Image Tags
        id: tags
        uses: ./.github/actions/determine-tags
        with:
          custom_tag: ${{ github.event.inputs.custom_tag }}
          version: ${{ env.VERSION }}
          base_image: ${{ env.BASE_IMAGE }}
          force_push: ${{ github.event.inputs.force_push }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Depot CLI
        uses: depot/setup-action@v1
      - name: Validate media rebuild tag
        if: ${{ inputs.rebuild_media }}
        env:
          CUSTOM_TAG: ${{ inputs.custom_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$CUSTOM_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,121}$ ]]; then
            echo "A valid custom tag is required for media rebuilds (122 characters maximum before -media)." >&2
            exit 1
          fi
      - name: Build media image from current ref
        if: ${{ inputs.rebuild_media }}
        id: media
        uses: depot/build-push-action@v1
        with:
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.roboflow.release-inputs.sha256=${{ steps.prepared_inputs.outputs.digest }}
          project: v1xzfwkc4b
          context: .
          file: ./docker/dockerfiles/Dockerfile.media.jetson.7.2.0
          platforms: linux/arm64
          push: true
          tags: ${{ env.MEDIA_BASE_IMAGE }}:${{ inputs.custom_tag }}-media
      - name: Use current-ref media image
        if: ${{ inputs.rebuild_media }}
        env:
          CUSTOM_TAG: ${{ inputs.custom_tag }}
          MEDIA_DIGEST: ${{ steps.media.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$CUSTOM_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,121}$ || ! "$MEDIA_DIGEST" =~ ^sha256:[a-f0-9]{64}$ || ! "$MEDIA_BASE_IMAGE" =~ ^[a-z0-9][a-z0-9._:/-]*$ ]]; then
            echo "Invalid media image reference." >&2
            exit 1
          fi
          printf 'JETSON_MEDIA_IMAGE=%s:%s-media@%s\n' "$MEDIA_BASE_IMAGE" "$CUSTOM_TAG" "$MEDIA_DIGEST" >> "$GITHUB_ENV"
      - name: Build image
        uses: depot/bake-action@v1
        env:
          JETSON_SERVER_TAGS: ${{ steps.tags.outputs.image_tags }}
        with:
          set: |
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.labels.com.roboflow.release-inputs.sha256=${{ steps.prepared_inputs.outputs.digest }}
          files: ./docker/docker-bake.jetson.7.2.0.hcl
          targets: jetson-server-jp72
          project: v1xzfwkc4b
          push: ${{ github.event_name == 'release' || inputs.force_push == true }}
          save: ${{ github.event_name != 'release' && !inputs.force_push }}
          save-tag: ${{ github.event_name != 'release' && !inputs.force_push && format('server-jp72-{0}', github.sha) || '' }}
