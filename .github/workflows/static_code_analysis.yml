name: Static code analysis
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    # Fast-track CI (fast_track_ci.yml) calls this workflow for a branch that
    # deliberately diverged from main. `ref` is the PR head SHA to test; empty
    # keeps the default checkout for every other trigger.
    inputs:
      ref:
        description: "Git ref to check out (fast-track CI). Empty = default for the event."
        type: string
        required: false
        default: ""

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  # The literal file id keeps groups distinct when this workflow is *called*
  # (workflow_call): inside a called workflow github.workflow resolves to the
  # caller's name, so without it every workflow called by one caller would
  # share a single group and serialize.
  group: ${{ github.workflow }}-static_code_analysis-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build-dev-test:
    runs-on:
      labels: depot-ubuntu-24.04-small
      group: public-depot
    timeout-minutes: 7
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Install code analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/requirements.code_analysis.txt
      - name: Check code quality
        run: |
          make check_code_quality
