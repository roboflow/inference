name: Test PyPI release contracts
on:
  pull_request:
    paths:
      - .release/pypi/**
      - .dockerignore
      - .github/workflows/prepare.release-image-inputs.yml
      - .github/workflows/docker*.yml
      - .github/actions/restore-release-inputs/**
      - .github/workflows/publish.pypi*.yml
      - .github/workflows/test.pypi.release.yml
      - .github/workflows/*inference_sdk*.yml
      - .github/docker/Dockerfile.sdk-tests
      - .github/scripts/run_sdk_tests.sh
      - .github/scripts/test_pypi_release.py
      - .github/scripts/test_pypi_workflow_conditions.mjs
      - .github/pypi-workflow-tests/**
      - .github/docker/Dockerfile.pypi-workflow-tests
      - .github/scripts/test_pypi_dependencies.py
      - .github/scripts/test_pypi_publish.py
      - .github/scripts/test_pypi_image_inputs.py
      - .github/scripts/test_pypi_preparation.py
      - .github/scripts/test_pypi_recovery.py
      - .github/scripts/test_pypi_candidate_ownership.py
      - .github/scripts/test_pypi_build_tools.py
      - .github/scripts/test_pypi_system_python.py
      - .github/docker/Dockerfile.pypi-system-python-tests
      - docker/dockerfiles/Dockerfile.onnx.jetson.7.2.0
      - docker/dockerfiles/Dockerfile.onnx.gpu
      - inference_models/pyproject.toml
      - inference_models/uv.lock
      - workflows/pyproject.toml
      - workflows/uv.lock
      - stream_vision/pyproject.toml
      - stream_vision/uv.lock
      - Makefile
      - requirements/**
      - inference/core/version.py
      - inference_sdk/**
  push:
    branches: [main]
    paths:
      - .release/pypi/**
      - .dockerignore
      - .github/workflows/prepare.release-image-inputs.yml
      - .github/workflows/docker*.yml
      - .github/actions/restore-release-inputs/**
      - .github/workflows/publish.pypi*.yml
      - .github/workflows/test.pypi.release.yml
      - .github/workflows/*inference_sdk*.yml
      - .github/docker/Dockerfile.sdk-tests
      - .github/scripts/run_sdk_tests.sh
      - .github/scripts/test_pypi_release.py
      - .github/scripts/test_pypi_workflow_conditions.mjs
      - .github/pypi-workflow-tests/**
      - .github/docker/Dockerfile.pypi-workflow-tests
      - .github/scripts/test_pypi_dependencies.py
      - .github/scripts/test_pypi_publish.py
      - .github/scripts/test_pypi_image_inputs.py
      - .github/scripts/test_pypi_preparation.py
      - .github/scripts/test_pypi_recovery.py
      - .github/scripts/test_pypi_candidate_ownership.py
      - .github/scripts/test_pypi_build_tools.py
      - .github/scripts/test_pypi_system_python.py
      - .github/docker/Dockerfile.pypi-system-python-tests
      - docker/dockerfiles/Dockerfile.onnx.jetson.7.2.0
      - docker/dockerfiles/Dockerfile.onnx.gpu
      - inference_models/pyproject.toml
      - inference_models/uv.lock
      - workflows/pyproject.toml
      - workflows/uv.lock
      - stream_vision/pyproject.toml
      - stream_vision/uv.lock
      - Makefile
      - requirements/**
      - inference/core/version.py
      - inference_sdk/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test publication conditions and regression mutations in Docker
        run: |
          docker build --tag inference-pypi-workflow-tests --file .github/docker/Dockerfile.pypi-workflow-tests .github
          image_id=$(docker image inspect --format '{{.Id}}' inference-pypi-workflow-tests)
          echo "Source revision: $GITHUB_SHA; Docker image: $image_id"
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/work:ro" "$image_id"
      - name: Test package inventories and registry failure boundaries in Docker
        run: |
          docker build --tag inference-pypi-tests --file .release/pypi/Dockerfile .release/pypi
          image_id=$(docker image inspect --format '{{.Id}}' inference-pypi-tests)
          echo "Source revision: $GITHUB_SHA; Docker image: $image_id"
          docker run --rm --network none -e PIP_NO_INDEX=1 -e PIP_FIND_LINKS=/build-wheels -e SOURCE_REVISION="$GITHUB_SHA" \
            -v "$GITHUB_WORKSPACE:/work" -w /work "$image_id" \
            sh -c 'python -m black --check .release/pypi/release.py .release/pypi/dependencies.py .release/pypi/publish.py .release/pypi/candidate.py .release/pypi/prepare.py .release/pypi/image_inputs.py .release/pypi/sdk_smoke.py .github/scripts/test_pypi_release.py .github/scripts/test_pypi_dependencies.py .github/scripts/test_pypi_publish.py .github/scripts/test_pypi_recovery.py .github/scripts/test_pypi_preparation.py .github/scripts/test_pypi_image_inputs.py .github/scripts/test_pypi_candidate_ownership.py .github/scripts/test_pypi_build_tools.py .github/scripts/test_pypi_system_python.py &&
              python -m isort --check-only .release/pypi/release.py .release/pypi/dependencies.py .release/pypi/publish.py .release/pypi/candidate.py .release/pypi/prepare.py .release/pypi/image_inputs.py .release/pypi/sdk_smoke.py .github/scripts/test_pypi_release.py .github/scripts/test_pypi_dependencies.py .github/scripts/test_pypi_publish.py .github/scripts/test_pypi_recovery.py .github/scripts/test_pypi_preparation.py .github/scripts/test_pypi_image_inputs.py .github/scripts/test_pypi_candidate_ownership.py .github/scripts/test_pypi_build_tools.py .github/scripts/test_pypi_system_python.py &&
              python -m pytest .github/scripts/test_pypi_build_tools.py -v &&
              python -m pytest .github/scripts/test_pypi_release.py .github/scripts/test_pypi_dependencies.py .github/scripts/test_pypi_publish.py .github/scripts/test_pypi_recovery.py .github/scripts/test_pypi_preparation.py .github/scripts/test_pypi_image_inputs.py .github/scripts/test_pypi_candidate_ownership.py -v'
      - name: Test the Jetson package build on protected system Python
        run: |
          docker build --tag inference-pypi-system-python-tests --file .github/docker/Dockerfile.pypi-system-python-tests .
          image_id=$(docker image inspect --format '{{.Id}}' inference-pypi-system-python-tests)
          echo "Source revision: $GITHUB_SHA; Docker image: $image_id"
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/work:ro" -w /work "$image_id" \
            python -m pytest .github/scripts/test_pypi_system_python.py -v
      - name: Smoke the exact SDK wheel in the existing SDK test image
        run: |
          bash .release/pypi/release.sh build-sdk
          bash .github/scripts/run_sdk_tests.sh retained 3.12
