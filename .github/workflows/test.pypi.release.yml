name: Test PyPI release contracts
on:
  workflow_call:
    inputs:
      release_source:
        description: Exact prepared release commit; empty for normal CI
        type: string
        default: ''
  pull_request:
    paths:
      - .release/**
      - .github/scripts/test_release_flow.py
      - .github/scripts/release*.py
      - .github/scripts/retry.sh
      - .github/actions/retry-tests/**
      - .github/actions/determine-tags/**
      - tests/inference/unit_tests/deployment/test_determine_tags_security.py
      - .github/workflows/release.image.yml
      - .github/workflows/publish.pypi*.yml
      - .github/workflows/test.pypi.release.yml
      - .github/workflows/*inference_sdk*.yml
      - .github/docker/Dockerfile.sdk-tests
      - .github/scripts/run_sdk_tests.sh
      - .github/scripts/test_pypi_release.py
      - .github/scripts/test_pypi_workflow_conditions.mjs
      - .github/pypi-workflow-tests/**
      - .github/docker/Dockerfile.pypi-workflow-tests
      - .github/scripts/test_pypi_dependencies.py
      - .github/scripts/test_pypi_publish.py
      - inference_models/pyproject.toml
      - workflows/pyproject.toml
      - stream_vision/pyproject.toml
      - Makefile
      - requirements/**
      - inference/core/version.py
      - inference_sdk/**
  push:
    branches: [main]
    paths:
      - .release/**
      - .github/scripts/test_release_flow.py
      - .github/scripts/release*.py
      - .github/scripts/retry.sh
      - .github/actions/retry-tests/**
      - .github/actions/determine-tags/**
      - tests/inference/unit_tests/deployment/test_determine_tags_security.py
      - .github/workflows/release.image.yml
      - .github/workflows/publish.pypi*.yml
      - .github/workflows/test.pypi.release.yml
      - .github/workflows/*inference_sdk*.yml
      - .github/docker/Dockerfile.sdk-tests
      - .github/scripts/run_sdk_tests.sh
      - .github/scripts/test_pypi_release.py
      - .github/scripts/test_pypi_workflow_conditions.mjs
      - .github/pypi-workflow-tests/**
      - .github/docker/Dockerfile.pypi-workflow-tests
      - .github/scripts/test_pypi_dependencies.py
      - .github/scripts/test_pypi_publish.py
      - inference_models/pyproject.toml
      - workflows/pyproject.toml
      - stream_vision/pyproject.toml
      - Makefile
      - requirements/**
      - inference/core/version.py
      - inference_sdk/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-test.pypi.release-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.release_source != '' && 60 || 20 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_source || github.sha }}
          persist-credentials: false
      - name: "Test publication conditions and regression mutations in Docker [release-test]"
        uses: ./.github/actions/retry-tests
        with:
          attempts: ${{ inputs.release_source != '' && 3 || 1 }}
          command: |
            docker build --tag inference-pypi-workflow-tests --file .github/docker/Dockerfile.pypi-workflow-tests .github
            image_id=$(docker image inspect --format '{{.Id}}' inference-pypi-workflow-tests)
            echo "Source revision: $GITHUB_SHA; Docker image: $image_id"
            docker run --rm --network none -v "$GITHUB_WORKSPACE:/work:ro" "$image_id"
      - name: "Test package inventories and registry failure boundaries in Docker [release-test]"
        uses: ./.github/actions/retry-tests
        with:
          attempts: ${{ inputs.release_source != '' && 3 || 1 }}
          command: |
            docker build --tag inference-pypi-tests --file .release/pypi/Dockerfile .release/pypi
            image_id=$(docker image inspect --format '{{.Id}}' inference-pypi-tests)
            echo "Source revision: $GITHUB_SHA; Docker image: $image_id"
            docker run --rm -e SOURCE_REVISION="$GITHUB_SHA" \
              -v "$GITHUB_WORKSPACE:/work" -w /work "$image_id" \
              sh -c 'python -m black --check .release/pypi/flow.py .release/pypi/smoke.py .github/scripts/release_images.py .github/scripts/release_image_smoke.py .github/scripts/test_release_flow.py .release/pypi/release.py .release/pypi/dependencies.py .release/pypi/publish.py .github/scripts/test_pypi_release.py .github/scripts/test_pypi_dependencies.py .github/scripts/test_pypi_publish.py &&
                python -m isort --check-only .release/pypi/flow.py .release/pypi/smoke.py .github/scripts/release_images.py .github/scripts/release_image_smoke.py .github/scripts/test_release_flow.py .release/pypi/release.py .release/pypi/dependencies.py .release/pypi/publish.py .github/scripts/test_pypi_release.py .github/scripts/test_pypi_dependencies.py .github/scripts/test_pypi_publish.py &&
                python -m pytest .github/scripts/test_release_flow.py .github/scripts/test_pypi_release.py .github/scripts/test_pypi_dependencies.py .github/scripts/test_pypi_publish.py -v &&
                python -m pytest --confcutdir=tests/inference/unit_tests/deployment tests/inference/unit_tests/deployment/test_determine_tags_security.py -v'
      - name: Retain RC test attempt logs
        if: ${{ always() && inputs.release_source != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc-attempts-test.pypi.release-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-test-attempts.*/attempt-*.log
            ${{ runner.temp }}/release-test-attempts.*/attempts.txt
          if-no-files-found: warn
