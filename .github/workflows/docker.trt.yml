# Official releases are orchestrated by publish.pypi.yml / release.image.yml.
name: Build and Push TensorRT Container
permissions:
  contents: read
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      custom_tag:
        type: string
        default: ""
        description: Diagnostic tag suffix; stable release tags are reserved
      force_push:
        type: boolean
        description: "Do you want to push image after build?"
        default: false

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  VERSION: "0.0.0" # Default version, will be overwritten

jobs:
  docker:
    runs-on:
      labels: ubuntu-latest
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
      - name: Read version from file
        run: echo "VERSION=$(DISABLE_VERSION_CHECK=true python ./inference/core/version.py)" >> $GITHUB_ENV
      - name: Determine diagnostic image tags
        id: tags
        uses: ./.github/actions/determine-tags
        with:
          official-release-only: 'true'
          version: ${{ env.VERSION }}
          base_image: roboflow/roboflow-inference-server-trt
          token: ${{ github.token }}
          force_push: ${{ inputs.force_push }}
          custom_tag: ${{ inputs.custom_tag }}
      - name: Set up Depot CLI
        uses: depot/setup-action@v1
      - name: Build and Push
        uses: depot/build-push-action@v1
        with:
          push: ${{ github.event_name == 'release' || (github.event.inputs.force_push == 'true')}}
          project: grl7ffzxd7
          tags: ${{ steps.tags.outputs.image_tags }}
          platforms: linux/amd64
          file: ./docker/dockerfiles/Dockerfile.onnx.trt
