name: INTEGRATION & E2E TESTS - inference SDK
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "theme/**"
      - "mkdocs.yml"
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "theme/**"
      - "mkdocs.yml"
      - "**.md"
  workflow_dispatch:

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  call_is_mergeable:
    uses: ./.github/workflows/check_if_branch_is_mergeable.yml
    secrets: inherit

  integration-tests:
    needs: call_is_mergeable
    if: ${{ github.event_name != 'pull_request' || needs.call_is_mergeable.outputs.mergeable_state != 'not_clean' }}
    runs-on:
      labels: depot-ubuntu-22.04-4
      group: public-depot
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run SDK integration validation in Docker
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: bash .github/scripts/run_sdk_tests.sh integration "$PYTHON_VERSION"

  e2e-tests:
    needs: call_is_mergeable
    if: ${{ github.event_name != 'pull_request' || needs.call_is_mergeable.outputs.mergeable_state != 'not_clean' }}
    runs-on:
      labels: depot-ubuntu-22.04-4
      group: public-depot
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run SDK e2e validation in Docker
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: bash .github/scripts/run_sdk_tests.sh e2e "$PYTHON_VERSION"
