name: INTEGRATION & E2E TESTS - inference SDK
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      release_source:
        description: Exact prepared release commit; empty for normal CI
        type: string
        default: ''
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "theme/**"
      - "mkdocs.yml"
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "theme/**"
      - "mkdocs.yml"
      - "**.md"
  workflow_dispatch:

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-integration_e2e_tests_inference_sdk_x86-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  call_is_mergeable:
    uses: ./.github/workflows/check_if_branch_is_mergeable.yml
    secrets: inherit

  integration-tests:
    needs: call_is_mergeable
    if: ${{ github.event_name != 'pull_request' || needs.call_is_mergeable.outputs.mergeable_state != 'not_clean' }}
    runs-on:
      labels: depot-ubuntu-22.04-4
      group: public-depot
    timeout-minutes: ${{ inputs.release_source != '' && 122 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_source || github.sha }}
          persist-credentials: false
      - name: "Run SDK integration validation in Docker [release-test]"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        timeout-minutes: ${{ inputs.release_source != '' && 92 || 30 }}
        uses: ./.github/actions/retry-tests
        with:
          timeout-seconds: '1800'
          attempts: ${{ inputs.release_source != '' && 3 || 1 }}
          command: |
            bash .github/scripts/run_sdk_tests.sh integration "$PYTHON_VERSION"
      - name: Retain RC attempt exit codes
        if: ${{ always() && inputs.release_source != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc-attempts-integration_e2e_tests_inference_sdk_x86-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-test-attempts.*/attempts.txt
          if-no-files-found: warn

  e2e-tests:
    needs: call_is_mergeable
    if: ${{ github.event_name != 'pull_request' || needs.call_is_mergeable.outputs.mergeable_state != 'not_clean' }}
    runs-on:
      labels: depot-ubuntu-22.04-4
      group: public-depot
    timeout-minutes: ${{ inputs.release_source != '' && 212 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_source || github.sha }}
          persist-credentials: false
      - name: "Run SDK e2e validation in Docker [release-test]"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        timeout-minutes: ${{ inputs.release_source != '' && 182 || 60 }}
        uses: ./.github/actions/retry-tests
        with:
          timeout-seconds: '3600'
          attempts: ${{ inputs.release_source != '' && 3 || 1 }}
          command: |
            bash .github/scripts/run_sdk_tests.sh e2e "$PYTHON_VERSION"
      - name: Retain RC attempt exit codes
        if: ${{ always() && inputs.release_source != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc-attempts-integration_e2e_tests_inference_sdk_x86-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-test-attempts.*/attempts.txt
          if-no-files-found: warn
