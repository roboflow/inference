name: Build macOS Bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Artifact-only build version for the selected workflow ref. Leave empty when rebuilding a release tag.'
        type: string
        required: false
      release_tag:
        description: 'Exact source tag to rebuild, e.g. v1.8.6. Uses build tooling from the selected workflow ref.'
        type: string
        required: false
      publish_release:
        description: 'Attach the rebuilt DMG to the existing release_tag (never replaces an existing asset).'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build_osx:
    # The standard macos-15 runner is ARM64, matching the app and Homebrew paths.
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      CODESIGN_IDENTITY_STRING: "Developer ID Application: Roboflow, LLC (7SBQ39NG7G)"
      NOTARY_PROFILE_NAME: "roboflow-notary"
    steps:
      - name: Select source and release target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANUAL_VERSION: ${{ inputs.manual_version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          publish=false
          if [ "$EVENT_NAME" = release ]; then
            tag="$EVENT_TAG"
            publish=true
            if [ -z "$tag" ]; then
              echo 'Release event is missing its tag.' >&2
              exit 1
            fi
          elif [ "$PUBLISH_RELEASE" = true ]; then
            publish=true
            if [ -z "$tag" ]; then
              echo 'Publishing requires an exact release_tag.' >&2
              exit 1
            fi
          fi
          if [ -n "$tag" ] && [ -n "$MANUAL_VERSION" ]; then
            echo 'Use release_tag or manual_version, not both.' >&2
            exit 1
          fi
          source_ref="$GITHUB_SHA"
          version="${MANUAL_VERSION#v}"
          version="${version:-0.0.0-manual-dev}"
          if [ -n "$tag" ]; then
            if [[ ! "$tag" =~ ^v?[0-9][A-Za-z0-9.+_-]{0,127}$ ]]; then
              echo 'Invalid release tag.' >&2
              exit 1
            fi
            source_ref="refs/tags/$tag"
            version="${tag#v}"
          fi
          if [[ ! "$version" =~ ^[0-9][A-Za-z0-9.+_-]{0,127}$ ]]; then
            echo 'Invalid installer version.' >&2
            exit 1
          fi
          {
            echo "source_ref=$source_ref"
            echo "version=$version"
            echo "release_tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout application source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.source_ref }}
          persist-credentials: false

      # Recovery must use the fixed packaging tools without relabeling main's
      # application code as an older release. build.py runs in the tag's cwd.
      - name: Checkout build tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .bundle-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app_bundles/osx/build.py
            /app_bundles/osx/hooks/hook-torchvision.py
            /app_bundles/osx/smoke_test.py

      - name: Record build source and install packaging hook
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          echo "KEYCHAIN_NAME=$RUNNER_TEMP/build-keychain.keychain-db" >> "$GITHUB_ENV"
          {
            echo "### macOS DMG $BUILD_VERSION"
            echo "Application commit: $(git rev-parse HEAD)"
            echo "Build tooling commit: $(git -C .bundle-tools rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
          cp .bundle-tools/app_bundles/osx/hooks/hook-torchvision.py app_bundles/osx/hooks/

      - name: Check existing release before building
        if: steps.target.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
          BUILD_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          metadata=$(gh release view "$RELEASE_TAG" --json isDraft,assets)
          if [ "$(jq -r '.isDraft' <<< "$metadata")" != false ]; then
            echo 'Recovery requires an already published release.' >&2
            exit 1
          fi
          if jq -e --arg name "Roboflow-Inference-${BUILD_VERSION}.dmg" '.assets | any(.name == $name)' <<< "$metadata"; then
            echo 'The release already has this DMG; refusing to replace it.' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          # Add Homebrew to PATH for this step and subsequent ones in the job
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install Pyenv build dependencies (and OpenSSL for system if needed by Pyenv)
        run: |
          brew install openssl readline sqlite3 xz zlib tcl-tk
        shell: bash

      - name: Install pyenv and Python 3.12.3
        run: |
          brew install pyenv
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init --path)"
          eval "$(pyenv init -)"
          pyenv install 3.12.3
          pyenv global 3.12.3
          # Add pyenv shims to GITHUB_PATH for subsequent steps
          echo "$(pyenv root)/shims" >> $GITHUB_PATH
          echo "Installed Python version:"
          python --version
          echo "Pip version:"
          pip --version
          echo "Path to Python:"
          which python
          echo "Path to Pip:"
          which pip
        shell: bash

      - name: Import Apple Certificate and Key
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_TEMP_PASSWORD: "temp_keychain_password" # A temporary password for the keychain itself
        run: |
          echo "Creating temporary keychain: $KEYCHAIN_NAME"
          security create-keychain -p "$KEYCHAIN_TEMP_PASSWORD" "$KEYCHAIN_NAME"
          # Make the new keychain default, keeping login.keychain in search path
          security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain
          security default-keychain -s "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_TEMP_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -t 7200 -u "$KEYCHAIN_NAME"

          echo "Decoding and importing certificate..."
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          # Import certificate into the keychain, allowing codesign to use it without prompts
          security import certificate.p12 -k "$KEYCHAIN_NAME" -P "" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security
          rm -f certificate.p12

          echo "Setting key partition list to allow codesign access from non-interactive sessions..."
          # This is crucial for allowing codesign to access the imported key in CI
          # Use the CODESIGN_IDENTITY_STRING from the job environment
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_TEMP_PASSWORD" -t private "$KEYCHAIN_NAME"

          echo "Keychain setup complete. Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_NAME"

      - name: Configure Notarytool
        env:
          NOTARY_APPLE_ID_SECRET: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID_SECRET: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
        run: |
          echo "Configuring Notarytool for profile: $NOTARY_PROFILE_NAME"
          xcrun notarytool store-credentials "$NOTARY_PROFILE_NAME" --keychain "$KEYCHAIN_NAME" --apple-id "$NOTARY_APPLE_ID_SECRET" --team-id "$NOTARY_TEAM_ID_SECRET" --password "$NOTARY_APP_SPECIFIC_PASSWORD_SECRET"
          echo "Notarytool configured."


      - name: Build local inference wheels
        shell: bash # Ensures 'make' and 'rm -rf' work as expected
        run: make create_wheels
        # Add the ls/dir dist/* after this if you want to see the output
        # For bash:
        #   echo "--- Contents of dist/ after building all wheels ---"
        #   ls -la dist/

      - name: Install inference and dependencies from local wheels
        shell: bash # Using bash for wildcard expansion in pip install
        run: |
          WHEEL_FILE=$(ls dist/inference-*.whl)
          echo "Found GPU wheel: $WHEEL_FILE"
          pip install --find-links=./dist/ dist/roboflow_workflows-*.whl dist/streamvision-*.whl dist/inference_sdk-*.whl "$WHEEL_FILE[sam,transformers,clip,http,yolo-world,grounding-dino]"
          echo "--- Installed inference details ---"
          pip show inference


      - name: Install PyInstaller and other build dependencies
        working-directory: ./app_bundles/osx # Adjusted path
        run: |
          echo "DEBUG: Checking for OpenSSL libraries before pip install..."
          ls -l /opt/homebrew/opt/openssl@3/lib/libssl.3.dylib || echo "libssl.3.dylib from openssl@3 not found (as expected after removal)"
          ls -l /opt/homebrew/opt/openssl@3/lib/libcrypto.3.dylib || echo "libcrypto.3.dylib from openssl@3 not found (as expected after removal)"
          echo "DEBUG: Checking for default OpenSSL (typically openssl@1.1 or similar from 'brew install openssl')..."
          ls -l /opt/homebrew/opt/openssl/lib/libssl.dylib || echo "default libssl.dylib not found"
          ls -l /opt/homebrew/opt/openssl/lib/libcrypto.dylib || echo "default libcrypto.dylib not found"
          pip install --upgrade pip
          pip install --upgrade pyinstaller pyinstaller-hooks-contrib
          pip install -r requirements.txt # This now only installs pyinstaller
          echo "DEBUG: PyInstaller version:"
          pip show pyinstaller
          echo "DEBUG: pyinstaller-hooks-contrib version:"
          pip show pyinstaller-hooks-contrib

      - name: Build macOS app and DMG
        working-directory: ./app_bundles/osx # Adjusted path
        env:
          BUILD_VERSION: ${{ steps.target.outputs.version }} # Pass determined version
          NOTARY_KEYCHAIN_PATH: ${{ env.KEYCHAIN_NAME }}
        run: python "$GITHUB_WORKSPACE/.bundle-tools/app_bundles/osx/build.py"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Roboflow-Inference-DMG-${{ steps.target.outputs.version || 'dev' }} # Add version to artifact name
          path: app_bundles/osx/Roboflow-Inference-${{ steps.target.outputs.version || 'unknown' }}.dmg
          if-no-files-found: error

      - name: Verify and smoke test the DMG
        working-directory: ./app_bundles/osx
        timeout-minutes: 10
        env:
          BUILD_VERSION: ${{ steps.target.outputs.version }}
        run: python "$GITHUB_WORKSPACE/.bundle-tools/app_bundles/osx/smoke_test.py" --dmg "Roboflow-Inference-${BUILD_VERSION}.dmg"

      - name: Upload DMG to Release
        if: steps.target.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
          BUILD_VERSION: ${{ steps.target.outputs.version }}
        # gh release upload requires an existing release and, without --clobber,
        # fails if another run has uploaded this asset since the preflight.
        run: gh release upload "$RELEASE_TAG" "app_bundles/osx/Roboflow-Inference-${BUILD_VERSION}.dmg"

      - name: List dist output directory
        working-directory: ./app_bundles/osx/dist # Adjusted path
        run: ls -la

      - name: List osx directory
        working-directory: ./app_bundles/osx # Adjusted path
        run: ls -la

      - name: Cleanup Keychain
        if: always() # Always run this step to ensure cleanup
        run: |
          echo "Deleting temporary keychain: ${{ env.KEYCHAIN_NAME }}"
          security delete-keychain "${{ env.KEYCHAIN_NAME }}" || echo "Keychain ${{ env.KEYCHAIN_NAME }} not found or already deleted."
