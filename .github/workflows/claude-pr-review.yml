name: Claude PR Review
# Immutable run metadata binds the result to the original event, not live PR state.
run-name: 'Claude review PR #${{ github.event.pull_request.number || inputs.pr_number }} at ${{ github.event.pull_request.head.sha || inputs.head_sha }} using workflow ${{ github.workflow_sha }}'

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  # Always use the default-branch definition. Forks are excluded before any job
  # runs. The reviewer only reads PR source; it never executes PR code.
  pull_request_target:
    branches: [main]
    # `labeled` requests a re-review (add the `claude-review` label; it is consumed
    # when the review starts, so a fresh request is always a plain add). The other
    # three drive the single automatic INITIAL review. Pushes never auto-trigger.
    types: [opened, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Same-repository PR number to review"
        required: true
        type: number
      head_sha:
        description: "Exact current PR head SHA (40 lowercase hex characters)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Decide whether to review
    # Cheap eligibility filter; the step does the full validation + gate decision.
    # A `labeled` event only survives when the label is exactly `claude-review`.
    # The `skip-claude-review` label is an explicit opt-out: its presence short-circuits
    # every automatic pull_request trigger here (the step re-checks it authoritatively).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft &&
        github.event.pull_request.user.type != 'Bot' &&
        !contains(github.event.pull_request.labels.*.name, 'skip-claude-review') &&
        (
          github.event.action != 'labeled' ||
          github.event.label.name == 'claude-review'
        )
      )
    runs-on: ubuntu-latest
    outputs:
      should_review: ${{ steps.gate.outputs.should_review }}
      number: ${{ steps.gate.outputs.number }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
    steps:
      - name: Resolve, validate, and gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISPATCH_PR: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          TRUSTED_BASE_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail

          MARKER='<!-- claude-pr-review:run-marker -->'
          REVIEW_LABEL='claude-review'
          SKIP_LABEL='skip-claude-review'

          case "$GH_EVENT_NAME" in
            workflow_dispatch) pr_number="$DISPATCH_PR" ;;
            pull_request_target) pr_number="$PR_NUMBER" ;;
            *)                 echo "::error::Unexpected event ${GH_EVENT_NAME}"; exit 1 ;;
          esac

          pr_json="$(gh api "repos/${REPO}/pulls/${pr_number}")"
          state="$(echo "$pr_json"  | jq -r '.state')"
          base_ref="$(echo "$pr_json" | jq -r '.base.ref')"
          base_sha="$TRUSTED_BASE_SHA"
          head_sha="$(echo "$pr_json" | jq -r '.head.sha')"
          head_repo="$(echo "$pr_json" | jq -r '.head.repo.full_name')"
          draft="$(echo "$pr_json" | jq -r '.draft')"
          author_type="$(echo "$pr_json" | jq -r '.user.type')"

          emit() {
            {
              echo "should_review=$1"
              echo "number=${pr_number}"
              echo "base_sha=${base_sha}"
              echo "head_sha=${head_sha}"
            } >> "$GITHUB_OUTPUT"
          }
          skip() { echo "::notice::PR #${pr_number}: $1 — skipping review."; emit false; exit 0; }

          # Explicit opt-out. Checked FIRST so the `skip-claude-review` label suppresses
          # the review ahead of every other path — the automatic initial review, a
          # `claude-review` re-review request, and a manual workflow_dispatch alike.
          # Case-insensitive match to mirror GitHub's contains() in the job-level filter
          # (GitHub label names are case-insensitively unique).
          if echo "$pr_json" | jq -e --arg l "$SKIP_LABEL" '.labels[]? | select((.name // "" | ascii_downcase) == ($l | ascii_downcase))' >/dev/null; then
            skip "labeled '${SKIP_LABEL}'"
          fi

          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || skip "invalid requested revision"
          [ "$head_sha" = "$EXPECTED_HEAD_SHA" ] || skip "PR moved since the review request"
          [ "$state" = "open" ]          || skip "not open"
          [ "$base_ref" = "main" ]       || skip "targets ${base_ref}, not main"
          [ "$head_repo" = "${REPO}" ]   || skip "from a fork (${head_repo})"
          [ "$draft" = "false" ]         || skip "is a draft"
          [ "$author_type" != "Bot" ]    || skip "opened by a bot"

          # workflow_dispatch is a manual override — always review.
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ]; then
            emit true; exit 0
          fi

          # Label-triggered re-review: proceed whenever the `claude-review` label is
          # added. Labels can only be set by repo collaborators, so this is inherently
          # access-gated (no MEMBER/OWNER re-check needed).
          if [ "$EVENT_ACTION" = "labeled" ]; then
            [ "$LABEL_NAME" = "$REVIEW_LABEL" ] || skip "label '${LABEL_NAME}' is not '${REVIEW_LABEL}'"
            emit true; exit 0
          fi

          # Otherwise this is opened / reopened / ready_for_review → the single
          # automatic INITIAL review. If a review-start marker already exists a review
          # has already run, so do NOT auto-review again; a fresh review must be
          # requested by adding the `${REVIEW_LABEL}` label.
          comments="$(gh api --paginate "repos/${REPO}/issues/${pr_number}/comments" | jq -s 'add // []')"
          last_marker="$(echo "$comments" | jq -r --arg m "$MARKER" '[.[]|select(.body|contains($m))|.created_at]|max // ""')"
          [ -z "$last_marker" ] || skip "initial review already ran (marker present); add the '${REVIEW_LABEL}' label to request a re-review"

          emit true

  review:
    name: Review pull request
    needs: gate
    if: needs.gate.outputs.should_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      verdict: ${{ steps.claude.outputs.structured_output }}

    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Load review prompt
        id: review-prompt
        run: |
          if [ ! -f .github/prompts/claude-pr-review.md ]; then
            echo "prompt_available=false" >> "$GITHUB_OUTPUT"
            echo "Trusted base branch does not contain .github/prompts/claude-pr-review.md; skipping Claude review."
            exit 0
          fi

          if [ ! -d .claude/skills ]; then
            echo "::error::Trusted review skills are missing; refusing an incomplete review."
            exit 1
          fi

          {
            echo "prompt<<EOF"
            echo "REPO: ${{ github.repository }}"
            echo "PR NUMBER: ${{ needs.gate.outputs.number }}"
            echo "BASE SHA: ${{ needs.gate.outputs.base_sha }}"
            echo "HEAD SHA: ${{ needs.gate.outputs.head_sha }}"
            echo "PR SOURCE DIRECTORY: review-source (all reviewed code is under this directory; the root checkout is trusted base code)"
            echo 'Return structured verdict pass only if the merge-readiness gate passes and you posted the exact Pass Comment in THIS run. Otherwise return blocked or skipped.'
            echo
            cat .github/prompts/claude-pr-review.md
            echo "EOF"
            echo "prompt_available=true"
          } >> "$GITHUB_OUTPUT"

      - name: Install and verify Claude Code
        id: claude-code
        if: steps.review-prompt.outputs.prompt_available == 'true'
        env:
          # Match the CLI version bundled with the pinned review action below.
          CLAUDE_CODE_VERSION: "2.1.265"
          # linux-x64 checksum from the release's manifest.json.
          CLAUDE_CODE_SHA256: e14738e3a58d1fc6ccc23b9c919451b4846bc27074a3fb48db976a7d595bdeeb
        run: |
          set -euo pipefail
          # Use the release binary directly: the native installer can report
          # success without creating its ~/.local/bin/claude launcher.
          install_dir="$(mktemp -d "${RUNNER_TEMP}/claude-code.XXXXXX")"
          cd "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://downloads.claude.ai/claude-code-releases/${CLAUDE_CODE_VERSION}/linux-x64/claude" \
            --output claude
          printf '%s  claude\n' "$CLAUDE_CODE_SHA256" | sha256sum --check --strict
          chmod +x claude
          ./claude --version
          echo "executable=${install_dir}/claude" >> "$GITHUB_OUTPUT"

      # Keep the agent's working directory and configuration on the trusted base.
      # PR source is data in a subdirectory, never a shell/action working directory.
      - name: Checkout PR source for static reading
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: review-source
          fetch-depth: 1
          persist-credentials: false

      - name: Post review-start marker
        if: steps.review-prompt.outputs.prompt_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.gate.outputs.number }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          REVIEW_RUN: ${{ github.run_id }}
          REVIEW_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Posted once we know a review will actually run (prompt present). The gate
          # treats this marker as "an initial review has already happened", so later
          # opened/reopened/ready_for_review events skip; it also tells contributors
          # how to request a re-review.
          body="$(printf '%s\n' \
            '<!-- claude-pr-review:run-marker -->' \
            "<!-- claude-pr-review:run=${REVIEW_RUN}:${REVIEW_ATTEMPT} -->" \
            "🤖 **Claude review started** at commit \`${HEAD_SHA}\`." \
            '' \
            'New commits are **not** auto-reviewed. Add the **`claude-review`** label to request a re-review — the label is consumed when the review starts, so just add it again next time.')"
          gh pr comment "$PR" --repo "$REPO" --body "$body"

      - name: Consume the re-review label
        if: steps.review-prompt.outputs.prompt_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.gate.outputs.number }}
        run: |
          set -euo pipefail
          # The `claude-review` label is a one-shot request button: consume it as the
          # review starts, so the PR never carries a stale "review requested" label
          # and the next request is a plain add (no remove-&-re-add dance). Removing
          # it cannot retrigger this workflow: `unlabeled` is not a trigger type, and
          # GITHUB_TOKEN-driven events do not spawn new runs anyway.
          gh api -X DELETE "repos/${REPO}/issues/${PR}/labels/claude-review" \
            || echo "label not present — nothing to consume"

      - name: Claude review
        id: claude
        if: steps.review-prompt.outputs.prompt_available == 'true'
        uses: anthropics/claude-code-action@0d0e0876d3eaa933f45dc692f7a4312c83caf36f # v1
        env:
          DISABLE_AUTOUPDATER: "1"
        with:
          path_to_claude_code_executable: ${{ steps.claude-code.outputs.executable }}
          anthropic_api_key: ${{ secrets.TMP_PAWELS_CLAUDE_API_KEY_USE_WISELY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          include_fix_links: false
          display_report: false
          show_full_output: false
          prompt: ${{ steps.review-prompt.outputs.prompt }}
          settings: '{"disableAllHooks":true,"enableAllProjectMcpServers":false}'
          claude_args: |
            --model claude-opus-4-8
            --max-turns 80
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","blocked","skipped"]}},"required":["verdict"],"additionalProperties":false}'
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/*/*/issues/*/comments --paginate),Bash(gh api repos/*/*/pulls/*/comments --paginate),Bash(gh api repos/*/*/pulls/*/reviews --paginate),Bash(gh api repos/*/*/pulls/*/commits --paginate),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"

  handoff-result:
    name: Record maintainer handoff result
    needs: [gate, review]
    if: needs.gate.outputs.should_review == 'true' && fromJSON(needs.review.outputs.verdict || '{}').verdict == 'pass'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # A fresh runner, trusted base code, and NO Slack credentials. The agent's
      # workspace and processes cannot affect this collector.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.31"
          enable-cache: false
      - name: Install locked collector CLI dependency
        run: |
          uv venv "$RUNNER_TEMP/maintainer-review"
          uv export --locked --script .github/scripts/maintainer_review.py --format requirements-txt --output-file "$RUNNER_TEMP/handoff-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/maintainer-review/bin/python" --require-hashes --requirements "$RUNNER_TEMP/handoff-requirements.txt"
      - name: Record a fresh pass for the reviewed revision
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate.outputs.number }}
          REVIEW_HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          REVIEW_VERDICT: ${{ needs.review.outputs.verdict }}
          RESULT_PATH: ${{ runner.temp }}/result.json
        run: '"$RUNNER_TEMP/maintainer-review/bin/python" .github/scripts/maintainer_review.py collect'
      - name: Publish handoff data
        if: steps.result.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: maintainer-review-result-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result.json
          retention-days: 7
          if-no-files-found: error
