name: UNIT TESTS - inference-models
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "theme/**"
      - "theme_build/**"
      - "mkdocs.yml"
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "theme/**"
      - "theme_build/**"
      - "mkdocs.yml"
      - "**.md"
  workflow_dispatch:

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  unit-tests-inference-models:
    runs-on:
      labels: depot-ubuntu-22.04-4
      group: public-depot
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: 📦 Install dependencies
        working-directory: inference_models
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          python -m uv venv
          # Numerical embedding graph tests exercise the ONNX CPU backend.
          python -m uv pip install -e .[torch-cpu,onnx-cpu,test,model-blob-cache] --python .venv
      - name: 🧪 Unit Tests
        timeout-minutes: 30
        working-directory: inference_models
        run: |
          source .venv/bin/activate
          python -m pytest -n auto -m "not gpu_only" tests/unit_tests
