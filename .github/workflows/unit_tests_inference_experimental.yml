name: UNIT TESTS - inference-models
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      release_source:
        description: Exact prepared release commit; empty for normal CI
        type: string
        default: ''
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "theme/**"
      - "mkdocs.yml"
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "theme/**"
      - "mkdocs.yml"
      - "**.md"
  workflow_dispatch:

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-unit_tests_inference_experimental-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  unit-tests-inference-models:
    runs-on:
      labels: depot-ubuntu-22.04-4
      group: public-depot
    timeout-minutes: ${{ inputs.release_source != '' && 121 || 15 }}
    strategy:
      fail-fast: ${{ inputs.release_source == '' }}
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_source || github.sha }}
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: 📦 Install dependencies
        working-directory: inference_models
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          python -m uv venv
          # Numerical embedding graph tests exercise the ONNX CPU backend.
          python -m uv pip install -e .[torch-cpu,onnx-cpu,test,model-blob-cache] --python .venv
      - name: "🧪 Unit Tests [release-test]"
        timeout-minutes: ${{ inputs.release_source != '' && 91 || 31 }}
        uses: ./.github/actions/retry-tests
        with:
          timeout-seconds: '1800'
          attempts: ${{ inputs.release_source != '' && 3 || 1 }}
          working-directory: inference_models
          command: |
            source .venv/bin/activate
            python -m pytest -n auto -m "not gpu_only" tests/unit_tests
      - name: Retain RC attempt exit codes
        if: ${{ always() && inputs.release_source != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc-attempts-unit_tests_inference_experimental-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-test-attempts.*/attempts.txt
          if-no-files-found: warn
