name: Build and Push Jetson 7.2.0 Wheels Container

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker.wheels.jetson.7.2.0.yml"
      - "docker/dockerfiles/Dockerfile.wheels.jetson.7.2.0"
      - "docker/docker-bake.jetson.7.2.0.hcl"
      - "docker/patches/**"
  workflow_dispatch:
    inputs:
      force_push:
        type: boolean
        description: "Do you want to push the image after building?"
        default: false
      custom_tag:
        type: string
        description: "Custom tag to use for the image"
        default: ""

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  VERSION: "0.0.0"
  BASE_IMAGE: "roboflow/roboflow-inference-wheels-jetson-7.2.0"

jobs:
  # Build the dependency graph as actual parallel Actions steps. Depot shares the
  # project cache between invocations, so child stages reuse Torch rather than
  # compiling it again on their dedicated 64-core builders.
  components:
    name: Build JP7.2 framework wheel components
    runs-on:
      labels: depot-ubuntu-24.04
      group: public-depot
    timeout-minutes: 1440
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
      - name: Build Torch
        id: torch
        background: true
        uses: depot/bake-action@1d58c2668346981089b088b7ef36755b206b20e9 # v1.13.0
        with:
          files: ./docker/docker-bake.jetson.7.2.0.hcl
          targets: jetson-wheels-torch-jp72
          project: v1xzfwkc4b

      - parallel:
          - name: Build ONNX Runtime
            uses: depot/bake-action@1d58c2668346981089b088b7ef36755b206b20e9 # v1.13.0
            with:
              files: ./docker/docker-bake.jetson.7.2.0.hcl
              targets: jetson-wheels-ort-jp72
              project: v1xzfwkc4b
          - name: Fetch Triton
            uses: depot/bake-action@1d58c2668346981089b088b7ef36755b206b20e9 # v1.13.0
            with:
              files: ./docker/docker-bake.jetson.7.2.0.hcl
              targets: jetson-wheels-triton-jp72
              project: v1xzfwkc4b
          - name: Build PyCUDA
            uses: depot/bake-action@1d58c2668346981089b088b7ef36755b206b20e9 # v1.13.0
            with:
              files: ./docker/docker-bake.jetson.7.2.0.hcl
              targets: jetson-wheels-pycuda-jp72
              project: v1xzfwkc4b

      - name: Wait for Torch
        wait: torch

      - parallel:
          - name: Build torchvision
            uses: depot/bake-action@1d58c2668346981089b088b7ef36755b206b20e9 # v1.13.0
            with:
              files: ./docker/docker-bake.jetson.7.2.0.hcl
              targets: jetson-wheels-torchvision-jp72
              project: v1xzfwkc4b
          - name: Build FlashAttention
            uses: depot/bake-action@1d58c2668346981089b088b7ef36755b206b20e9 # v1.13.0
            with:
              files: ./docker/docker-bake.jetson.7.2.0.hcl
              targets: jetson-wheels-flash-attn-jp72
              project: v1xzfwkc4b

  assemble:
    name: Assemble wheels image
    needs: components
    runs-on:
      labels: depot-ubuntu-24.04-4
      group: public-depot
    timeout-minutes: 180
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Docker Hub
        if: ${{ github.event_name == 'release' || inputs.force_push == true }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Read version from file
        run: echo "VERSION=$(DISABLE_VERSION_CHECK=true python ./inference/core/version.py)" >> "$GITHUB_ENV"
      - name: Determine image tags
        id: tags
        uses: ./.github/actions/determine-tags
        with:
          custom_tag: ${{ inputs.custom_tag }}
          version: ${{ env.VERSION }}
          base_image: ${{ env.BASE_IMAGE }}
          force_push: ${{ inputs.force_push }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
      - name: Build image
        uses: depot/bake-action@1d58c2668346981089b088b7ef36755b206b20e9 # v1.13.0
        env:
          JETSON_WHEELS_TAGS: ${{ steps.tags.outputs.image_tags }}
        with:
          files: ./docker/docker-bake.jetson.7.2.0.hcl
          targets: jetson-wheels-jp72
          project: v1xzfwkc4b
          push: ${{ github.event_name == 'release' || inputs.force_push == true }}
          save: ${{ github.event_name != 'release' && !inputs.force_push }}
          save-tag: ${{ github.event_name != 'release' && !inputs.force_push && format('wheels-jp72-{0}', github.sha) || '' }}
