name: UNIT TESTS - workflows (tensor-native)
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  call_is_mergeable:
    uses: ./.github/workflows/check_if_branch_is_mergeable.yml
    secrets: inherit
  build-dev-test:
    needs: call_is_mergeable
    if: ${{ github.event_name != 'pull_request' || needs.call_is_mergeable.outputs.mergeable_state != 'not_clean' }}
    runs-on:
      labels: depot-ubuntu-22.04-4
      group: public-depot
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
      - name: 📦 Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements/**', 'workflows/pyproject.toml', 'workflows/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: 🔤 Cache Workflows font assets
        uses: actions/cache@v5
        with:
          path: workflows/roboflow_workflows/core_steps/visualizations/common/fonts/assets
          key: workflows-fonts-${{ hashFiles('workflows/roboflow_workflows/core_steps/visualizations/common/fonts/registry.py') }}
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools
          pip install -r requirements/_requirements.txt -r requirements/requirements.cpu.txt -r requirements/requirements.easyocr.txt -r requirements/requirements.sdk.http.txt -r requirements/requirements.test.unit.txt -r requirements/requirements.http.txt -r requirements/requirements.transformers.txt
          pip install --no-deps ./inference_models
      - name: 🏗️ Build roboflow-workflows + SDK + inference-models wheels
        run: make create_isolation_wheels
      - name: 📦 Install roboflow-workflows (test + enterprise extras) from local wheel
        run: pip install --find-links "${{ github.workspace }}/dist" "$(ls "${{ github.workspace }}"/dist/roboflow_workflows-*.whl)[test,enterprise]" "${{ github.workspace }}"/dist/inference_sdk-*.whl "${{ github.workspace }}"/dist/inference_models-*.whl
      - name: 🧪 Server unit tests (tensor-native)
        # ENABLE_TENSOR_DATA_REPRESENTATION is AND-gated with USE_INFERENCE_MODELS,
        # which defaults to True on Linux runners, so the tensor-native code path is exercised.
        timeout-minutes: 30
        run: ENABLE_TENSOR_DATA_REPRESENTATION=True python -m pytest tests/workflows/unit_tests

  package-tests:
    needs: call_is_mergeable
    if: ${{ github.event_name != 'pull_request' || needs.call_is_mergeable.outputs.mergeable_state != 'not_clean' }}
    runs-on:
      labels: depot-ubuntu-22.04-4
      group: public-depot
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      ENABLE_TENSOR_DATA_REPRESENTATION: "True"
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      PIP_CONSTRAINT: ${{ github.workspace }}/workflows/tests/isolation/constraints-cpu.txt
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            workflows/pyproject.toml
            workflows/uv.lock
            workflows/tests/isolation/constraints-cpu.txt
      - name: Build same-checkout wheels and check lock
        run: make create_isolation_wheels
      - name: Install only standalone package dependencies
        run: |
          pip install --find-links "${{ github.workspace }}/dist" \
            "$(ls "${{ github.workspace }}"/dist/roboflow_workflows-*.whl)[test,enterprise]" \
            "${{ github.workspace }}"/dist/inference_sdk-*.whl \
            "${{ github.workspace }}"/dist/inference_models-*.whl
          pip check
      - name: Package unit and installed-wheel isolation tests
        working-directory: workflows
        env:
          WORKFLOWS_ISOLATION_FIND_LINKS: ${{ github.workspace }}/dist
        run: |
          WORKFLOWS_ISOLATION_WHEEL="$(ls "${{ github.workspace }}"/dist/roboflow_workflows-*.whl)" \
            python -m pytest tests/unit_tests tests/isolation
