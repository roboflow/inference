name: UNIT TESTS - inference-model-manager & inference-server
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      release_source:
        description: Exact prepared release commit; empty for normal CI
        type: string
        default: ''
  pull_request:
    branches: [main]
    paths:
      - inference_models/**
      - inference_model_manager/**
      - inference_server/**
      - workflows/**
      - stream_vision/**
      - scripts/**
  push:
    branches: [main]
    paths:
      - inference_models/**
      - inference_model_manager/**
      - inference_server/**
      - workflows/**
      - stream_vision/**
      - scripts/**
  workflow_dispatch:

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-unit_tests_inference_model_manager_and_server-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  call_is_mergeable:
    uses: ./.github/workflows/check_if_branch_is_mergeable.yml
    secrets: inherit
  unit-tests-inference-model-manager-and-server:
    needs: call_is_mergeable
    if: ${{ github.event_name != 'pull_request' || needs.call_is_mergeable.outputs.mergeable_state != 'not_clean' }}
    runs-on:
      labels: depot-ubuntu-22.04-4
      group: public-depot
    timeout-minutes: ${{ inputs.release_source != '' && 154 || 15 }}
    strategy:
      fail-fast: ${{ inputs.release_source == '' }}
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_source || github.sha }}
          persist-credentials: false
      - name: 📅 Cache week
        id: cache-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: 📦 Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ steps.cache-week.outputs.week }}-${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('inference_models/pyproject.toml', 'inference_model_manager/pyproject.toml', 'inference_server/pyproject.toml', 'workflows/pyproject.toml', 'stream_vision/pyproject.toml') }}
          restore-keys: |
            ${{ steps.cache-week.outputs.week }}-${{ runner.os }}-uv-${{ matrix.python-version }}-
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: 📦 Install dependencies (local sources)
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          python -m uv venv
          python -m uv pip install -e inference_models[test] --python .venv
          python -m uv pip install -e inference_model_manager[test] --python .venv
          python -m uv pip install -e workflows[test] --python .venv
          python -m uv pip install -e stream_vision --python .venv
          python -m uv pip install -e inference_server[test,workflows] --python .venv
      - name: "🧪 Unit Tests of Inference Server [release-test]"
        timeout-minutes: ${{ inputs.release_source != '' && 31 || 11 }}
        uses: ./.github/actions/retry-tests
        with:
          timeout-seconds: '600'
          attempts: ${{ inputs.release_source != '' && 3 || 1 }}
          working-directory: inference_server
          command: |
            ../.venv/bin/pytest tests/unit_tests
      - name: "🧪 Integration Tests of Inference Server [release-test]"
        timeout-minutes: ${{ inputs.release_source != '' && 31 || 11 }}
        uses: ./.github/actions/retry-tests
        with:
          timeout-seconds: '600'
          attempts: ${{ inputs.release_source != '' && 3 || 1 }}
          working-directory: inference_server
          command: |
            ../.venv/bin/pytest tests/integration_tests
      - name: "🧪 Unit Tests of Inference Model Manager [release-test]"
        timeout-minutes: ${{ inputs.release_source != '' && 31 || 11 }}
        uses: ./.github/actions/retry-tests
        with:
          timeout-seconds: '600'
          attempts: ${{ inputs.release_source != '' && 3 || 1 }}
          working-directory: inference_model_manager
          command: |
            ../.venv/bin/pytest tests/unit_tests
      - name: 📦 Install dependencies (slim, no workflows extra)
        run: |
          python -m uv venv .venv-slim
          # inference-models is transitive here (via inference-model-manager), so
          # [tool.uv.sources] does not apply and it would come from PyPI; install
          # the checkout first, as the full env above does.
          python -m uv pip install -e inference_models --python .venv-slim
          python -m uv pip install -e stream_vision --python .venv-slim
          python -m uv pip install -e inference_server[test] --python .venv-slim
      - name: "🧪 Unit Tests of Inference Server (slim install guard) [release-test]"
        timeout-minutes: ${{ inputs.release_source != '' && 31 || 11 }}
        uses: ./.github/actions/retry-tests
        with:
          timeout-seconds: '600'
          attempts: ${{ inputs.release_source != '' && 3 || 1 }}
          working-directory: inference_server
          command: |
            ../.venv-slim/bin/python -c "import importlib.util; assert importlib.util.find_spec('roboflow_workflows') is None"
            ../.venv-slim/bin/pytest tests/unit_tests/legacy/test_slim_install.py
      - name: Retain RC attempt exit codes
        if: ${{ always() && inputs.release_source != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc-attempts-unit_tests_inference_model_manager_and_server-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-test-attempts.*/attempts.txt
          if-no-files-found: warn
