name: Google Colab GPU
permissions:
  contents: read
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build:
    if: ${{ !github.event.act }}
    runs-on: arc-gpu-runner-set
    timeout-minutes: 45

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 🛎️ Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: 🔨 Build Docker
        run: docker build -t inference-google-colab:gpu -f ./docker/dockerfiles/Dockerfile.google.colab.gpu .
      - name: 🧪 Run tests
        env:
          ROBOFLOW_API_KEY: ${{ secrets.API_KEY }}
        run: docker run -e ROBOFLOW_API_KEY --runtime nvidia inference-google-colab:gpu
