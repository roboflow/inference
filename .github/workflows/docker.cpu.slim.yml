name: Build and Push CPU Slim Container
permissions:
  contents: read
on:
  release:
    types: [created]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_push:
        type: boolean
        description: "Do you want to push image after build?"
        default: false

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  VERSION: "0.0.0" # Default version, will be overwritten

jobs:
  docker:
    runs-on:
      labels: ubuntu-latest
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
      - name: Read version from file
        run: echo "VERSION=$(DISABLE_VERSION_CHECK=true python ./inference/core/version.py)" >> $GITHUB_ENV
      - name: Set up Depot CLI
        uses: depot/setup-action@v1
      # Load a single platform for the native amd64 runner before publishing.
      - name: Build and load CPU image
        uses: depot/build-push-action@v1
        with:
          push: false
          project: grl7ffzxd7
          context: .
          load: true
          tags: roboflow/roboflow-inference-server-cpu-slim:latest,roboflow/roboflow-inference-server-cpu-slim:${{env.VERSION}}
          platforms: linux/amd64
          file: ./docker/dockerfiles/Dockerfile.onnx.cpu.parallel
      - name: Test CPU PyTorch runtime
        env:
          IMAGE_TAGS: roboflow/roboflow-inference-server-cpu-slim:latest,roboflow/roboflow-inference-server-cpu-slim:${{env.VERSION}}
        run: |
          image="${IMAGE_TAGS%%,*}"
          docker run --rm --pull=never --entrypoint /bin/sh \
            -e CPU_IMAGE_TEST=true \
            -v "${{ github.workspace }}/tests/docker/test_cpu_torch_runtime.py:/test_cpu_torch_runtime.py:ro" \
            "$image" -c 'python3 -m pip install pytest && python3 -m pytest /test_cpu_torch_runtime.py -v'
      # Reuse Depot's project cache for amd64; arm64 is built but not runtime-tested.
      - name: Build and Push
        if: ${{ github.event_name == 'release' || (github.event.inputs.force_push == 'true') }}
        uses: depot/build-push-action@v1
        with:
          push: true
          project: grl7ffzxd7
          context: .
          tags: roboflow/roboflow-inference-server-cpu-slim:latest,roboflow/roboflow-inference-server-cpu-slim:${{env.VERSION}}
          platforms: linux/amd64,linux/arm64
          file: ./docker/dockerfiles/Dockerfile.onnx.cpu.parallel
