name: Test package install - inference-sdk

on:
  workflow_call:
    inputs:
      release_source:
        description: Exact prepared release commit; empty for normal CI
        type: string
        default: ''
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-test_package_install_inference_sdk-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  call_is_mergeable:
    uses: ./.github/workflows/check_if_branch_is_mergeable.yml
    secrets: inherit

  build:
    needs: call_is_mergeable
    if: ${{ github.event_name != 'pull_request' || needs.call_is_mergeable.outputs.mergeable_state != 'not_clean' }}
    runs-on:
      labels: depot-ubuntu-22.04-4
      group: public-depot
    timeout-minutes: ${{ inputs.release_source != '' && 106 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_source || github.sha }}
          persist-credentials: false
      - name: "Run SDK install validation in Docker [release-test]"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        timeout-minutes: ${{ inputs.release_source != '' && 76 || 26 }}
        uses: ./.github/actions/retry-tests
        with:
          timeout-seconds: '1500'
          attempts: ${{ inputs.release_source != '' && 3 || 1 }}
          command: |
            bash .github/scripts/run_sdk_tests.sh install "$PYTHON_VERSION"
      - name: Retain RC attempt exit codes
        if: ${{ always() && inputs.release_source != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc-attempts-test_package_install_inference_sdk-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-test-attempts.*/attempts.txt
          if-no-files-found: warn
