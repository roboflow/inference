name: "[STAGING] Build video POC processors"

on:
  workflow_dispatch:
  push:
    branches:
      - hansent/video-poc
    paths:
      - ".github/workflows/video_poc_processor_staging.yml"
      - "development/video_poc/processor/**"

permissions:
  contents: read

concurrency:
  group: staging-video-poc-processors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on:
      labels: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: video-processor
            base: us-central1-docker.pkg.dev/roboflow-staging/video-proc/video-processor:5b99b4509
          - image: video-processor-cpu
            base: us-central1-docker.pkg.dev/roboflow-staging/video-proc/video-processor-cpu:5b99b4509
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve immutable image tag
        id: tag
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::9}" >> "$GITHUB_OUTPUT"

      - name: Set up Depot CLI
        uses: depot/setup-action@v1

      - name: Authenticate to staging Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/878913763597/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: gha-inference@roboflow-staging.iam.gserviceaccount.com
          token_format: access_token

      - name: Login to staging Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push staging image
        uses: depot/build-push-action@v1
        with:
          project: grl7ffzxd7
          context: development/video_poc/processor
          file: development/video_poc/processor/Dockerfile
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
          tags: us-central1-docker.pkg.dev/roboflow-staging/video-proc/${{ matrix.image }}:${{ steps.tag.outputs.short_sha }}
          push: true
