name: Build and Push Inference Experimental Images

on:
  workflow_dispatch:
    inputs:
      image_variant:
        type: string
        description: "Image variant to build (e.g., 'cpu', 'cu124', 'jp61') or 'all' for all images. Run 'ls inference_models/dockerfiles/' to see available options."
        required: true
        default: "all"
      force_push:
        type: boolean
        description: "Force push to registries"
        default: false
      custom_tag:
        type: string
        description: "Custom tag to use instead of version"
        required: false
  release:
    types: [published]
  push:
    branches:
      - main

env:
  DEPOT_PROJECT_ID: grl7ffzxd7

jobs:
  determine-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base-tag: ${{ steps.tags.outputs.base-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read version from pyproject.toml
        run: |
          cd inference_models
          VERSION=$(grep -E '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "VERSION=${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: generate tags
        id: tags
        env:
          CUSTOM_TAG: ${{ github.event.inputs.custom_tag }}
        run: |
          set -euo pipefail
          BASE_TAG="${CUSTOM_TAG:-$VERSION}"
          if [[ ! "$BASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag." >&2
            exit 1
          fi
          printf 'base-tag=%s\n' "$BASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.dockerfile }}:${{ matrix.platform }}
    needs: determine-tags
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      # permission lets the workflow issue OIDC tokens, required by depot.dev auth
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
          - dockerfile: "x86.cpu.base.dockerfile"
            platform: "linux/amd64"
            build_platforms: "linux/amd64"
          - dockerfile: "x86.cu118.base.dockerfile"
            platform: "cu118"
            build_platforms: "linux/amd64"
          - dockerfile: "x86.cu124.base.dockerfile"
            platform: "cu124"
            build_platforms: "linux/amd64"
          - dockerfile: "x86.cu126.base.dockerfile"
            platform: "cu126"
            build_platforms: "linux/amd64"
          - dockerfile: "x86.cu128.base.dockerfile"
            platform: "cu128"
            build_platforms: "linux/amd64"
          - dockerfile: "jp51.cu114.core.dockerfile"
            platform: "jp51"
            build_platforms: "linux/arm64"
          # - dockerfile: "jp61.cu126.base.dockerfile"
          #   platform: "jp61"
          #   build_platforms: "linux/arm64"
    steps:
      - name: Check if should build
        id: should-build
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_VARIANT: ${{ github.event.inputs.image_variant }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [[ -n "$IMAGE_VARIANT" && ! "$IMAGE_VARIANT" =~ ^[A-Za-z0-9_][A-Za-z0-9_./-]{0,127}$ ]]; then
            echo "Invalid image variant." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "release" || "$IMAGE_VARIANT" == "all" || -z "$IMAGE_VARIANT" || "$IMAGE_VARIANT" == "$PLATFORM" || ( "$IMAGE_VARIANT" == "cpu" && "$PLATFORM" == "linux/amd64" ) ]]; then
            printf 'should-build=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'should-build=false\n' >> "$GITHUB_OUTPUT"
            printf 'Skipping build for %s (selected: %s)\n' "$PLATFORM" "$IMAGE_VARIANT"
          fi

      - name: Checkout code
        if: steps.should-build.outputs.should-build == 'true'
        uses: actions/checkout@v6

      - name: Determine image tags
        if: steps.should-build.outputs.should-build == 'true'
        id: image-tags
        env:
          BASE_TAG: ${{ needs.determine-tags.outputs.base-tag }}
          PLATFORM: ${{ matrix.platform }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" == "linux/amd64" ]; then
            PLATFORM="cpu"
          fi
          for value in "$BASE_TAG" "$PLATFORM"; do
            if [[ ! "$value" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "Invalid image tag component." >&2
              exit 1
            fi
          done
          if [ "$EVENT_NAME" = "release" ]; then
            TAGS="roboflow/inference-exp:${PLATFORM}-${BASE_TAG},roboflow/inference-exp:${PLATFORM}-latest"
          elif [ "$GIT_REF" = "refs/heads/main" ]; then
            TAGS="roboflow/inference-exp:${PLATFORM}-test"
          else
            TAGS="roboflow/inference-exp:${PLATFORM}-${BASE_TAG}"
          fi
          IFS=',' read -r -a tags <<< "$TAGS"
          for image_tag in "${tags[@]}"; do
            if [[ "$image_tag" != "roboflow/inference-exp:"* ]]; then
              echo "Invalid image repository." >&2
              exit 1
            fi
            tag="${image_tag#roboflow/inference-exp:}"
            if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "Invalid generated image tag." >&2
              exit 1
            fi
          done
          printf 'tags=%s\n' "$TAGS" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Depot
        if: steps.should-build.outputs.should-build == 'true'
        uses: depot/setup-action@v1
      - name: Build and push ${{ matrix.platform }} image
        if: steps.should-build.outputs.should-build == 'true'
        uses: depot/build-push-action@v1
        with:
          push: ${{ github.event_name == 'release' || (github.event.inputs.force_push == 'true')}}
          project: grl7ffzxd7
          tags: ${{ steps.image-tags.outputs.tags }}
          platforms: ${{ matrix.build_platforms }}
          file: ./inference_models/dockerfiles/${{ matrix.dockerfile }}
          context: ./inference_models
