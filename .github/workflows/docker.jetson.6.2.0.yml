name: Build and Push Jetson 6.2.0 Container
permissions:
  contents: read
on:
  release:
    types: [created]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_push:
        type: boolean
        description: "Do you want to push image after build?"
        default: false
      custom_tag:
        type: string
        description: "Custom tag to use for the image (overrides VERSION)"
        default: ""

env:
  VERSION: "0.0.0" # Default version, will be overwritten
  BASE_IMAGE: "roboflow/roboflow-inference-server-jetson-6.2.0"

jobs:
  docker:
    runs-on:
      labels: depot-ubuntu-24.04-4
      group: public-depot
    # 480: the layer-cache chain rebuilds fully when early builder steps change
    # (BuildKit cache mounts still soften the PyTorch/ORT/OpenCV compiles), and
    # flash-attn (no cache mount) takes hours alone at MAX_JOBS=4.
    timeout-minutes: 480
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
      - name: Read version from file
        run: echo "VERSION=$(DISABLE_VERSION_CHECK=true python ./inference/core/version.py)" >> $GITHUB_ENV
      - name: Determine Image Tags
        id: tags
        uses: ./.github/actions/determine-tags
        with:
          custom_tag: ${{ github.event.inputs.custom_tag }}
          version: ${{ env.VERSION }}
          base_image: ${{ env.BASE_IMAGE }}
          force_push: ${{ github.event.inputs.force_push }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch TensorRT local repository
        env:
          TENSORRT_DEB_SHA256: cf8bd26b3b9c0f65ee8f3358bbc7abfcd4bbed4940b2220140fb108f0852e5c0
          TENSORRT_DEB_URL: https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/10.7.0/local_repo/nv-tensorrt-local-tegra-repo-ubuntu2204-10.7.0-cuda-12.6_1.0-1_arm64.deb
        run: |
          set -euo pipefail
          mkdir -p docker/vendor/tensorrt
          destination="docker/vendor/tensorrt/nv-tensorrt-local-tegra-repo-ubuntu2204-10.7.0-cuda-12.6_1.0-1_arm64.deb"
          curl \
            --fail \
            --location \
            --retry 10 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            --output "${destination}.part" \
            "${TENSORRT_DEB_URL}"
          echo "${TENSORRT_DEB_SHA256}  ${destination}.part" | sha256sum --check -
          mv "${destination}.part" "${destination}"
      - name: Set up Depot CLI
        uses: depot/setup-action@v1
      - name: Build and Push
        uses: depot/build-push-action@v1
        with:
          push: ${{ github.event_name == 'release' || (github.event.inputs.force_push == 'true')}}
          project: 2rp7mfjw7q
          tags: ${{ steps.tags.outputs.image_tags }}
          platforms: linux/arm64
          file: ./docker/dockerfiles/Dockerfile.onnx.jetson.6.2.0
