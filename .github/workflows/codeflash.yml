name: Codeflash Optimization
permissions:
  contents: read
on:
  pull_request:
    paths:
      - inference/**
  workflow_dispatch:

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  optimize:
    if: ${{ github.actor != 'codeflash-ai[bot]' && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    env:
      CODEFLASH_API_KEY: ${{ secrets.CODEFLASH_API_KEY }}
      CODEFLASH_PR_NUMBER: ${{ github.event.number }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 📦 Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('requirements/**') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          check-latest: true
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools
          pip install -r requirements/_requirements.txt -r requirements/requirements.cpu.txt -r requirements/requirements.sdk.http.txt -r requirements/requirements.test.unit.txt -r requirements/requirements.http.txt -r requirements/requirements.transformers.txt -r requirements/requirements.code_analysis.txt -r requirements/requirements.cli.txt -r requirements/requirements.test.integration.txt
      - name: ⚡️Codeflash Optimization
        run: codeflash --benchmark
