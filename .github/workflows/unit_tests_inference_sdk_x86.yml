name: UNIT TESTS - inference SDK
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "theme/**"
      - "mkdocs.yml"
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "theme/**"
      - "mkdocs.yml"
      - "**.md"
  workflow_dispatch:

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  call_is_mergeable:
    uses: ./.github/workflows/check_if_branch_is_mergeable.yml
    secrets: inherit
  build-dev-test:
    needs: call_is_mergeable
    if: ${{ github.event_name != 'pull_request' || needs.call_is_mergeable.outputs.mergeable_state != 'not_clean' }}
    runs-on:
      labels: depot-ubuntu-22.04-4
      group: public-depot
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          # Pillow 13 requires Python >=3.11. Keep the supported 12.3 floor.
          - {python-version: "3.10", pillow-version: "12.3.0"}
          - {python-version: "3.11", pillow-version: "13.0.0"}
          - {python-version: "3.12", pillow-version: "13.0.0"}
          - {python-version: "3.13", pillow-version: "13.0.0"}
          - {python-version: "3.12", pillow-version: "12.3.0"}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
      - name: 📦 Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-unit-tests-inference-sdk-${{ matrix.python-version }}-pillow-${{ matrix.pillow-version }}-${{ hashFiles('requirements/**') }}
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools
          pip install -r requirements/requirements.sdk.http.txt -r requirements/requirements.sdk.webrtc.txt -r requirements/requirements.test.unit.txt "pillow==${{ matrix.pillow-version }}"
          python -c "import PIL; print('Pillow version:', PIL.__version__)"
      - name: 🧪 Unit Tests of Inference SDK
        timeout-minutes: 30
        run: python -m pytest tests/inference_sdk/unit_tests
