name: INTEGRATION TESTS - inference_models (CPU)
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extras:
        description: 'Extras to test. Available options: onnx_extras. Leave empty to run all.'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - onnx_extras
          - torch_models
      python_version:
        description: 'Python version to test. Available options: 3.10, 3.11, 3.12. Leave empty to run all.'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - '3.10'
          - '3.11'
          - '3.12'
  workflow_call:
    # Fast-track CI (fast_track_ci.yml) calls this workflow for a branch that
    # deliberately diverged from main. `ref` is the PR head SHA to test; empty
    # keeps the default checkout for every other trigger.
    inputs:
      ref:
        description: "Git ref to check out (fast-track CI). Empty = default for the event."
        type: string
        required: false
        default: ""

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  # The literal file id keeps groups distinct when this workflow is *called*
  # (workflow_call): inside a called workflow github.workflow resolves to the
  # caller's name, so without it every workflow called by one caller would
  # share a single group and serialize.
  group: ${{ github.workflow }}-integration_tests_inference_experimental_cpu-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  integration-tests-inference-models-cpu:
    name: ${{ matrix.extras.marker }}:${{ matrix.python-version }}
    runs-on:
      labels: depot-ubuntu-22.04-4
      group: public-depot
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        extras:
          - { install: "onnx-cpu,torch-cpu", marker: "onnx_extras", workers: "auto" }
          - { install: "torch-cpu", marker: "torch_models", workers: "2" }
    steps:
      - name: 🛎️ Checkout
        if: ${{ (github.event.inputs.extras == '' || github.event.inputs.extras == matrix.extras.marker) && (github.event.inputs.python_version == '' || github.event.inputs.python_version == matrix.python-version) }}
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: 📦 Cache Python packages
        if: ${{ (github.event.inputs.extras == '' || github.event.inputs.extras == matrix.extras.marker) && (github.event.inputs.python_version == '' || github.event.inputs.python_version == matrix.python-version) }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('inference_models/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        if: ${{ (github.event.inputs.extras == '' || github.event.inputs.extras == matrix.extras.marker) && (github.event.inputs.python_version == '' || github.event.inputs.python_version == matrix.python-version) }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: 📦 Install base dependencies as well as `${{ matrix.extras.install }}` dependencies
        if: ${{ (github.event.inputs.extras == '' || github.event.inputs.extras == matrix.extras.marker) && (github.event.inputs.python_version == '' || github.event.inputs.python_version == matrix.python-version) }}
        working-directory: inference_models
        run: |
          sudo apt-get update
          sudo apt-get install -y libgles2-mesa libegl1
          python -m pip install --upgrade pip
          python -m pip install uv
          python -m uv venv
          python -m uv pip install -e .[test,${{ matrix.extras.install }}] --python .venv
      - name: 🧪 Run tests marked `${{ matrix.extras.marker }}`
        if: ${{ (github.event.inputs.extras == '' || github.event.inputs.extras == matrix.extras.marker) && (github.event.inputs.python_version == '' || github.event.inputs.python_version == matrix.python-version) }}
        working-directory: inference_models
        timeout-minutes: 25
        run: |
          source .venv/bin/activate
          python -m pytest -n ${{ matrix.extras.workers }} -m "${{ matrix.extras.marker }} and not gpu_only" tests/integration_tests
