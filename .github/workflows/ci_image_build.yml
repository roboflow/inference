name: Build private CI image
on:
  workflow_call:
    inputs:
      family:
        type: string
        required: true
      depot_project:
        description: "Depot project that builds and stores the CI image"
        type: string
        required: true
    outputs:
      index_digest:
        value: ${{ jobs.build.outputs.index_digest }}
      amd64_digest:
        value: ${{ jobs.build.outputs.amd64_digest }}
      arm64_digest:
        value: ${{ jobs.build.outputs.arm64_digest }}

permissions:
  contents: read

# Saves the image in Depot Registry (project-scoped, digest-addressed). GitHub
# OIDC through the org-level Depot connection authenticates the CLI, as in every
# other Depot workflow here; no registry credential or Depot token is stored.
jobs:
  build:
    if: ${{ github.repository == 'roboflow/inference' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_FAMILY: ${{ inputs.family }}
      DEPOT_PROJECT_ID: ${{ inputs.depot_project }}
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILD_RECORD_UPLOAD: false
    outputs:
      index_digest: ${{ steps.build.outputs.index_digest }}
      amd64_digest: ${{ steps.build.outputs.amd64_digest }}
      arm64_digest: ${{ steps.build.outputs.arm64_digest }}
    steps:
      - name: Initialize isolated registry credentials directory
        id: ci_docker_config
        run: |
          umask 077
          directory="$(mktemp -d "$RUNNER_TEMP/ci-docker.XXXXXXXX")"
          echo "DOCKER_CONFIG=$directory" >> "$GITHUB_ENV"
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate trusted source and destination before authentication
        env:
          CI_DEPOT_ACTION: validate
        run: python3 .github/scripts/depot_ci_image.py
      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
      - name: Set up Buildx for manifest inspection
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Save image once and record platform digests
        id: build
        env:
          CI_DEPOT_ACTION: build
        run: python3 .github/scripts/depot_ci_image.py
      # Keep Buildx state until setup-buildx completes its post-job cleanup.
      - name: Remove registry credentials
        if: ${{ always() && steps.ci_docker_config.outcome == 'success' }}
        run: rm -f -- "$DOCKER_CONFIG/config.json"
