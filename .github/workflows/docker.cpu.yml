name: Build and Push CPU Container
permissions:
  contents: read
on:
  release:
    types: [created]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_push:
        type: boolean
        description: "Do you want to push image after build?"
        default: false
      custom_tag:
        type: string
        description: "Custom tag to use for the image (overrides VERSION)"
        default: ""
  workflow_call:
    # Called by fast_track_integration_tests.yml. A non-empty custom_tag is
    # mandatory on this path: an empty one would publish to the bare
    # :$VERSION tag and overwrite the released image.
    inputs:
      force_push:
        type: boolean
        description: "Push the image after build"
        default: false
      custom_tag:
        type: string
        description: "Tag suffix; final tag is <VERSION>-<custom_tag>"
        required: true
    outputs:
      image_tag:
        description: "Tag (without repository) the image was pushed under, e.g. 1.6.2-post3-rc1"
        value: ${{ jobs.docker.outputs.image_tag }}

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  # The literal file id keeps groups distinct when this workflow is called
  # (github.workflow is the caller's name inside a called workflow).
  group: ${{ github.workflow }}-docker_cpu-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  VERSION: "0.0.0" # Default version, will be overwritten
  BASE_IMAGE: "roboflow/roboflow-inference-server-cpu"
  DOCKERFILE: "./docker/dockerfiles/Dockerfile.onnx.cpu"

jobs:
  docker:
    if: ${{ github.repository == 'roboflow/inference' && (github.event_name == 'workflow_dispatch' || github.event_name == 'release') }}
    runs-on:
      labels: ubuntu-latest
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
    env:
      PUBLISH: ${{ github.event_name == 'release' || inputs.force_push == true }}
    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}
    steps:
      - name: Refuse a called build without a custom tag
        # Inside a called workflow github.workflow is the caller's name.
        # Also refuse a called build outside a manual dispatch: determine-tags
        # derives the tag from the caller's event, so only workflow_dispatch
        # callers produce <VERSION>-<custom_tag>.
        if: ${{ github.workflow != 'Build and Push CPU Container' && (inputs.custom_tag == '' || github.event_name != 'workflow_dispatch') }}
        run: |
          echo "::error::custom_tag is required when this workflow is called; an empty tag would overwrite the released :VERSION image"
          exit 1
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Read version from file
        run: echo "VERSION=$(DISABLE_VERSION_CHECK=true python ./inference/core/version.py)" >> $GITHUB_ENV
      - name: Determine Image Tags
        id: tags
        uses: ./.github/actions/determine-tags
        with:
          custom_tag: ${{ inputs.custom_tag }}
          version: ${{ env.VERSION }}
          base_image: ${{ env.BASE_IMAGE }}
          force_push: ${{ inputs.force_push }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Expose image tag
        id: image_tag
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.image_tags }}
          BASE_IMAGE: ${{ env.BASE_IMAGE }}
        run: |
          first="${IMAGE_TAGS%%,*}"
          echo "image_tag=${first#"$BASE_IMAGE:"}" >> "$GITHUB_OUTPUT"
      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Authenticate gcloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: auth
        with:
          workload_identity_provider: "projects/878913763597/locations/global/workloadIdentityPools/github-actions/providers/github"
          service_account: "gha-inference@roboflow-staging.iam.gserviceaccount.com"
          token_format: access_token
          create_credentials_file: false
      - name: Login to Google Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Combine Docker Hub and Artifact Registry tags
        id: all_tags
        run: |
          DH_TAGS="${{ steps.tags.outputs.image_tags }}"
          GCP_PREFIX="us-docker.pkg.dev/roboflow-artifacts/"
          GCP_TAGS=""
          IFS=',' read -ra TAG_ARRAY <<< "$DH_TAGS"
          for tag in "${TAG_ARRAY[@]}"; do
            [ -z "$tag" ] && continue
            if [ -n "$GCP_TAGS" ]; then
              GCP_TAGS="${GCP_TAGS},${GCP_PREFIX}${tag}"
            else
              GCP_TAGS="${GCP_PREFIX}${tag}"
            fi
          done
          echo "all_tags=${DH_TAGS},${GCP_TAGS}" >> "$GITHUB_OUTPUT"
          echo "Publishing runs tag the tested digests in Docker Hub and Artifact Registry:"
          echo "${DH_TAGS},${GCP_TAGS}"
      # Publishing runs push amd64 by digest, test that exact image, then reuse
      # the same digest in the multi-arch tags. Other runs only load and test.
      - name: Build and load CPU image (amd64)
        if: ${{ env.PUBLISH != 'true' }}
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1
        with:
          push: false
          project: grl7ffzxd7
          context: .
          load: true
          tags: ${{ steps.all_tags.outputs.all_tags }}
          platforms: linux/amd64
          file: ${{ env.DOCKERFILE }}
      - name: Build and push CPU image by digest (amd64)
        id: amd64
        if: ${{ env.PUBLISH == 'true' }}
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1
        with:
          project: grl7ffzxd7
          context: .
          outputs: type=image,name=${{ env.BASE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          platforms: linux/amd64
          file: ${{ env.DOCKERFILE }}
      - name: Test CPU PyTorch runtime
        env:
          IMAGE_TAGS: ${{ steps.all_tags.outputs.all_tags }}
          AMD64_DIGEST: ${{ steps.amd64.outputs.digest }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            image="${BASE_IMAGE}@${AMD64_DIGEST}"
            docker pull --platform linux/amd64 "$image"
          else
            image="${IMAGE_TAGS%%,*}"
          fi
          docker run --rm --pull=never --entrypoint /bin/sh \
            -e CPU_IMAGE_TEST=true \
            -v "${{ github.workspace }}/tests/docker/test_cpu_torch_runtime.py:/test_cpu_torch_runtime.py:ro" \
            "$image" -c 'python3 -m pip install pytest && python3 -m pytest /test_cpu_torch_runtime.py -v'
      # arm64 is built but not runtime-tested.
      - name: Build CPU image and optionally push by digest (arm64)
        id: arm64
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1
        with:
          project: grl7ffzxd7
          context: .
          outputs: type=image,name=${{ env.BASE_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          platforms: linux/arm64
          file: ${{ env.DOCKERFILE }}
      - name: Publish tested amd64 and arm64 digests (Docker Hub and GCP)
        if: ${{ env.PUBLISH == 'true' }}
        env:
          IMAGE_TAGS: ${{ steps.all_tags.outputs.all_tags }}
          AMD64_DIGEST: ${{ steps.amd64.outputs.digest }}
          ARM64_DIGEST: ${{ steps.arm64.outputs.digest }}
        run: |
          set -o pipefail
          amd64_manifest() {
            jq -r '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else "" end'
          }
          tested="${BASE_IMAGE}@${AMD64_DIGEST}"
          tested_manifest="$(docker buildx imagetools inspect --raw "$tested" | jq -r --arg self "$AMD64_DIGEST" 'if .manifests then empty else $self end')"
          if [ -z "$tested_manifest" ]; then
            tested_manifest="$(docker buildx imagetools inspect --raw "$tested" | amd64_manifest)"
          fi
          IFS=',' read -ra tags <<< "$IMAGE_TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            [ -n "$tag" ] && tag_args+=(--tag "$tag")
          done
          sources=("$tested" "${BASE_IMAGE}@${ARM64_DIGEST}")
          planned="$(docker buildx imagetools create --dry-run "${tag_args[@]}" "${sources[@]}" | amd64_manifest)"
          if [ -z "$tested_manifest" ] || [ "$planned" != "$tested_manifest" ]; then
            echo "::error::Planned amd64 manifest '$planned' is not the tested '$tested_manifest'; nothing was published"
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          for tag in "${tags[@]}"; do
            [ -z "$tag" ] && continue
            published="$(docker buildx imagetools inspect --raw "$tag" | amd64_manifest)"
            if [ "$published" != "$tested_manifest" ]; then
              echo "::error::$tag amd64 manifest '$published' is not the tested '$tested_manifest'"
              exit 1
            fi
            echo "$tag amd64 manifest $published matches the tested image"
          done
