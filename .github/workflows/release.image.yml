name: Release Docker image
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      state_artifact:
        type: string
        required: true
      image:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-image-${{ fromJSON(inputs.image).key }}-${{ github.event.release.tag_name || github.event.inputs.expected_version }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.receipt.outputs.digest }}
      plan_artifact: ${{ steps.receipt.outputs.artifact }}
      smoke_matrix: ${{ steps.plan.outputs.smoke_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.state_artifact }}
          path: release-state
      - run: bash .release/pypi/flow.sh restore
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.21'
          enable-cache: false
      - run: uv pip install --system click==8.1.8 packaging==25.0
      - id: plan
        env:
          IMAGE_KEY: ${{ fromJSON(inputs.image).key }}
        run: |
          python .github/scripts/release_images.py plan --key "$IMAGE_KEY"
          cat release-state/outputs >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c
      - name: Build retained candidate image
        id: image
        if: ${{ !fromJSON(inputs.image).bake }}
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287
        with:
          project: ${{ fromJSON(inputs.image).project }}
          context: ${{ fromJSON(inputs.image).context }}
          file: ${{ fromJSON(inputs.image).dockerfile }}
          platforms: ${{ steps.plan.outputs.platforms }}
          push: true
          tags: ${{ steps.plan.outputs.candidate }}
          labels: org.opencontainers.image.revision=${{ inputs.source_sha }}
      - name: Build retained Jetson 7.2 candidate with same-source media
        id: bake
        if: ${{ fromJSON(inputs.image).bake }}
        uses: depot/bake-action@v1
        env:
          JETSON_SERVER_TAGS: ${{ steps.plan.outputs.candidate }}
        with:
          files: ./docker/docker-bake.jetson.7.2.0.hcl
          targets: jetson-server-jp72
          project: ${{ fromJSON(inputs.image).project }}
          push: true
      - id: receipt
        env:
          IMAGE_KEY: ${{ fromJSON(inputs.image).key }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          digest="$IMAGE_DIGEST"
          if [ -z "$digest" ]; then
            digest="$(printf '%s' "$BAKE_METADATA" | jq -er '."jetson-server-jp72"."containerimage.digest"')"
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "artifact=image-plan-$IMAGE_KEY-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest" > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.receipt.outputs.artifact }}
          path: |
            image-plan.json
            image-digest.txt
          retention-days: 90
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.smoke_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.plan_artifact }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.21'
          enable-cache: false
      - run: uv pip install --system click==8.1.8 packaging==25.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Smoke-test the retained digest on its target platform
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: python .github/scripts/release_images.py smoke --digest "$IMAGE_DIGEST" --platform "$IMAGE_PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: image-smoke-${{ fromJSON(inputs.image).key }}--${{ strategy.job-index }}-${{ github.run_attempt }}
          path: image-smoke.json
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.plan_artifact }}
      - uses: actions/download-artifact@v4
        with:
          pattern: image-smoke-${{ fromJSON(inputs.image).key }}--*
          path: image-smoke
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.21'
          enable-cache: false
      - run: uv pip install --system click==8.1.8 packaging==25.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        if: ${{ fromJSON(inputs.image).gcp }}
        id: auth
        with:
          workload_identity_provider: projects/878913763597/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: gha-inference@roboflow-staging.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: ${{ fromJSON(inputs.image).gcp }}
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Promote and verify the tested digest; retries never rebuild
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_images.py promote --digest "$IMAGE_DIGEST"
      - uses: actions/upload-artifact@v4
        with:
          name: image-publication-${{ fromJSON(inputs.image).key }}-${{ github.run_attempt }}
          path: image-receipt.json
          retention-days: 90
          if-no-files-found: error
