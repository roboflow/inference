name: Publish Wheels to PyPi
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      packages:
        type: choice
        default: all
        options: [sdk, runtime, all, dependencies]
        description: Package group (dependencies prepares upstreams without uploading runtime)
      publish:
        type: boolean
        default: false
        description: Publish the selected packages (default builds only)
      expected_version:
        type: string
        default: ""
        description: Required for manual publication; must match package metadata

permissions:
  contents: read

env:
  EXPECTED_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.expected_version }}
  PUBLISH: ${{ github.event_name == 'release' || inputs.publish == true }}

# Keep publication in this file: all six PyPI projects already trust its identity.
# No environment or reusable publishing workflow may change that OIDC identity.
jobs:
  build_sdk:
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name == 'release' || inputs.packages == 'sdk' || inputs.packages == 'all' || inputs.packages == 'dependencies' }}
    runs-on:
      labels: depot-ubuntu-22.04-small
      group: public-depot
    timeout-minutes: 15
    outputs:
      version: ${{ steps.build.outputs.version }}
      artifact: ${{ steps.build.outputs.artifact }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select retained candidate sdk
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .release/pypi/candidate.sh select --profile sdk
          jq -r 'to_entries[] | "\(.key)=\(.value)"' release-evidence/selection-sdk.json >> "$GITHUB_OUTPUT"
      - name: Download retained candidate sdk
        if: ${{ steps.candidate.outputs.reused == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.candidate.outputs.id }}
          merge-multiple: true
          path: release-candidate/sdk
      - name: Restore retained candidate sdk
        if: ${{ steps.candidate.outputs.reused == 'true' }}
        run: bash .release/pypi/candidate.sh restore --profile sdk
      - name: Build and inspect the SDK wheel in Docker
        id: build
        run: |
          if [[ "${{ steps.candidate.outputs.reused }}" != true ]]; then
            bash .release/pypi/release.sh build-sdk
          fi
          echo "version=$(cat dist/version.txt)" >> "$GITHUB_OUTPUT"
          echo "artifact=candidate-sdk" >> "$GITHUB_OUTPUT"
      - name: Seal candidate sdk
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        run: bash .release/pypi/candidate.sh seal --profile sdk
      - name: Retain candidate sdk
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: candidate-sdk
          retention-days: 90
          if-no-files-found: error
          path: release-candidate/sdk/
      - name: Verify retained candidate sdk
        run: bash .release/pypi/candidate.sh verify --profile sdk
      - name: Report build-only result
        if: ${{ env.PUBLISH == 'false' }}
        run: echo "SDK wheel built. Nothing was published (publish=false)." >> "$GITHUB_STEP_SUMMARY"

  publish_sdk:
    needs: build_sdk
    if: ${{ github.repository == 'roboflow/inference' && (github.event_name == 'release' || inputs.publish == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pypi-sdk-${{ needs.build_sdk.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_sdk.outputs.artifact }}
          path: release-candidate/sdk
      - name: Restore verified sdk candidate
        run: bash .release/pypi/candidate.sh restore --profile sdk
      - name: Smoke the retained SDK wheel in the existing SDK test image
        run: |
          bash .github/scripts/run_sdk_tests.sh retained 3.12
          bash .release/pypi/candidate.sh verify --profile sdk
      - name: Verify an existing SDK or stage the missing wheel
        id: prepare
        run: |
          bash .release/pypi/release.sh prepare-sdk --wait-seconds 600
          echo "upload=$(jq -r '.upload' dist/sdk-decision.json)" >> "$GITHUB_OUTPUT"
      - name: Publish the missing SDK wheel
        id: upload
        if: ${{ steps.prepare.outputs.upload == 'true' }}
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/sdk-upload/
      - name: Verify the published bytes and package contents
        run: bash .release/pypi/release.sh verify-sdk --wait-seconds 600
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-publication-receipt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            dist/sdk-decision.json
            dist/sdk-receipt.json

  build_runtime:
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name == 'release' || inputs.packages == 'runtime' || inputs.packages == 'all' || inputs.packages == 'dependencies' }}
    runs-on:
      labels: depot-ubuntu-22.04-small
      group: public-depot
    timeout-minutes: 20
    outputs:
      version: ${{ steps.build.outputs.version }}
      artifact: ${{ steps.build.outputs.artifact }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select retained candidate runtime
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .release/pypi/candidate.sh select --profile runtime
          jq -r 'to_entries[] | "\(.key)=\(.value)"' release-evidence/selection-runtime.json >> "$GITHUB_OUTPUT"
      - name: Download retained candidate runtime
        if: ${{ steps.candidate.outputs.reused == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.candidate.outputs.id }}
          merge-multiple: true
          path: release-candidate/runtime
      - name: Restore retained candidate runtime
        if: ${{ steps.candidate.outputs.reused == 'true' }}
        run: bash .release/pypi/candidate.sh restore --profile runtime
      - name: Build five wheels and an SDK verification reference in Docker
        id: build
        run: |
          if [[ "${{ steps.candidate.outputs.reused }}" != true ]]; then
            bash .release/pypi/release.sh build-runtime
          fi
          echo "version=$(cat dist/version.txt)" >> "$GITHUB_OUTPUT"
          echo "artifact=candidate-runtime" >> "$GITHUB_OUTPUT"
      - name: Seal candidate runtime
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        run: bash .release/pypi/candidate.sh seal --profile runtime
      - name: Retain candidate runtime
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: candidate-runtime
          retention-days: 90
          if-no-files-found: error
          path: release-candidate/runtime/
      - name: Verify retained candidate runtime
        run: bash .release/pypi/candidate.sh verify --profile runtime
      - name: Report build-only result
        if: ${{ env.PUBLISH == 'false' }}
        run: echo "Runtime wheels built. Nothing was published (publish=false)." >> "$GITHUB_STEP_SUMMARY"

  prepare_dependencies:
    needs: [build_runtime, publish_sdk]
    if: >-
      ${{ !cancelled() && github.repository == 'roboflow/inference' &&
          needs.build_runtime.result == 'success' &&
          (needs.publish_sdk.result == 'success' ||
           (github.event_name == 'workflow_dispatch' &&
            (inputs.packages == 'runtime' || inputs.publish != true) &&
            needs.publish_sdk.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 270
    permissions:
      contents: read
      actions: write
    concurrency:
      group: pypi-dependencies-${{ needs.build_runtime.outputs.version }}-${{ github.event_name == 'release' || inputs.publish == true }}
      cancel-in-progress: false
    outputs:
      artifact: ${{ steps.plan.outputs.artifact }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_runtime.outputs.artifact }}
          path: release-candidate/runtime
      - name: Restore verified runtime candidate
        run: bash .release/pypi/candidate.sh restore --profile runtime
      - name: Require the exact SDK before publishing upstream dependencies
        if: ${{ github.event_name == 'release' || inputs.publish == true }}
        run: bash .release/pypi/release.sh gate-sdk --wait-seconds 600
      - name: Select retained candidate dependencies
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .release/pypi/candidate.sh select --profile dependencies
          jq -r 'to_entries[] | "\(.key)=\(.value)"' release-evidence/selection-dependencies.json >> "$GITHUB_OUTPUT"
      - name: Download retained candidate dependencies
        if: ${{ steps.candidate.outputs.reused == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.candidate.outputs.id }}
          merge-multiple: true
          path: release-candidate/dependencies
      - name: Restore retained candidate dependencies
        if: ${{ steps.candidate.outputs.reused == 'true' }}
        run: bash .release/pypi/candidate.sh restore --profile dependencies
      - name: Download prior coordinator checkpoint
        if: ${{ steps.candidate.outputs.checkpoint_id != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.candidate.outputs.checkpoint_id }}
          merge-multiple: true
          path: release-checkpoint
      - name: Resolve first-party dependency versions
        id: plan
        run: |
          if [[ "${{ steps.candidate.outputs.reused }}" == true ]]; then
            cp release-plan/dependency-plan.json dist/dependency-plan.json
          else
            bash .release/pypi/dependencies.sh plan --wait-seconds 600
            mkdir release-plan
            cp dist/dependency-plan.json release-plan/dependency-plan.json
          fi
          if [[ -f release-checkpoint/dependency-plan.json ]]; then
            bash .release/pypi/dependencies.sh resume
          fi
          echo "artifact=dependency-plan-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Seal candidate dependencies
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        run: bash .release/pypi/candidate.sh seal --profile dependencies
      - name: Retain candidate dependencies
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: candidate-dependencies
          retention-days: 90
          if-no-files-found: error
          path: release-candidate/dependencies/
      - name: Verify retained candidate dependencies
        run: bash .release/pypi/candidate.sh verify --profile dependencies
      - name: Validate image source against dependency selection
        run: bash .release/pypi/image_inputs.sh validate
      - name: Publish missing upstream versions in dependency order
        if: ${{ github.event_name == 'release' || inputs.publish == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .release/pypi/dependencies.sh coordinate --wait-seconds 12600
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: dependency-plan-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            dist/dependency-plan.json
            dist/dependency-receipt.json

  publish_runtime:
    needs: [build_runtime, publish_sdk, prepare_dependencies]
    # Runtime-only dispatches skip the SDK job; all/release runs require it to
    # finish verification successfully. A failed or cancelled SDK blocks upload.
    if: >-
      ${{ !cancelled() && github.repository == 'roboflow/inference' &&
          (github.event_name == 'release' || inputs.publish == true) &&
          (github.event_name == 'release' || inputs.packages != 'dependencies') &&
          needs.build_runtime.result == 'success' &&
          needs.prepare_dependencies.result == 'success' &&
          (needs.publish_sdk.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && inputs.packages == 'runtime' &&
            needs.publish_sdk.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pypi-runtime-${{ needs.build_runtime.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_runtime.outputs.artifact }}
          path: release-candidate/runtime
      - name: Restore verified runtime candidate
        run: bash .release/pypi/candidate.sh restore --profile runtime
      - name: Verify the published SDK before uploading any consumer
        run: bash .release/pypi/release.sh gate-sdk --wait-seconds 600
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare_dependencies.outputs.artifact }}
          path: dist
      - name: Verify the selected dependencies against the retained consumer wheels
        run: bash .release/pypi/dependencies.sh verify --wait-seconds 600
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-sdk-verification-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            dist/sdk-receipt.json
            dist/dependency-plan.json
            dist/dependency-receipt.json
      - name: Verify existing runtime files and stage missing wheels
        id: prepare
        run: |
          bash .release/pypi/publish.sh prepare --profile runtime --directory dist/pypi --upload-directory dist/runtime-upload --receipt dist/runtime-prepare.json --wait-seconds 600
          echo "upload=$(jq -r '.upload' dist/runtime-prepare.json)" >> "$GITHUB_OUTPUT"
      - name: Publish the missing runtime and CLI wheels
        continue-on-error: true
        if: ${{ steps.prepare.outputs.upload == 'true' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/runtime-upload/
      - name: Verify the complete published runtime inventory
        run: bash .release/pypi/publish.sh verify --profile runtime --directory dist/pypi --upload-directory dist/runtime-upload --receipt dist/runtime-receipt.json --wait-seconds 600
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: runtime-publication-receipt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            dist/runtime-prepare.json
            dist/runtime-receipt.json

  prepare_image_inputs:
    needs: [build_runtime, prepare_dependencies, publish_runtime]
    if: >-
      ${{ !cancelled() && needs.build_runtime.result == 'success' &&
          needs.prepare_dependencies.result == 'success' &&
          needs.publish_runtime.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select retained candidate image-inputs
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .release/pypi/candidate.sh select --profile image-inputs
          jq -r 'to_entries[] | "\(.key)=\(.value)"' release-evidence/selection-image-inputs.json >> "$GITHUB_OUTPUT"
      - name: Download retained candidate image-inputs
        if: ${{ steps.candidate.outputs.reused == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.candidate.outputs.id }}
          merge-multiple: true
          path: release-candidate/image-inputs
      - name: Restore retained candidate image-inputs
        if: ${{ steps.candidate.outputs.reused == 'true' }}
        run: bash .release/pypi/candidate.sh restore --profile image-inputs
      - name: Download retained runtime identity
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_runtime.outputs.artifact }}
          path: release-candidate/runtime
      - name: Restore retained runtime identity
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        run: bash .release/pypi/candidate.sh restore --profile runtime
      - name: Download verified dependency checkpoint
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare_dependencies.outputs.artifact }}
          path: dist
      - name: Read original companion publishers
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        id: publishers
        run: |
          echo "models=$(jq -r '.packages["inference-models"].publisher_run_id // empty' dist/dependency-plan.json)" >> "$GITHUB_OUTPUT"
          echo "workflows=$(jq -r '.packages["roboflow-workflows"].publisher_run_id // empty' dist/dependency-plan.json)" >> "$GITHUB_OUTPUT"
          echo "streamvision=$(jq -r '.packages["streamvision"].publisher_run_id // empty' dist/dependency-plan.json)" >> "$GITHUB_OUTPUT"
      - name: Download prepared inference-models candidate
        if: ${{ steps.candidate.outputs.reused != 'true' && steps.publishers.outputs.models != '' }}
        uses: actions/download-artifact@v4
        with:
          name: candidate-inference-models
          run-id: ${{ steps.publishers.outputs.models }}
          github-token: ${{ github.token }}
          path: release-candidate/inference-models
      - name: Download prepared roboflow-workflows candidate
        if: ${{ steps.candidate.outputs.reused != 'true' && steps.publishers.outputs.workflows != '' }}
        uses: actions/download-artifact@v4
        with:
          name: candidate-roboflow-workflows
          run-id: ${{ steps.publishers.outputs.workflows }}
          github-token: ${{ github.token }}
          path: release-candidate/roboflow-workflows
      - name: Download prepared streamvision candidate
        if: ${{ steps.candidate.outputs.reused != 'true' && steps.publishers.outputs.streamvision != '' }}
        uses: actions/download-artifact@v4
        with:
          name: candidate-streamvision
          run-id: ${{ steps.publishers.outputs.streamvision }}
          github-token: ${{ github.token }}
          path: release-candidate/streamvision
      - name: Assemble prepared image inputs
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        run: bash .release/pypi/image_inputs.sh assemble
      - name: Seal candidate image-inputs
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        run: bash .release/pypi/candidate.sh seal --profile image-inputs
      - name: Retain candidate image-inputs
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: candidate-image-inputs
          retention-days: 90
          if-no-files-found: error
          path: release-candidate/image-inputs/
      - name: Verify retained candidate image-inputs
        run: bash .release/pypi/candidate.sh verify --profile image-inputs
