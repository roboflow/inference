name: Publish inference-sdk to PyPI
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the SDK (false builds only)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on:
      labels: depot-ubuntu-22.04-small
      group: public-depot
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the independent SDK wheel
        run: |
          python -m pip install setuptools wheel
          make create_sdk_wheel
      - uses: actions/upload-artifact@v4
        with:
          name: inference-sdk-wheel
          path: dist/inference_sdk-*.whl
      - name: Publish SDK
        if: ${{ github.event_name == 'release' || github.event.inputs.publish == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
