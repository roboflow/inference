name: Code Quality & Regression Tests - NVIDIA T4
permissions:
  contents: read
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_name:
        description: 'Name of specific test to run. Leave empty to run all tests.'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - regression_without_torch
          - regression_with_torch
          - paligemma
          - florence
          - sam2
          - sam3
          - moondream2
          - fast_track
      use-inference-models:
        description: "USE_INFERENCE_MODELS value (or all)"
        type: choice
        default: all
        options:
          - all
          - "true"
          - "false"
      image_tag:
        description: "Prebuilt roboflow/roboflow-inference-server-gpu tag to test (e.g. 1.6.2-post3-rc1). Empty = build the image from this ref."
        type: string
        default: ""
      mmp-configuration:
        description: "Legacy MMP adapter configuration"
        type: choice
        default: mmp
        options:
          - mmp
          - bundled-subprocess
          - bundled-direct
      server-image:
        description: "Server under test: legacy inference image or the new inference_server image"
        type: choice
        default: legacy
        options:
          - legacy
          - new
  workflow_call:
    # Called by fast_track_integration_tests.yml with a prebuilt image tag, so
    # the 32-minute in-job image build is skipped. test_name `fast_track` runs
    # the reduced fast-track preset: regression without torch preprocessing,
    # SAM2 and SAM3 (plus the runtime verification steps).
    inputs:
      test_name:
        type: string
        default: ""
      use-inference-models:
        type: string
        default: all
      image_tag:
        type: string
        default: ""

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  # The literal file id keeps groups distinct when this workflow is called
  # (github.workflow is the caller's name inside a called workflow).
  group: ${{ github.workflow }}-test_nvidia_t4-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build:
    if: ${{ !github.event.act }}
    runs-on: Roboflow-GPU-VM-Runner
    env:
      LEGACY_MMP_ADAPTER_MODE: ${{ startsWith(github.event.inputs.mmp-configuration || 'mmp', 'bundled-') && 'bundled' || 'mmp' }}
      LEGACY_MMP_ADAPTER_BUNDLED_BACKEND: ${{ github.event.inputs.mmp-configuration == 'bundled-direct' && 'direct' || 'subprocess' }}
      SERVER_IMAGE: ${{ github.event.inputs.server-image || 'legacy' }}
      INFERENCE_SERVER_REPO: ${{ github.event.inputs.server-image == 'new' && 'inference-server-experimental' || 'roboflow-inference-server-gpu' }}
      PYTEST_EXTRA_ARGS: ${{ github.event.inputs.server-image == 'new' && '--ignore=tests/inference/integration_tests/test_video_processing_endpoints.py --ignore=tests/inference/integration_tests/yolo_world_test.py --deselect tests/inference/integration_tests/test_workflow_endpoints.py::test_compilation_endpoint_when_compilation_succeeds_with_custom_block' || '' }}
    strategy:
      matrix:
        use-inference-models: ${{ fromJSON(github.event.inputs.server-image == 'new' && '["true"]' || ((inputs.use-inference-models || 'all') == 'all' && '["true","false"]' || format('["{0}"]', inputs.use-inference-models))) }}
    timeout-minutes: 120

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: 🦾 Install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements/requirements.test.integration.txt -r requirements/requirements.test.unit.txt 
      - name: 🔨 Build Test Docker - GPU
        if: ${{ env.SERVER_IMAGE == 'legacy' && inputs.image_tag == '' }}
        run: |
          docker build -t roboflow/roboflow-inference-server-gpu:test -f docker/dockerfiles/Dockerfile.onnx.gpu .
      - name: 📥 Pull prebuilt image ${{ inputs.image_tag }}
        if: ${{ inputs.image_tag != '' }}
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker pull "roboflow/roboflow-inference-server-gpu:${IMAGE_TAG}"
          docker tag "roboflow/roboflow-inference-server-gpu:${IMAGE_TAG}" roboflow/roboflow-inference-server-gpu:test
          echo "Image under test: roboflow/roboflow-inference-server-gpu:${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
      - name: 🔨 Build Test Docker - inference_server GPU
        if: ${{ env.SERVER_IMAGE == 'new' }}
        run: |
          docker build -t roboflow/inference-server-experimental:test -f inference_server/docker/Dockerfile.gpu .

      - name: Show NVIDIA driver - GPU
        if: ${{ (inputs.test_name == '' || inputs.test_name == 'fast_track') && env.SERVER_IMAGE == 'legacy' }}
        run: nvidia-smi

      - name: Verify CUDA OpenCV - GPU
        if: ${{ (inputs.test_name == '' || inputs.test_name == 'fast_track') && env.SERVER_IMAGE == 'legacy' }}
        run: |
          docker run --rm --gpus all --entrypoint sh \
            -e OPENCV_REQUIRE_CUDA_BUILD=true \
            -e OPENCV_REQUIRE_CUDA_RUNTIME=true \
            -v "$PWD/docker/scripts/verify_opencv.sh:/tmp/verify_opencv:ro" \
            roboflow/roboflow-inference-server-gpu:test \
            /tmp/verify_opencv

      - name: Verify NVIDIA GStreamer codecs - GPU
        if: ${{ (inputs.test_name == '' || inputs.test_name == 'fast_track') && env.SERVER_IMAGE == 'legacy' }}
        run: |
          docker run --rm --gpus all --entrypoint sh \
            -e GSTREAMER_REQUIRE_NVCODEC=true \
            -e GSTREAMER_REQUIRE_NVCODEC_RUNTIME=true \
            -v "$PWD/docker/scripts/verify_gstreamer.sh:/tmp/verify_gstreamer:ro" \
            roboflow/roboflow-inference-server-gpu:test \
            /tmp/verify_gstreamer

      - name: Verify CUDA GStreamer tensor bridge - GPU
        if: ${{ (inputs.test_name == '' || inputs.test_name == 'fast_track') && env.SERVER_IMAGE == 'legacy' }}
        run: |
          docker run --rm --gpus all --entrypoint python3 \
            -v "$PWD/docker/scripts/verify_gstreamer_cuda_tensor_runtime.py:/tmp/verify_gstreamer_cuda_tensor_runtime.py:ro" \
            roboflow/roboflow-inference-server-gpu:test \
            /tmp/verify_gstreamer_cuda_tensor_runtime.py

      - name: 🔋 Start Test Docker without Torch Preprocessing - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'regression_without_torch' }}
        run: |
          USE_INFERENCE_MODELS=${{ matrix.use-inference-models }} PORT=9101 USE_PYTORCH_FOR_PREPROCESSING=False INFERENCE_SERVER_REPO=${{ env.INFERENCE_SERVER_REPO }} make start_test_docker_gpu
      - name: 🧪 Regression Tests without Torch Preprocessing - GPU
        id: regression_tests_without_torch
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'regression_without_torch' }}
        run: |
          source .venv/bin/activate
          USE_INFERENCE_MODELS=${{ matrix.use-inference-models }} MINIMUM_FPS=25 FUNCTIONAL=true PORT=9101 SKIP_LMM_TEST=True API_KEY=${{ secrets.API_KEY }} asl_instance_segmentation_API_KEY=${{ secrets.ASL_INSTANCE_SEGMENTATION_API_KEY }} asl_poly_instance_seg_API_KEY=${{ secrets.ASL_POLY_INSTANCE_SEG_API_KEY }} bccd_favz3_API_KEY=${{ secrets.BCCD_FAVZ3_API_KEY }} bccd_i4nym_API_KEY=${{ secrets.BCCD_I4NYM_API_KEY }} cats_and_dogs_smnpl_API_KEY=${{ secrets.CATS_AND_DOGS_SMNPL_API_KEY }} coins_xaz9i_API_KEY=${{ secrets.COINS_XAZ9I_API_KEY }} melee_API_KEY=${{ secrets.MELEE_API_KEY }} yolonas_test_API_KEY=${{ secrets.YOLONAS_TEST_API_KEY }} python3 -m pytest tests/inference/integration_tests/ ${{ env.PYTEST_EXTRA_ARGS }}
      - name: 🧹 Cleanup Test Docker - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'regression_without_torch' }}
        run: make stop_test_docker

      - name: 🔋 Start Test Docker with Torch Preprocessing - GPU
        if: ${{ inputs.test_name == 'regression_with_torch' || (inputs.test_name == '' && env.SERVER_IMAGE == 'legacy') }}
        run: |
          USE_INFERENCE_MODELS=${{ matrix.use-inference-models }} PORT=9101 USE_PYTORCH_FOR_PREPROCESSING=True INFERENCE_SERVER_REPO=${{ env.INFERENCE_SERVER_REPO }} make start_test_docker_gpu
      - name: 🧪 Regression Tests with Torch Preprocessing - GPU
        id: regression_tests_with_torch
        if: ${{ inputs.test_name == 'regression_with_torch' || (inputs.test_name == '' && env.SERVER_IMAGE == 'legacy') }}
        run: |
          source .venv/bin/activate
          USE_INFERENCE_MODELS=${{ matrix.use-inference-models }} MINIMUM_FPS=25 FUNCTIONAL=true PORT=9101 SKIP_LMM_TEST=True API_KEY=${{ secrets.API_KEY }} asl_instance_segmentation_API_KEY=${{ secrets.ASL_INSTANCE_SEGMENTATION_API_KEY }} asl_poly_instance_seg_API_KEY=${{ secrets.ASL_POLY_INSTANCE_SEG_API_KEY }} bccd_favz3_API_KEY=${{ secrets.BCCD_FAVZ3_API_KEY }} bccd_i4nym_API_KEY=${{ secrets.BCCD_I4NYM_API_KEY }} cats_and_dogs_smnpl_API_KEY=${{ secrets.CATS_AND_DOGS_SMNPL_API_KEY }} coins_xaz9i_API_KEY=${{ secrets.COINS_XAZ9I_API_KEY }} melee_API_KEY=${{ secrets.MELEE_API_KEY }} yolonas_test_API_KEY=${{ secrets.YOLONAS_TEST_API_KEY }} python3 -m pytest tests/inference/integration_tests/ ${{ env.PYTEST_EXTRA_ARGS }}
      - name: 🧹 Cleanup Test Docker - GPU
        if: ${{ inputs.test_name == 'regression_with_torch' || (inputs.test_name == '' && env.SERVER_IMAGE == 'legacy') }}
        run: make stop_test_docker
      
      - name: 🔋 Start Test Docker - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'paligemma' }}
        run: |
          USE_INFERENCE_MODELS=${{ matrix.use-inference-models }} PORT=9101 INFERENCE_SERVER_REPO=${{ env.INFERENCE_SERVER_REPO }} make start_test_docker_gpu
      - name: 🧪 Regression Paligemma - GPU
        id: paligemma_tests
        if: ${{ inputs.test_name == '' || inputs.test_name == 'paligemma' }}
        run: |
          source .venv/bin/activate
          USE_INFERENCE_MODELS=${{ matrix.use-inference-models }} PORT=9101 melee_API_KEY=${{ secrets.MELEE_API_KEY }} python3 -m pytest tests/inference/integration_tests/test_paligemma.py
      - name: 🧹 Cleanup Test Docker - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'paligemma' }}
        run: make stop_test_docker
      - name: 🔋 Start Test Docker - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'florence' }}
        run: |
          USE_INFERENCE_MODELS=${{ matrix.use-inference-models }} PORT=9101 INFERENCE_SERVER_REPO=${{ env.INFERENCE_SERVER_REPO }} make start_test_docker_gpu
      - name: 🧪 Regression Florence - GPU
        id: florence_tests
        if: ${{ inputs.test_name == '' || inputs.test_name == 'florence' }}
        run: |
          source .venv/bin/activate
          USE_INFERENCE_MODELS=${{ matrix.use-inference-models }} PORT=9101 melee_API_KEY=${{ secrets.MELEE_API_KEY }} python3 -m pytest tests/inference/integration_tests/test_florence.py
      - name: 🧹 Cleanup Test Docker - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'florence' }}
        run: make stop_test_docker
      - name: 🔋 Start Test Docker - SAM2
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam2' }}
        run: |
          USE_INFERENCE_MODELS=${{ matrix.use-inference-models }} PORT=9101 INFERENCE_SERVER_REPO=${{ env.INFERENCE_SERVER_REPO }} make start_test_docker_gpu
      - name: 🧪 Regression Tests - SAM2
        id: sam2_tests
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam2' }}
        run: |
          source .venv/bin/activate
          USE_INFERENCE_MODELS=${{ matrix.use-inference-models }} PORT=9101 API_KEY=${{ secrets.API_KEY }} SKIP_SAM2_TESTS=False python3 -m pytest tests/inference/integration_tests/test_sam2.py
      - name: 🧹 Cleanup Test Docker - SAM2
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam2' }}
        run: make stop_test_docker
      - name: 🔋 Start Test Docker - SAM3
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam3' }}
        run: |
          USE_INFERENCE_MODELS=${{ matrix.use-inference-models }} PORT=9101 INFERENCE_SERVER_REPO=${{ env.INFERENCE_SERVER_REPO }} make start_test_docker_gpu
      - name: 🧪 Regression Tests - SAM3
        id: sam3_tests
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam3' }}
        run: |
          source .venv/bin/activate
          USE_INFERENCE_MODELS=${{ matrix.use-inference-models }} PORT=9101 API_KEY=${{ secrets.API_KEY }} SKIP_SAM3_TESTS=False python3 -m pytest tests/inference/integration_tests/test_sam3.py
      - name: 🧹 Cleanup Test Docker - SAM3
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam3' }}
        run: make stop_test_docker
