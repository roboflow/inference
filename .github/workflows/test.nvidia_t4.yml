name: Code Quality & Regression Tests - NVIDIA T4
permissions:
  contents: read
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_name:
        description: 'Name of specific test to run. Leave empty to run all tests.'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - regression_without_torch
          - regression_with_torch
          - paligemma
          - florence
          - sam2
          - sam3
          - moondream2
          - fast_track
      use-inference-models:
        description: "USE_INFERENCE_MODELS value (or all)"
        type: choice
        default: all
        options:
          - all
          - "true"
          - "false"
      image_digest:
        description: "Immutable amd64 digest; mutually exclusive with image_tag"
        type: string
        default: ""
      image_tag:
        description: "Prebuilt roboflow/roboflow-inference-server-gpu tag to test (e.g. 1.6.2-post3-rc1). Empty = build the image from this ref."
        type: string
        default: ""
  workflow_call:
    # Called by fast_track_integration_tests.yml with a prebuilt image tag, so
    # the 32-minute in-job image build is skipped. test_name `fast_track` runs
    # the reduced fast-track preset: regression without torch preprocessing,
    # SAM2 and SAM3 (plus the runtime verification steps).
    inputs:
      test_name:
        type: string
        default: ""
      use-inference-models:
        type: string
        default: all
      image_digest:
        description: "Immutable amd64 digest; mutually exclusive with image_tag"
        type: string
        default: ""
      image_tag:
        type: string
        default: ""
      private_image:
        description: "Trusted main CI transport; requires image_digest"
        type: boolean
        default: false
    secrets:
      API_KEY:
        required: false
      ASL_INSTANCE_SEGMENTATION_API_KEY:
        required: false
      ASL_POLY_INSTANCE_SEG_API_KEY:
        required: false
      BCCD_FAVZ3_API_KEY:
        required: false
      BCCD_I4NYM_API_KEY:
        required: false
      CATS_AND_DOGS_SMNPL_API_KEY:
        required: false
      COINS_XAZ9I_API_KEY:
        required: false
      MELEE_API_KEY:
        required: false
      YOLONAS_TEST_API_KEY:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      CI_REGISTRY_PREFIX:
        required: false
      CI_WIF_PROVIDER:
        required: false
      CI_REGISTRY_READER:
        required: false

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  # The literal file id keeps groups distinct when this workflow is called
  # (github.workflow is the caller's name inside a called workflow).
  group: ${{ github.workflow }}-test_nvidia_t4-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build:
    # The repository context identifies the caller of a reusable workflow.
    if: >-
      ${{ github.repository == 'roboflow/inference'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && !github.event.act
          && (github.event_name != 'push' || vars.CI_IMAGE_REUSE_ENABLED != 'true' || inputs.private_image)
          && (!inputs.private_image || github.ref == 'refs/heads/main') }}
    runs-on: Roboflow-GPU-VM-Runner
    permissions:
      contents: read
      id-token: write
    env:
      MODEL_MODE: ${{ matrix.use-inference-models }}
      IMAGE_FAMILY: gpu
      IMAGE_TAG: ${{ inputs.image_tag }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      PRIVATE_IMAGE: ${{ inputs.private_image || false }}
      CI_IMAGE_REUSE_ENABLED: ${{ vars.CI_IMAGE_REUSE_ENABLED }}
      CI_REGISTRY_PREFIX: ${{ secrets.CI_REGISTRY_PREFIX }}
      INFERENCE_TEST_CONTAINER: ci-gpu-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      INFERENCE_TEST_BIND: 127.0.0.1::9101
    strategy:
      fail-fast: true
      matrix:
        use-inference-models: ${{ fromJSON((inputs.use-inference-models || 'all') == 'all'&& '["true","false"]'|| format('["{0}"]', inputs.use-inference-models)) }}
    timeout-minutes: 120

    steps:
      - name: Initialize isolated registry credentials directory
        if: ${{ inputs.private_image }}
        id: ci_docker_config
        run: |
          umask 077
          directory="$(mktemp -d "$RUNNER_TEMP/ci-docker.XXXXXXXX")"
          echo "DOCKER_CONFIG=$directory" >> "$GITHUB_ENV"
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate image inputs before authentication
        env:
          CI_IMAGE_ACTION: validate
        run: python3 .github/scripts/ci_image.py
      - name: Authenticate private registry reader
        if: ${{ inputs.private_image }}
        id: ci_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.CI_WIF_PROVIDER }}
          service_account: ${{ secrets.CI_REGISTRY_READER }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Login to private registry
        if: ${{ inputs.private_image }}
        env:
          ACCESS_TOKEN: ${{ steps.ci_auth.outputs.access_token }}
        run: |
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$ACCESS_TOKEN" | docker login "${CI_REGISTRY_PREFIX%%/*}" --username oauth2accesstoken --password-stdin > /dev/null 2>&1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: 🦾 Install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements/requirements.test.integration.txt -r requirements/requirements.test.unit.txt 
      - name: 🔨 Build Test Docker - GPU
        if: ${{ inputs.image_tag == '' && inputs.image_digest == '' && !inputs.private_image }}
        run: |
          docker build -t roboflow/roboflow-inference-server-gpu:test -f docker/dockerfiles/Dockerfile.onnx.gpu .
      - name: Pull and verify prebuilt amd64 image
        if: ${{ inputs.image_tag != '' || inputs.image_digest != '' || inputs.private_image }}
        env:
          CI_IMAGE_ACTION: pull
        run: python3 .github/scripts/ci_image.py
      # Action post hooks still need the builder records under DOCKER_CONFIG.
      - name: Remove registry credentials before executing tests
        if: ${{ always() && inputs.private_image && steps.ci_docker_config.outcome == 'success' }}
        run: rm -f -- "$DOCKER_CONFIG/config.json"

      - name: Show NVIDIA driver - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' }}
        run: nvidia-smi

      - name: Verify CUDA OpenCV - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' }}
        run: |
          docker run --rm --gpus all --entrypoint sh \
            -e OPENCV_REQUIRE_CUDA_BUILD=true \
            -e OPENCV_REQUIRE_CUDA_RUNTIME=true \
            -v "$PWD/docker/scripts/verify_opencv.sh:/tmp/verify_opencv:ro" \
            "${INFERENCE_TEST_IMAGE:-roboflow/roboflow-inference-server-gpu:test}" \
            /tmp/verify_opencv

      - name: Verify NVIDIA GStreamer codecs - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' }}
        run: |
          docker run --rm --gpus all --entrypoint sh \
            -e GSTREAMER_REQUIRE_NVCODEC=true \
            -e GSTREAMER_REQUIRE_NVCODEC_RUNTIME=true \
            -v "$PWD/docker/scripts/verify_gstreamer.sh:/tmp/verify_gstreamer:ro" \
            "${INFERENCE_TEST_IMAGE:-roboflow/roboflow-inference-server-gpu:test}" \
            /tmp/verify_gstreamer

      - name: Verify CUDA GStreamer tensor bridge - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' }}
        run: |
          docker run --rm --gpus all --entrypoint python3 \
            -v "$PWD/docker/scripts/verify_gstreamer_cuda_tensor_runtime.py:/tmp/verify_gstreamer_cuda_tensor_runtime.py:ro" \
            "${INFERENCE_TEST_IMAGE:-roboflow/roboflow-inference-server-gpu:test}" \
            /tmp/verify_gstreamer_cuda_tensor_runtime.py

      - name: 🔋 Start Test Docker without Torch Preprocessing - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'regression_without_torch' }}
        run: |
          USE_INFERENCE_MODELS="$MODEL_MODE" PORT=9101 USE_PYTORCH_FOR_PREPROCESSING=False INFERENCE_SERVER_REPO=roboflow-inference-server-gpu make start_test_docker_gpu
          CI_IMAGE_ACTION=port python3 .github/scripts/ci_image.py
      - name: 🧪 Regression Tests without Torch Preprocessing - GPU
        id: regression_tests_without_torch
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'regression_without_torch' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          asl_instance_segmentation_API_KEY: ${{ secrets.ASL_INSTANCE_SEGMENTATION_API_KEY }}
          asl_poly_instance_seg_API_KEY: ${{ secrets.ASL_POLY_INSTANCE_SEG_API_KEY }}
          bccd_favz3_API_KEY: ${{ secrets.BCCD_FAVZ3_API_KEY }}
          bccd_i4nym_API_KEY: ${{ secrets.BCCD_I4NYM_API_KEY }}
          cats_and_dogs_smnpl_API_KEY: ${{ secrets.CATS_AND_DOGS_SMNPL_API_KEY }}
          coins_xaz9i_API_KEY: ${{ secrets.COINS_XAZ9I_API_KEY }}
          melee_API_KEY: ${{ secrets.MELEE_API_KEY }}
          yolonas_test_API_KEY: ${{ secrets.YOLONAS_TEST_API_KEY }}
        run: |
          source .venv/bin/activate
          USE_INFERENCE_MODELS="$MODEL_MODE" MINIMUM_FPS=25 FUNCTIONAL=true PORT="${TEST_PORT:-9101}" SKIP_LMM_TEST=True python3 -m pytest tests/inference/integration_tests/
      - name: 🧹 Cleanup Test Docker - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'regression_without_torch' }}
        run: make stop_test_docker

      - name: 🔋 Start Test Docker with Torch Preprocessing - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'regression_with_torch' }}
        run: |
          USE_INFERENCE_MODELS="$MODEL_MODE" PORT=9101 USE_PYTORCH_FOR_PREPROCESSING=True INFERENCE_SERVER_REPO=roboflow-inference-server-gpu make start_test_docker_gpu
          CI_IMAGE_ACTION=port python3 .github/scripts/ci_image.py
      - name: 🧪 Regression Tests with Torch Preprocessing - GPU
        id: regression_tests_with_torch
        if: ${{ inputs.test_name == '' || inputs.test_name == 'regression_with_torch' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          asl_instance_segmentation_API_KEY: ${{ secrets.ASL_INSTANCE_SEGMENTATION_API_KEY }}
          asl_poly_instance_seg_API_KEY: ${{ secrets.ASL_POLY_INSTANCE_SEG_API_KEY }}
          bccd_favz3_API_KEY: ${{ secrets.BCCD_FAVZ3_API_KEY }}
          bccd_i4nym_API_KEY: ${{ secrets.BCCD_I4NYM_API_KEY }}
          cats_and_dogs_smnpl_API_KEY: ${{ secrets.CATS_AND_DOGS_SMNPL_API_KEY }}
          coins_xaz9i_API_KEY: ${{ secrets.COINS_XAZ9I_API_KEY }}
          melee_API_KEY: ${{ secrets.MELEE_API_KEY }}
          yolonas_test_API_KEY: ${{ secrets.YOLONAS_TEST_API_KEY }}
        run: |
          source .venv/bin/activate
          USE_INFERENCE_MODELS="$MODEL_MODE" MINIMUM_FPS=25 FUNCTIONAL=true PORT="${TEST_PORT:-9101}" SKIP_LMM_TEST=True python3 -m pytest tests/inference/integration_tests/
      - name: 🧹 Cleanup Test Docker - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'regression_with_torch' }}
        run: make stop_test_docker
      
      - name: 🔋 Start Test Docker - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'paligemma' }}
        run: |
          USE_INFERENCE_MODELS="$MODEL_MODE" PORT=9101 INFERENCE_SERVER_REPO=roboflow-inference-server-gpu make start_test_docker_gpu
          CI_IMAGE_ACTION=port python3 .github/scripts/ci_image.py
      - name: 🧪 Regression Paligemma - GPU
        id: paligemma_tests
        if: ${{ inputs.test_name == '' || inputs.test_name == 'paligemma' }}
        env:
          melee_API_KEY: ${{ secrets.MELEE_API_KEY }}
        run: |
          source .venv/bin/activate
          USE_INFERENCE_MODELS="$MODEL_MODE" PORT="${TEST_PORT:-9101}" python3 -m pytest tests/inference/integration_tests/test_paligemma.py
      - name: 🧹 Cleanup Test Docker - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'paligemma' }}
        run: make stop_test_docker
      - name: 🔋 Start Test Docker - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'florence' }}
        run: |
          USE_INFERENCE_MODELS="$MODEL_MODE" PORT=9101 INFERENCE_SERVER_REPO=roboflow-inference-server-gpu make start_test_docker_gpu
          CI_IMAGE_ACTION=port python3 .github/scripts/ci_image.py
      - name: 🧪 Regression Florence - GPU
        id: florence_tests
        if: ${{ inputs.test_name == '' || inputs.test_name == 'florence' }}
        env:
          melee_API_KEY: ${{ secrets.MELEE_API_KEY }}
        run: |
          source .venv/bin/activate
          USE_INFERENCE_MODELS="$MODEL_MODE" PORT="${TEST_PORT:-9101}" python3 -m pytest tests/inference/integration_tests/test_florence.py
      - name: 🧹 Cleanup Test Docker - GPU
        if: ${{ inputs.test_name == '' || inputs.test_name == 'florence' }}
        run: make stop_test_docker
      - name: 🔋 Start Test Docker - SAM2
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam2' }}
        run: |
          USE_INFERENCE_MODELS="$MODEL_MODE" PORT=9101 INFERENCE_SERVER_REPO=roboflow-inference-server-gpu make start_test_docker_gpu
          CI_IMAGE_ACTION=port python3 .github/scripts/ci_image.py
      - name: 🧪 Regression Tests - SAM2
        id: sam2_tests
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam2' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          source .venv/bin/activate
          USE_INFERENCE_MODELS="$MODEL_MODE" PORT="${TEST_PORT:-9101}" SKIP_SAM2_TESTS=False python3 -m pytest tests/inference/integration_tests/test_sam2.py
      - name: 🧹 Cleanup Test Docker - SAM2
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam2' }}
        run: make stop_test_docker
      - name: 🔋 Start Test Docker - SAM3
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam3' }}
        run: |
          USE_INFERENCE_MODELS="$MODEL_MODE" PORT=9101 INFERENCE_SERVER_REPO=roboflow-inference-server-gpu make start_test_docker_gpu
          CI_IMAGE_ACTION=port python3 .github/scripts/ci_image.py
      - name: 🧪 Regression Tests - SAM3
        id: sam3_tests
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam3' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          source .venv/bin/activate
          USE_INFERENCE_MODELS="$MODEL_MODE" PORT="${TEST_PORT:-9101}" SKIP_SAM3_TESTS=False python3 -m pytest tests/inference/integration_tests/test_sam3.py
      - name: 🧹 Cleanup Test Docker - SAM3
        if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam3' }}
        run: make stop_test_docker
#      - name: 🔋 Start Test Docker - GPU
#        if: ${{ inputs.test_name == '' || inputs.test_name == 'qwen25' }}
#        run: |
#          USE_INFERENCE_MODELS="$MODEL_MODE" PORT=9101 INFERENCE_SERVER_REPO=roboflow-inference-server-gpu make start_test_docker_gpu
#      - name: 🧪 Regression Tests - Qwen2.5
#        id: qwen25_tests
#        if: ${{ inputs.test_name == '' || inputs.test_name == 'qwen25' }}
#        env:
#          API_KEY: ${{ secrets.QWEN_API_KEY }}
#        run: |
#          source .venv/bin/activate
#          PORT="${TEST_PORT:-9101}" SKIP_QWEN25_TESTS=False python3 -m pytest tests/inference/integration_tests/qwen_test.py
#      - name: 🧹 Cleanup Test Docker - Qwen2.5
#        if: ${{ inputs.test_name == '' || inputs.test_name == 'qwen25' }}
#        run: make stop_test_docker
      - name: 🔋 Start Test Docker - MoonDream
        if: ${{ inputs.test_name == '' || inputs.test_name == 'moondream2' }}
        run: |
          USE_INFERENCE_MODELS="$MODEL_MODE" PORT=9101 INFERENCE_SERVER_REPO=roboflow-inference-server-gpu make start_test_docker_gpu
          CI_IMAGE_ACTION=port python3 .github/scripts/ci_image.py
      - name: 🧪 Regression Tests - MoonDream
        id: moondream_tests
        if: ${{ inputs.test_name == '' || inputs.test_name == 'moondream2' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          source .venv/bin/activate
          USE_INFERENCE_MODELS="$MODEL_MODE" PORT="${TEST_PORT:-9101}" SKIP_MOONDREAM2_TEST=False python3 -m pytest tests/inference/integration_tests/test_moondream2.py
      - name: 🧹 Cleanup Test Docker - MoonDream
        if: ${{ inputs.test_name == '' || inputs.test_name == 'moondream2' }}
        run: make stop_test_docker
      - name: 🚨 Show server logs on error
        run: |
          docker logs "$INFERENCE_TEST_CONTAINER"
          make stop_test_docker
        if: failure()
      - name: Remove this job's test container
        if: ${{ always() }}
        run: |
          docker rm -f "$INFERENCE_TEST_CONTAINER" > /dev/null 2>&1 || true
      - name: Remove private registry credentials
        if: ${{ always() && inputs.private_image && steps.ci_docker_config.outcome == 'success' }}
        run: rm -f -- "$DOCKER_CONFIG/config.json"
