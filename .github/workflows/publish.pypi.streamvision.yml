name: Publish streamvision to PyPI
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built wheel to PyPI (false = build-only smoke test)"
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on:
      labels: depot-ubuntu-22.04-small
      group: public-depot
    timeout-minutes: 10
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 🛞 Build streamvision wheel
        run: make create_streamvision_wheel
      - name: 🔍 Verify wheel is not empty
        # packages-dir uploads everything in dist/, so require exactly one
        # streamvision wheel and nothing else, containing actual Python modules.
        run: |
          ls -la dist/
          test "$(ls dist | wc -l)" -eq 1
          unzip -l dist/streamvision-*.whl | grep -qE ' streamvision/.+\.py$'
      - name: 📤 Upload built wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamvision-wheel
          path: dist/streamvision-*.whl
      - name: 🚀 Publish streamvision to PyPI
        # Release-triggered runs always publish. Manual dispatches publish
        # only when the operator explicitly opts in — default is build-only
        # so smoke-testing the packaging never accidentally re-tags PyPI.
        if: ${{ github.event_name == 'release' || github.event.inputs.publish == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
