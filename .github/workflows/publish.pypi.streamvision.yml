name: Publish streamvision to PyPI
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected package version (set by the release coordinator)
        type: string
        default: ""
      expected_revision:
        description: Expected commit SHA (set by the release coordinator)
        type: string
        default: ""
      publish:
        description: "Publish the built wheel to PyPI (false = build-only smoke test)"
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: ${{ github.repository == 'roboflow/inference' }}
    env:
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
    runs-on:
      labels: depot-ubuntu-22.04-small
      group: public-depot
    timeout-minutes: 40
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the requested candidate revision and version
        run: bash .release/pypi/dependencies.sh guard --package streamvision
      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 🛞 Build streamvision wheel
        run: make create_streamvision_wheel
      - name: 🔍 Verify wheel is not empty
        # packages-dir uploads everything in dist/, so require exactly one
        # streamvision wheel and nothing else, containing actual Python modules.
        run: |
          ls -la dist/
          test "$(ls dist | wc -l)" -eq 1
          unzip -l dist/streamvision-*.whl | grep -qE ' streamvision/.+\.py$'
      - name: 📤 Upload built wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamvision-wheel
          path: dist/streamvision-*.whl
      - name: Verify published dependencies before upload
        if: ${{ github.event.inputs.publish == 'true' }}
        run: bash .release/pypi/dependencies.sh gate --directory dist --plan-file release-evidence/dependency-plan.json --wait-seconds 600
      - name: 🚀 Publish streamvision to PyPI
        if: ${{ github.event.inputs.publish == 'true' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
      - name: Verify published wheel contents against the built candidate
        if: ${{ github.event.inputs.publish == 'true' }}
        run: bash .release/pypi/dependencies.sh verify-published --package streamvision --directory dist --plan-file release-evidence/dependency-plan.json --wait-seconds 600
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event.inputs.publish == 'true' }}
        with:
          name: streamvision-dependencies-${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: error
