name: UNIT TESTS - inference
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_stream_benchmark_checks:
        description: "Run stream pipeline benchmark harness tests (manual dispatch only)"
        required: false
        default: false
        type: boolean

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  call_is_mergeable:
    uses: ./.github/workflows/check_if_branch_is_mergeable.yml
    secrets: inherit
  build-dev-test:
    needs: call_is_mergeable
    if: ${{ github.event_name != 'pull_request' || needs.call_is_mergeable.outputs.mergeable_state != 'not_clean' }}
    runs-on:
      labels: depot-ubuntu-22.04-4
      group: public-depot
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
      - name: 🕰️ Fetch WP-A00 baseline commit
        # actions/checkout@v6 only fetches HEAD at depth 1, so this historical
        # commit is otherwise missing once HEAD moves past it. All four
        # git-history-dependent tests in test_streams_decontamination.py
        # (test_manifest_source_paths_match_git_tree_at_baseline_sha,
        # test_manifest_public_top_level_names_match_git_tree_at_baseline_sha,
        # test_a_end_manifest_records_a_real_base_commit_and_no_candidate) and
        # test_streams_public_contract.py
        # (test_active_learning_sink_signature_shape_is_unchanged) pin this
        # same SHA. Keep it in sync with BASELINE_SHA there.
        run: git fetch --depth 1 origin 65ad2beaaca0825bffc2fbbe99199d3a40994324
      - name: 📦 Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements/**') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools
          # Composition-root tests also exercise the CLI entry points.
          pip install -r requirements/requirements.cli.txt -r requirements/_requirements.txt -r requirements/requirements.cpu.txt -r requirements/requirements.sdk.http.txt -r requirements/requirements.test.unit.txt -r requirements/requirements.http.txt -r requirements/requirements.transformers.txt
          pip install --no-deps ./inference_models
      - name: 🏗️ Build and install roboflow-workflows wheel
        run: |
          make create_workflows_wheel
          pip install --find-links "${{ github.workspace }}/dist" "$(ls "${{ github.workspace }}"/dist/roboflow_workflows-*.whl)[enterprise]"
      - name: 🧪 Unit Tests of Inference
        timeout-minutes: 30
        env:
          STREAMS_REQUIRE_BASELINE_HISTORY: "1"
        run: python -m pytest tests/inference/unit_tests tests/unit/core/cache/test_air_gapped.py
      - name: 🧪 Development Profiling Tests
        timeout-minutes: 5
        run: python -m pytest tests/development/profiling
      - name: 🧪 Stream Pipeline Benchmark Harness Tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_stream_benchmark_checks
        timeout-minutes: 10
        run: python -m pytest development/stream_interface/test_benchmark_pipeline_extraction.py
