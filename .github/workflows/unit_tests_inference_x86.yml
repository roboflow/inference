name: UNIT TESTS - inference
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      release_source:
        description: Exact prepared release commit; empty for normal CI
        type: string
        default: ''
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_stream_benchmark_checks:
        description: "Run stream pipeline benchmark harness tests (manual dispatch only)"
        required: false
        default: false
        type: boolean

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-unit_tests_inference_x86-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  call_is_mergeable:
    uses: ./.github/workflows/check_if_branch_is_mergeable.yml
    secrets: inherit
  build-dev-test:
    needs: call_is_mergeable
    if: ${{ github.event_name != 'pull_request' || needs.call_is_mergeable.outputs.mergeable_state != 'not_clean' }}
    runs-on:
      labels: depot-ubuntu-22.04-4
      group: public-depot
    timeout-minutes: ${{ inputs.release_source != '' && 150 || 20 }}
    strategy:
      fail-fast: ${{ inputs.release_source == '' }}
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_source || github.sha }}
      - name: 📦 Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          # Workflow-specific key: many workflows install different package sets under
          # the shared "<os>-pip-<python>-<hash>" key, so this job restored whichever
          # set was saved first. No restore-keys, so the cache cannot grow without bound.
          key: ${{ runner.os }}-pip-unit-tests-inference-${{ matrix.python-version }}-${{ hashFiles('requirements/**') }}
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools
          # Composition-root tests also exercise the CLI entry points.
          pip install -r requirements/requirements.cli.txt -r requirements/_requirements.txt -r requirements/requirements.cpu.txt -r requirements/requirements.sdk.http.txt -r requirements/requirements.test.unit.txt -r requirements/requirements.http.txt -r requirements/requirements.transformers.txt
          pip install --no-deps './inference_models[torch-cpu,onnx-cpu]'
          pip install --no-deps ./inference_model_manager
          pip install --no-deps ./inference_server
      - name: "OpenCV build script regression tests [release-test]"
        timeout-minutes: ${{ inputs.release_source != '' && 6 || 2 }}
        uses: ./.github/actions/retry-tests
        with:
          attempts: ${{ inputs.release_source != '' && 3 || 1 }}
          command: |
            python -m pytest tests/docker/test_build_opencv.py -q
      - name: 🏗️ Build and install roboflow-workflows and streamvision wheels
        run: |
          make create_workflows_wheel create_streamvision_wheel
          pip install --find-links "${{ github.workspace }}/dist" "$(ls "${{ github.workspace }}"/dist/roboflow_workflows-*.whl)[enterprise,databricks]"
          pip install --find-links "${{ github.workspace }}/dist" "$(ls "${{ github.workspace }}"/dist/streamvision-*.whl)[webrtc]"
      - name: "🧪 Unit Tests of Inference [release-test]"
        timeout-minutes: ${{ inputs.release_source != '' && 90 || 30 }}
        # The CPU dependency profile does not install SAM3/SAM3D extras.
        uses: ./.github/actions/retry-tests
        with:
          attempts: ${{ inputs.release_source != '' && 3 || 1 }}
          command: |
            python -m pytest -n auto --dist loadfile -m "not sam3_extras" tests/inference/unit_tests tests/unit/core/cache/test_air_gapped.py
      - name: "🧪 Development Profiling Tests [release-test]"
        timeout-minutes: ${{ inputs.release_source != '' && 15 || 5 }}
        uses: ./.github/actions/retry-tests
        with:
          attempts: ${{ inputs.release_source != '' && 3 || 1 }}
          command: |
            python -m pytest tests/development/profiling
      - name: 🧪 Stream Pipeline Benchmark Harness Tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_stream_benchmark_checks
        timeout-minutes: ${{ inputs.release_source != '' && 30 || 10 }}
        uses: ./.github/actions/retry-tests
        with:
          attempts: ${{ inputs.release_source != '' && 3 || 1 }}
          command: |
            python -m pytest development/stream_interface/test_benchmark_pipeline_extraction.py
      - name: Retain RC attempt exit codes
        if: ${{ always() && inputs.release_source != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc-attempts-unit_tests_inference_x86-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-test-attempts.*/attempts.txt
          if-no-files-found: warn
