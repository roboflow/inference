name: UNIT TESTS - inference
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    # Fast-track CI (fast_track_ci.yml) calls this workflow for a branch that
    # deliberately diverged from main. `ref` is the PR head SHA to test; empty
    # keeps the default checkout for every other trigger.
    inputs:
      ref:
        description: "Git ref to check out (fast-track CI). Empty = default for the event."
        type: string
        required: false
        default: ""

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  # The literal file id keeps groups distinct when this workflow is *called*
  # (workflow_call): inside a called workflow github.workflow resolves to the
  # caller's name, so without it every workflow called by one caller would
  # share a single group and serialize.
  group: ${{ github.workflow }}-unit_tests_inference_x86-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  call_is_mergeable:
    uses: ./.github/workflows/check_if_branch_is_mergeable.yml
    secrets: inherit
  build-dev-test:
    needs: call_is_mergeable
    if: ${{ github.event_name != 'pull_request' || needs.call_is_mergeable.outputs.mergeable_state != 'not_clean' }}
    runs-on:
      labels: depot-ubuntu-22.04-4
      group: public-depot
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: 📦 Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements/**') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools
          # Composition-root tests also exercise the CLI entry points.
          pip install -r requirements/requirements.cli.txt -r requirements/_requirements.txt -r requirements/requirements.cpu.txt -r requirements/requirements.sdk.http.txt -r requirements/requirements.test.unit.txt -r requirements/requirements.http.txt -r requirements/requirements.transformers.txt
          pip install --no-deps ./inference_models
      - name: 🏗️ Build and install roboflow-workflows wheel
        run: |
          make create_workflows_wheel
          pip install --find-links "${{ github.workspace }}/dist" "$(ls "${{ github.workspace }}"/dist/roboflow_workflows-*.whl)[enterprise]"
      - name: 🧪 Unit Tests of Inference
        timeout-minutes: 30
        run: python -m pytest tests/inference/unit_tests tests/unit/core/cache/test_air_gapped.py
      - name: 🧪 Development Profiling Tests
        timeout-minutes: 5
        run: python -m pytest tests/development/profiling
