name: E2E TEST - hosted inference - PRODUCTION
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      skip_warmup:
        type: boolean
        description: Skip shared services warmup
        default: false
      test_target:
        type: choice
        description: Which service do you want to test?
        options:
          - serverless-v2

jobs:
  hosted-tests:
    if: ${{ github.event.inputs.test_target == 'serverless-v2' }}
    uses: ./.github/workflows/hosted_inference_e2e_repository.yml
    with:
      target: production
      skip_warmup: ${{ inputs.skip_warmup }}
    secrets:
      TIMING_PROFILE: ${{ secrets.HOSTED_E2E_PRODUCTION_TIMING_PROFILE }}
      HOSTED_PLATFORM_TESTS_API_KEY: ${{ secrets.LOAD_TEST_PRODUCTION_API_KEY }}
      OPENAI_KEY: ${{ secrets.OPEN_AI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_VISION_API_KEY: ${{ secrets.GOOGLE_VISION_API_KEY }}
