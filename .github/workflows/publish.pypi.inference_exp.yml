name: Publish Inference Models Wheels to PyPi
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected package version (set by the release coordinator)
        type: string
        default: ""
      expected_revision:
        description: Expected commit SHA (set by the release coordinator)
        type: string
        default: ""
      publish:
        description: "Actually publish the package to PyPI"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: ${{ github.repository == 'roboflow/inference' }}
    env:
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
    name: ${{ inputs.publish && 'Manual publish' || 'Manual build only' }}
    runs-on:
      labels: depot-ubuntu-22.04-small
      group: public-depot
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the requested candidate revision and version
        run: bash .release/pypi/dependencies.sh guard --package inference-models
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: 📦 Install dependencies
        working-directory: inference_models
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
      - name: 🔨 Build package
        working-directory: inference_models
        run: |
          python -m uv lock --check
          python -m uv build
      - name: Verify published dependencies before upload
        if: ${{ github.event.inputs.publish == 'true' }}
        run: bash .release/pypi/dependencies.sh gate --directory inference_models/dist --plan-file release-evidence/dependency-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: inference-models-distributions-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: inference_models/dist/
      - name: 🚀 Publish to PyPI
        if: ${{ github.event.inputs.publish == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: inference_models/dist/
          skip-existing: true
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event.inputs.publish == 'true' }}
        with:
          name: inference-models-dependencies-${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: error
