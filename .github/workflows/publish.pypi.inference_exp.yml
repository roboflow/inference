name: Publish Inference Models Wheels to PyPi
run-name: pypi-inference-models-${{ inputs.coordinator_run_id != '' && format('parent-{0}', inputs.coordinator_run_id) || format('manual-{0}', github.run_id) }}
on:
  workflow_dispatch:
    inputs:
      coordinator_run_id:
        description: Parent release run (empty for standalone manual publication)
        type: string
        default: ""
      expected_version:
        description: Expected package version (set by the release coordinator)
        type: string
        default: ""
      expected_revision:
        description: Expected commit SHA (set by the release coordinator)
        type: string
        default: ""
      publish:
        description: "Actually publish the package to PyPI"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  build:
    permissions:
      contents: read
      actions: read
      id-token: write
    if: ${{ github.repository == 'roboflow/inference' }}
    env:
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
    name: ${{ inputs.publish && 'Manual publish' || 'Manual build only' }}
    runs-on:
      labels: depot-ubuntu-22.04-small
      group: public-depot
    timeout-minutes: 65
    concurrency:
      group: pypi-inference-models-${{ github.event.inputs.publish == 'true' && 'publish' || github.run_id }}
      cancel-in-progress: false
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the requested candidate revision and version
        run: bash .release/pypi/dependencies.sh guard --package inference-models
      - name: Select retained candidate inference-models
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .release/pypi/candidate.sh select --profile inference-models
          jq -r 'to_entries[] | "\(.key)=\(.value)"' release-evidence/selection-inference-models.json >> "$GITHUB_OUTPUT"
      - name: Download retained candidate inference-models
        if: ${{ steps.candidate.outputs.reused == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.candidate.outputs.id }}
          merge-multiple: true
          path: release-candidate/inference-models
      - name: Restore retained candidate inference-models
        if: ${{ steps.candidate.outputs.reused == 'true' }}
        run: bash .release/pypi/candidate.sh restore --profile inference-models
      - name: Download coordinator dependency selection
        if: ${{ steps.candidate.outputs.reused != 'true' && inputs.coordinator_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: candidate-dependencies
          run-id: ${{ inputs.coordinator_run_id }}
          github-token: ${{ github.token }}
          path: release-candidate/dependencies
      - name: Prepare release lock inference-models
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        run: bash .release/pypi/prepare.sh --profile inference-models
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: 📦 Install dependencies
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        working-directory: inference_models
        run: |
          python -m pip install -c ../.release/pypi/build-requirements.txt uv
      - name: 🔨 Build package
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        working-directory: inference_models
        run: |
          python -m uv lock --check
          python -m uv build --build-constraints ../.release/pypi/build-requirements.txt --no-create-gitignore
      - name: Seal candidate inference-models
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        run: bash .release/pypi/candidate.sh seal --profile inference-models
      - name: Retain candidate inference-models
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: candidate-inference-models
          retention-days: 90
          if-no-files-found: error
          path: release-candidate/inference-models/
      - name: Verify retained candidate inference-models
        run: bash .release/pypi/candidate.sh verify --profile inference-models
      - name: Verify published dependencies before upload
        if: ${{ github.event.inputs.publish == 'true' }}
        run: bash .release/pypi/dependencies.sh gate --directory inference_models/dist --plan-file release-evidence/dependency-plan.json --wait-seconds 600
      - name: Verify existing files and stage missing distributions
        if: ${{ github.event.inputs.publish == 'true' }}
        id: prepare
        run: |
          bash .release/pypi/publish.sh prepare --profile inference-models --directory inference_models/dist --upload-directory release-upload --wait-seconds 600 --receipt release-evidence/publication-prepare.json
          echo "upload=$(jq -r '.upload' release-evidence/publication-prepare.json)" >> "$GITHUB_OUTPUT"
      - name: 🚀 Publish to PyPI
        continue-on-error: true
        if: ${{ github.event.inputs.publish == 'true' && steps.prepare.outputs.upload == 'true' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: release-upload/
      - name: Verify the complete published inventory
        if: ${{ github.event.inputs.publish == 'true' }}
        run: bash .release/pypi/publish.sh verify --profile inference-models --directory inference_models/dist --upload-directory release-upload --wait-seconds 600 --receipt release-evidence/publication-receipt.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event.inputs.publish == 'true' }}
        with:
          name: inference-models-dependencies-${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: error
