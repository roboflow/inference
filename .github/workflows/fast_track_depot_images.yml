name: Fast-track Depot image reuse trial
# Opt in through Fast-track integration tests: use_depot_images=true.
# Repository variables (not environment variables): CI_DEPOT_REUSE_ENABLED=true,
# CI_DEPOT_APPROVED_REF=<exact fast-track ref>, CI_DEPOT_APPROVED_SHA=<reviewed SHA>.
# Before configuration, verify Depot trust, pull-only scope, saved-image retention
# covering retries, and isolated ephemeral runners. Protect both environments
# with required reviewers and exact deployment-branch restrictions.
# ci-depot-builder secrets: CI_DEPOT_PROJECT, CI_DEPOT_REGISTRY, CI_DEPOT_BUILD_TOKEN
# ci-depot-reader secrets: CI_DEPOT_REGISTRY, CI_DEPOT_PULL_TOKEN (registry Pull only).
# Keep tokens in environment secrets; no repository/org tokens or OIDC grants.
# Registry is the same project-scoped Depot repository in both environments.
# This trial saves images without release tags and always runs both model modes
# and all existing server stages. CPU arm64 is built, not runtime tested.
# Public logs omit build metadata and test output. No public diagnostic artifacts.
# Rerun failed jobs while saved manifests remain available; never rebuild on pull
# failure. Full reruns create new images. Do not change approval during a run.
# Service-side policies and live transport have not been verified by offline tests.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      API_KEY:
        required: false
      ASL_INSTANCE_SEGMENTATION_API_KEY:
        required: false
      ASL_POLY_INSTANCE_SEG_API_KEY:
        required: false
      BCCD_FAVZ3_API_KEY:
        required: false
      BCCD_I4NYM_API_KEY:
        required: false
      CATS_AND_DOGS_SMNPL_API_KEY:
        required: false
      COINS_XAZ9I_API_KEY:
        required: false
      MELEE_API_KEY:
        required: false
      YOLONAS_TEST_API_KEY:
        required: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-depot-trial-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  authorize:
    if: ${{ github.repository == 'roboflow/inference' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_DEPOT_REUSE_ENABLED: ${{ vars.CI_DEPOT_REUSE_ENABLED }}
      CI_DEPOT_APPROVED_REF: ${{ vars.CI_DEPOT_APPROVED_REF }}
      CI_DEPOT_APPROVED_SHA: ${{ vars.CI_DEPOT_APPROVED_SHA }}
      CI_DEPOT_ACTION: authorize
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the explicitly approved fast-track commit
        run: python3 .github/scripts/depot_ci_image.py
  cpu-image:
    needs: authorize
    uses: ./.github/workflows/depot_ci_image_build.yml
    with:
      family: cpu
  cpu-tests:
    needs: cpu-image
    uses: ./.github/workflows/depot_ci_image_tests.yml
    with:
      family: cpu
      image_digest: ${{ needs.cpu-image.outputs.amd64_digest }}
    secrets:
      API_KEY: ${{ secrets.API_KEY }}
      ASL_INSTANCE_SEGMENTATION_API_KEY: ${{ secrets.ASL_INSTANCE_SEGMENTATION_API_KEY }}
      ASL_POLY_INSTANCE_SEG_API_KEY: ${{ secrets.ASL_POLY_INSTANCE_SEG_API_KEY }}
      BCCD_FAVZ3_API_KEY: ${{ secrets.BCCD_FAVZ3_API_KEY }}
      BCCD_I4NYM_API_KEY: ${{ secrets.BCCD_I4NYM_API_KEY }}
      CATS_AND_DOGS_SMNPL_API_KEY: ${{ secrets.CATS_AND_DOGS_SMNPL_API_KEY }}
      COINS_XAZ9I_API_KEY: ${{ secrets.COINS_XAZ9I_API_KEY }}
      MELEE_API_KEY: ${{ secrets.MELEE_API_KEY }}
      YOLONAS_TEST_API_KEY: ${{ secrets.YOLONAS_TEST_API_KEY }}
  gpu-image:
    needs: authorize
    uses: ./.github/workflows/depot_ci_image_build.yml
    with:
      family: gpu
  gpu-tests:
    needs: gpu-image
    uses: ./.github/workflows/depot_ci_image_tests.yml
    with:
      family: gpu
      image_digest: ${{ needs.gpu-image.outputs.amd64_digest }}
    secrets:
      API_KEY: ${{ secrets.API_KEY }}
      ASL_INSTANCE_SEGMENTATION_API_KEY: ${{ secrets.ASL_INSTANCE_SEGMENTATION_API_KEY }}
      ASL_POLY_INSTANCE_SEG_API_KEY: ${{ secrets.ASL_POLY_INSTANCE_SEG_API_KEY }}
      BCCD_FAVZ3_API_KEY: ${{ secrets.BCCD_FAVZ3_API_KEY }}
      BCCD_I4NYM_API_KEY: ${{ secrets.BCCD_I4NYM_API_KEY }}
      CATS_AND_DOGS_SMNPL_API_KEY: ${{ secrets.CATS_AND_DOGS_SMNPL_API_KEY }}
      COINS_XAZ9I_API_KEY: ${{ secrets.COINS_XAZ9I_API_KEY }}
      MELEE_API_KEY: ${{ secrets.MELEE_API_KEY }}
      YOLONAS_TEST_API_KEY: ${{ secrets.YOLONAS_TEST_API_KEY }}
  complete:
    if: ${{ always() && github.repository == 'roboflow/inference' && github.event_name == 'workflow_dispatch' }}
    needs: [authorize, cpu-image, gpu-image, cpu-tests, gpu-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both saved images and all test modes
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CPU_DIGEST: ${{ needs.cpu-image.outputs.amd64_digest }}
          CPU_ARM_DIGEST: ${{ needs.cpu-image.outputs.arm64_digest }}
          GPU_DIGEST: ${{ needs.gpu-image.outputs.amd64_digest }}
          CPU_TESTED: ${{ needs.cpu-tests.outputs.verified_digest }}
          GPU_TESTED: ${{ needs.gpu-tests.outputs.verified_digest }}
        run: |
          set -euo pipefail
          test "$RESULTS" = "success success success success success"
          for digest in "$CPU_DIGEST" "$CPU_ARM_DIGEST" "$GPU_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          done
          test "$CPU_TESTED" = "$CPU_DIGEST"
          test "$GPU_TESTED" = "$GPU_DIGEST"
          echo 'CPU and GPU saved-image tests passed in both model modes.' >> "$GITHUB_STEP_SUMMARY"
