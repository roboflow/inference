name: Build and Push Jetson 7.2.0 Media Container

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker.media.jetson.7.2.0.yml"
      - "docker/dockerfiles/Dockerfile.media.jetson.7.2.0"
      - "docker/native/jetson_tensor_bridge/**"
      - "docker/scripts/**"
      - "LICENSE"
      - "LICENSE.core"
  workflow_dispatch:
    inputs:
      force_push:
        type: boolean
        description: "Do you want to push the image after building?"
        default: false
      custom_tag:
        type: string
        description: "Custom tag to use for the image"
        default: ""

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  VERSION: "0.0.0"
  BASE_IMAGE: "roboflow/roboflow-inference-media-jetson-7.2.0"

jobs:
  docker:
    runs-on:
      labels: depot-ubuntu-24.04-4
      group: public-depot
    timeout-minutes: 180
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Docker Hub
        if: ${{ github.event_name == 'release' || inputs.force_push == true }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Read version from file
        run: echo "VERSION=$(DISABLE_VERSION_CHECK=true python ./inference/core/version.py)" >> "$GITHUB_ENV"
      - name: Determine image tags
        id: tags
        uses: ./.github/actions/determine-tags
        with:
          custom_tag: ${{ inputs.custom_tag }}
          version: ${{ env.VERSION }}
          base_image: ${{ env.BASE_IMAGE }}
          force_push: ${{ inputs.force_push }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
      - name: Build image
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: v1xzfwkc4b
          context: .
          file: ./docker/dockerfiles/Dockerfile.media.jetson.7.2.0
          platforms: linux/arm64
          push: ${{ github.event_name == 'release' || inputs.force_push == true }}
          save: ${{ github.event_name != 'release' && !inputs.force_push }}
          save-tag: ${{ github.event_name != 'release' && !inputs.force_push && format('media-jp72-{0}', github.sha) || '' }}
          tags: ${{ steps.tags.outputs.image_tags }}
