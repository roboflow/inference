name: Publish roboflow-workflows to PyPI
run-name: pypi-roboflow-workflows-${{ inputs.coordinator_run_id != '' && format('parent-{0}', inputs.coordinator_run_id) || format('manual-{0}', github.run_id) }}
on:
  workflow_dispatch:
    inputs:
      coordinator_run_id:
        description: Parent release run (empty for standalone manual publication)
        type: string
        default: ""
      expected_version:
        description: Expected package version (set by the release coordinator)
        type: string
        default: ""
      expected_revision:
        description: Expected commit SHA (set by the release coordinator)
        type: string
        default: ""
      publish:
        description: "Publish the built wheel to PyPI (false = build-only smoke test)"
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    permissions:
      contents: read
      actions: read
      id-token: write
    if: ${{ github.repository == 'roboflow/inference' }}
    env:
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      COORDINATOR_RUN_ID: ${{ inputs.coordinator_run_id }}
    runs-on:
      labels: depot-ubuntu-22.04-small
      group: public-depot
    timeout-minutes: 65
    concurrency:
      group: pypi-roboflow-workflows-${{ github.event.inputs.publish == 'true' && 'publish' || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the requested candidate revision and version
        run: bash .release/pypi/dependencies.sh guard --package roboflow-workflows
      - name: Select retained candidate roboflow-workflows
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .release/pypi/candidate.sh select --profile roboflow-workflows
          jq -r 'to_entries[] | "\(.key)=\(.value)"' release-evidence/selection-roboflow-workflows.json >> "$GITHUB_OUTPUT"
      - name: Download retained candidate roboflow-workflows
        if: ${{ steps.candidate.outputs.reused == 'true' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.candidate.outputs.id }}
          merge-multiple: true
          path: release-candidate/roboflow-workflows
      - name: Restore retained candidate roboflow-workflows
        if: ${{ steps.candidate.outputs.reused == 'true' }}
        run: bash .release/pypi/candidate.sh restore --profile roboflow-workflows
      - name: Download coordinator dependency selection
        if: ${{ steps.candidate.outputs.reused != 'true' && inputs.coordinator_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: candidate-dependencies
          run-id: ${{ inputs.coordinator_run_id }}
          github-token: ${{ github.token }}
          path: release-candidate/dependencies
      - name: Prepare release lock roboflow-workflows
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        run: bash .release/pypi/prepare.sh --profile roboflow-workflows
      - name: 🐍 Set up Python 3.12
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 🛞 Build roboflow-workflows wheel
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        run: make create_workflows_wheel
      - name: Seal candidate roboflow-workflows
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        run: bash .release/pypi/candidate.sh seal --profile roboflow-workflows
      - name: Retain candidate roboflow-workflows
        if: ${{ steps.candidate.outputs.reused != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: candidate-roboflow-workflows
          retention-days: 90
          if-no-files-found: error
          path: release-candidate/roboflow-workflows/
      - name: Verify retained candidate roboflow-workflows
        run: bash .release/pypi/candidate.sh verify --profile roboflow-workflows
      - name: Verify published dependencies before upload
        if: ${{ github.event.inputs.publish == 'true' }}
        run: bash .release/pypi/dependencies.sh gate --directory dist --plan-file release-evidence/dependency-plan.json --wait-seconds 600
      - name: Verify existing files and stage missing distributions
        if: ${{ github.event.inputs.publish == 'true' }}
        id: prepare
        run: |
          bash .release/pypi/publish.sh prepare --profile roboflow-workflows --directory dist --upload-directory release-upload --wait-seconds 600 --receipt release-evidence/publication-prepare.json
          echo "upload=$(jq -r '.upload' release-evidence/publication-prepare.json)" >> "$GITHUB_OUTPUT"
      - name: 🚀 Publish roboflow-workflows to PyPI
        continue-on-error: true
        if: ${{ github.event.inputs.publish == 'true' && steps.prepare.outputs.upload == 'true' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: release-upload/
      - name: Verify the complete published inventory
        if: ${{ github.event.inputs.publish == 'true' }}
        run: bash .release/pypi/publish.sh verify --profile roboflow-workflows --directory dist --upload-directory release-upload --wait-seconds 600 --receipt release-evidence/publication-receipt.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event.inputs.publish == 'true' }}
        with:
          name: roboflow-workflows-dependencies-${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: error
