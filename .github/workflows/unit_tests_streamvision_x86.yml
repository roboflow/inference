name: UNIT TESTS - streamvision
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - stream_vision/**
      - .github/workflows/unit_tests_streamvision_x86.yml
  push:
    branches: [main]
    paths:
      - stream_vision/**
      - .github/workflows/unit_tests_streamvision_x86.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  call_is_mergeable:
    uses: ./.github/workflows/check_if_branch_is_mergeable.yml
    secrets: inherit
  package-tests:
    needs: call_is_mergeable
    if: ${{ github.event_name != 'pull_request' || needs.call_is_mergeable.outputs.mergeable_state != 'not_clean' }}
    runs-on:
      labels: depot-ubuntu-22.04-4
      group: public-depot
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            stream_vision/pyproject.toml
            stream_vision/uv.lock
      - name: Build same-checkout wheels and check lock
        run: make create_isolation_wheels
      - name: Install only standalone package dependencies
        run: |
          pip install --find-links "${{ github.workspace }}/dist" \
            "$(ls "${{ github.workspace }}"/dist/streamvision-*.whl)[test,webrtc]" \
            "${{ github.workspace }}"/dist/roboflow_workflows-*.whl \
            "${{ github.workspace }}"/dist/inference_models-*.whl
          pip check
      - name: Package unit tests
        working-directory: stream_vision
        run: python -m pytest tests/unit_tests
      - name: Installed-wheel isolation tests
        working-directory: stream_vision
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          PIP_CONSTRAINT: ${{ github.workspace }}/workflows/tests/isolation/constraints-cpu.txt
          STREAMVISION_ISOLATION_FIND_LINKS: ${{ github.workspace }}/dist
        run: |
          STREAMVISION_ISOLATION_WHEEL="$(ls "${{ github.workspace }}"/dist/streamvision-*.whl)" \
            python -m pytest tests/isolation
