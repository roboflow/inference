name: Docs Workflow
permissions:
  contents: read

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy docs?"
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: depot-ubuntu-22.04-32
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out inference repository
        uses: actions/checkout@v6
        with:
          path: inference_repo
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Docs Theme
        run: |
          npm ci
        working-directory: ./inference_repo/theme_build

      - name: Build theme assets
        run: npm run build
        working-directory: ./inference_repo/theme_build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          check-latest: true

      - name: Install Python dependencies
        run: |
          # Upgrade pip and setuptools
          python -m pip install --upgrade pip setuptools

          # The site is now a landing page plus redirects, so the build no
          # longer imports the inference package.
          pip install -r requirements/requirements.docs.txt
        working-directory: ./inference_repo

      - name: Replace template variables (VERSION, etc.)
        run: python docs/scripts/macros.py
        working-directory: ./inference_repo

      - name: Validate generated docs (Jinja2 syntax)
        run: python -m development.docs.validate_docs_jinja2
        working-directory: ./inference_repo

      - name: Build docs
        run: zensical build --clean
        working-directory: ./inference_repo

      - name: Generate llms.txt and markdown pages
        run: python docs/scripts/generate_llms_txt.py
        working-directory: ./inference_repo

      - name: Verify build output
        run: |
          echo "Checking for theme assets in site/..."
          test -f site/static/styles.css || { echo "ERROR: site/static/styles.css missing!"; exit 1; }
          test -f site/static/dist/home.js || { echo "ERROR: site/static/dist/home.js missing!"; exit 1; }
          echo "Theme assets OK."
          echo "Checking redirect pages..."
          test -f site/404.html || { echo "ERROR: site/404.html missing!"; exit 1; }
          grep -q "docs.roboflow.com" site/install/index.html || { echo "ERROR: /install/ does not redirect!"; exit 1; }
          grep -q "docs.roboflow.com" site/workflows/about/index.html || { echo "ERROR: /workflows/about/ does not redirect!"; exit 1; }
          echo "Redirects OK."
          echo "Checking for llms.txt..."
          test -f site/llms.txt || { echo "ERROR: site/llms.txt missing!"; exit 1; }
          test -f site/llms-full.txt || { echo "ERROR: site/llms-full.txt missing!"; exit 1; }
          echo "llms.txt OK."
        working-directory: ./inference_repo

      - name: Upload site artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: docs-site-preview
          path: ./inference_repo/site
          retention-days: 7

      - name: Deploy docs
        # Only deploy if release event OR if deploy input was set to true
        if: ${{ github.event_name == 'release' || github.event.inputs.deploy == 'true' }}
        run: |
          pip install ghp-import
          ghp-import -n -p -f site
        working-directory: ./inference_repo
