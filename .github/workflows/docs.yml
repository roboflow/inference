name: Docs Workflow
permissions:
  contents: read

on:
  release:
    types: [created]
  pull_request:
    paths:
      - "docs/**"
      - "theme/**"
      - "theme_build/**"
      - "mkdocs.yml"
      - "requirements/requirements.docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy docs?"
        type: boolean
        required: false
        default: false

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build:
    runs-on: depot-ubuntu-22.04-small
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out inference repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          path: inference_repo
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Install Docs Theme
        run: |
          npm ci
        working-directory: ./inference_repo/theme_build

      - name: Build theme assets
        run: npm run build
        working-directory: ./inference_repo/theme_build

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          check-latest: true

      - name: Install Python dependencies
        run: |
          # Upgrade pip and setuptools
          python -m pip install --upgrade pip setuptools

          # The site is now a landing page plus redirects, so the build no
          # longer imports the inference package.
          pip install -r requirements/requirements.docs.txt
        working-directory: ./inference_repo

      - name: Replace template variables (VERSION, etc.)
        run: python docs/scripts/macros.py
        working-directory: ./inference_repo

      - name: Validate generated docs (Jinja2 syntax)
        run: python -m development.docs.validate_docs_jinja2
        working-directory: ./inference_repo

      - name: Build docs
        run: zensical build --clean
        working-directory: ./inference_repo

      - name: Generate llms.txt and markdown pages
        run: python docs/scripts/generate_llms_txt.py
        working-directory: ./inference_repo

      - name: Verify build output
        run: |
          echo "Checking for theme assets in site/..."
          test -f site/static/styles.css || { echo "ERROR: site/static/styles.css missing!"; exit 1; }
          test -f site/static/dist/home.js || { echo "ERROR: site/static/dist/home.js missing!"; exit 1; }
          echo "Theme assets OK."
          echo "Checking redirect pages..."
          test -f site/404.html || { echo "ERROR: site/404.html missing!"; exit 1; }
          grep -q "docs.roboflow.com" site/install/index.html || { echo "ERROR: /install/ does not redirect!"; exit 1; }
          grep -q "docs.roboflow.com" site/workflows/about/index.html || { echo "ERROR: /workflows/about/ does not redirect!"; exit 1; }
          echo "Redirects OK."
          echo "Checking for llms.txt..."
          test -f site/llms.txt || { echo "ERROR: site/llms.txt missing!"; exit 1; }
          test -f site/llms-full.txt || { echo "ERROR: site/llms-full.txt missing!"; exit 1; }
          echo "llms.txt OK."
        working-directory: ./inference_repo

      - name: Upload site artifact
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site-preview
          path: ./inference_repo/site
          retention-days: 7

      - name: Deploy docs
        # Only deploy on a release, or on a manual dispatch that asked for it.
        # Pull request runs build and verify the site, but never publish it.
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true') }}
        run: |
          pip install ghp-import
          ghp-import -n -p -f site
        working-directory: ./inference_repo
