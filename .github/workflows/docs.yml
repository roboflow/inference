name: Docs Workflow
permissions:
  contents: read

on:
  release:
    types: [created]
  pull_request:
    paths:
      - "docs/**"
      - "development/docs/**"
      - "tests/docs/**"
      - "theme/**"
      - "mkdocs.yml"
      - "requirements/requirements.docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy docs?"
        type: boolean
        required: false
        default: false

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build:
    runs-on: depot-ubuntu-22.04-small
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out inference repository
        uses: actions/checkout@v6
        with:
          path: inference_repo
          fetch-depth: 0

      - name: Set up Node for redirect regression tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          check-latest: true

      - name: Install Python dependencies
        run: |
          # Upgrade pip and setuptools
          python -m pip install --upgrade pip setuptools

          # The site now consists of redirects, so the build does not import
          # the inference package.
          pip install -r requirements/requirements.docs.txt
        working-directory: ./inference_repo

      - name: Replace template variables (VERSION, etc.)
        run: python docs/scripts/macros.py
        working-directory: ./inference_repo

      - name: Validate generated docs (Jinja2 syntax)
        run: python -m development.docs.validate_docs_jinja2
        working-directory: ./inference_repo

      - name: Test redirect destination collection (offline)
        run: python -m unittest tests.docs.test_redirect_destinations
        working-directory: ./inference_repo

      - name: Build docs
        run: zensical build --clean
        working-directory: ./inference_repo

      - name: Test built redirect JavaScript
        run: node --test development/docs/test_redirect_pages.mjs
        working-directory: ./inference_repo

      - name: Generate llms.txt and markdown pages
        run: python docs/scripts/generate_llms_txt.py
        working-directory: ./inference_repo

      - name: Verify build output
        run: |
          echo "Checking redirect pages..."
          test -f site/404.html || { echo "ERROR: site/404.html missing!"; exit 1; }
          python - <<'PY'
          from html import unescape
          from pathlib import Path

          homepage = unescape(Path("site/index.html").read_text())
          assert '<link rel="canonical" href="https://docs.roboflow.com/deployment/self-hosted/self-hosted">' in homepage, "Homepage canonical URL is incorrect"
          assert '<meta http-equiv="refresh" content="0; url=https://docs.roboflow.com/deployment/self-hosted/self-hosted">' in homepage, "Homepage does not redirect"
          assert 'noindex' not in homepage.lower(), "Homepage must remain indexable"
          PY
          grep -q "docs.roboflow.com" site/install/index.html || { echo "ERROR: /install/ does not redirect!"; exit 1; }
          grep -q "docs.roboflow.com" site/workflows/about/index.html || { echo "ERROR: /workflows/about/ does not redirect!"; exit 1; }
          grep -Fq '<meta name="robots" content="noindex,follow">' site/install/index.html || { echo "ERROR: per-page redirect indexing changed!"; exit 1; }
          echo "Redirects OK."
          echo "Checking for llms.txt..."
          test -f site/llms.txt || { echo "ERROR: site/llms.txt missing!"; exit 1; }
          test -f site/llms-full.txt || { echo "ERROR: site/llms-full.txt missing!"; exit 1; }
          echo "llms.txt OK."
        working-directory: ./inference_repo

      - name: Upload site artifact
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: docs-site-preview
          path: ./inference_repo/site
          retention-days: 7

      - name: Deploy docs
        # Only deploy on a release, or on a manual dispatch that asked for it.
        # Pull request runs build and verify the site, but never publish it.
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true') }}
        run: |
          pip install ghp-import
          ghp-import -n -p -f site
        working-directory: ./inference_repo
