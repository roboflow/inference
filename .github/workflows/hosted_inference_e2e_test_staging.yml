name: E2E TEST - hosted inference - STAGING
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      skip_warmup:
        type: boolean
        description: "Do you want to skip services warmup?"
        default: false
      test_target:
        type: choice
        description: "Which service you want to test?"
        options:
          - serverless-v2
jobs:
  build:
    name: E2E shard ${{ matrix.shard }}
    runs-on:
      labels: depot-ubuntu-22.04-small
      group: public-depot
    timeout-minutes: 30
    strategy:
      # Shards are independent; let every shard finish so one run reports all
      # failures. tests/inference/hosted_platform_tests/sharding.py splits the
      # collected tests round-robin into SHARD_TOTAL (= matrix size) shards.
      # Each shard warms the services itself (unless skip_warmup), in parallel,
      # which costs less wall time than a separate warmup job ahead of them.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 📦 Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('requirements/**') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-
      - name: 🦾 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/requirements.test.unit.txt -r requirements/requirements.test.integration.txt -r requirements/requirements.sdk.http.txt
      - name: 📝 E2E test of HOSTED INFERENCE at 😎 STAGING SERVERLESS 😎 🔥🔥🔥🔥
        if: ${{ github.event.inputs.test_target == 'serverless-v2' }}
        run:
          SHARD_INDEX=${{ matrix.shard }} SHARD_TOTAL=${{ strategy.job-total }} SKIP_WARMUP=${{ github.event.inputs.skip_warmup }} HOSTED_PLATFORM_TESTS_API_KEY=${{ secrets.LOAD_TEST_STAGING_API_KEY }} HOSTED_PLATFORM_TESTS_PROJECT=roboflow-staging-serverless OPENAI_KEY=${{ secrets.OPEN_AI_API_KEY }} GOOGLE_API_KEY=${{ secrets.GEMINI_API_KEY }} ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }} GOOGLE_VISION_API_KEY=${{ secrets.GOOGLE_VISION_API_KEY }} pytest tests/inference/hosted_platform_tests/
