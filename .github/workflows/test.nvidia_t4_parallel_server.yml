name: Code Quality & Regression Tests - NVIDIA T4 (Parallel Server)
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      depot_project:
        description: 'Sandbox Depot project for this manual run'
        type: string
        default: 7m01vtml7h
      test_name:
        description: 'Name of specific test to run. Leave empty to run all tests.'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - regression_without_torch
          - regression_with_torch
      run_iobinding_benchmark:
        description: 'Compare NumPy and ONNX Runtime output allocation in Docker.'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      depot_project:
        type: string
        required: true
      test_name:
        type: string
        default: ''
      run_iobinding_benchmark:
        type: boolean
        default: false
    secrets:
      API_KEY:
        required: false
      ASL_INSTANCE_SEGMENTATION_API_KEY:
        required: false
      ASL_POLY_INSTANCE_SEG_API_KEY:
        required: false
      BCCD_FAVZ3_API_KEY:
        required: false
      BCCD_I4NYM_API_KEY:
        required: false
      CATS_AND_DOGS_SMNPL_API_KEY:
        required: false
      COINS_XAZ9I_API_KEY:
        required: false
      MELEE_API_KEY:
        required: false
      YOLONAS_TEST_API_KEY:
        required: false

concurrency:
  # One live run per workflow per ref. A newer push to the same PR, or a newer
  # merge to main, cancels the older run. Manual dispatches get their own group
  # (keyed by run id) so they never cancel, or get cancelled by, push-triggered
  # runs. Release runs are keyed by the tag ref and are never cancelled.
  group: ${{ github.workflow }}-parallel-gpu-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  image:
    if: ${{ github.repository == 'roboflow/inference' && !github.event.act && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci_image_build.yml
    with:
      family: parallel-gpu
      depot_project: ${{ inputs.depot_project }}
  test-image:
    needs: image
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci_image_build.yml
    with:
      family: parallel-tests
      depot_project: ${{ inputs.depot_project }}
      server_image_digest: ${{ needs.image.outputs.amd64_digest }}
  build:
    needs: [image, test-image]
    runs-on: Roboflow-GPU-VM-Runner

    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      DEPOT_PROJECT_ID: ${{ inputs.depot_project }}

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate trusted source and destination before authentication
        env:
          CI_DEPOT_ACTION: validate
          IMAGE_FAMILY: parallel-gpu
        run: python3 .github/scripts/depot_ci_image.py
      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
      - name: Pull and verify the saved server image, then remove pull credentials
        env:
          CI_DEPOT_ACTION: pull
          IMAGE_FAMILY: parallel-gpu
          IMAGE_DIGEST: ${{ needs.image.outputs.amd64_digest }}
        run: python3 .github/scripts/depot_ci_image.py
      - name: Pull and verify the saved test image, then remove pull credentials
        env:
          CI_DEPOT_ACTION: pull
          IMAGE_FAMILY: parallel-tests
          IMAGE_DIGEST: ${{ needs.test-image.outputs.amd64_digest }}
          SERVER_IMAGE_DIGEST: ${{ needs.image.outputs.amd64_digest }}
        run: python3 .github/scripts/depot_ci_image.py
      - name: 🧪 Shared-memory and CUDA worker startup tests
        id: parallel_unit_tests
        run: |
          docker run --rm --gpus all --entrypoint python3 "$INFERENCE_PARALLEL_TEST_IMAGE" \
            -c 'import torch; assert torch.cuda.is_available(), "CUDA device required for T4 coverage"'
          docker run --rm --gpus all -e PARALLEL_IMAGE_TEST=true -e PARALLEL_TEST_DEVICE=cuda \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/app,readonly" \
            "$INFERENCE_PARALLEL_TEST_IMAGE" -p no:cacheprovider \
            tests/inference/unit_tests/enterprise/parallel tests/docker/test_parallel_worker_startup.py \
            tests/inference/unit_tests/core/utils/test_onnx_iobinding.py
      - name: Benchmark ONNX output allocation in Docker
        if: ${{ inputs.run_iobinding_benchmark }}
        run: |
          mkdir -p "$RUNNER_TEMP/onnx-iobinding-benchmark"
          docker run --rm --gpus all --entrypoint python3 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/app,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/onnx-iobinding-benchmark,dst=/evidence" \
            "$INFERENCE_PARALLEL_TEST_IMAGE" \
            -m development.benchmark_scripts.benchmark_onnx_iobinding \
            --device cuda --output /evidence/results.json
      - name: Upload ONNX allocation benchmark
        if: ${{ !cancelled() && inputs.run_iobinding_benchmark }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onnx-iobinding-benchmark
          path: ${{ runner.temp }}/onnx-iobinding-benchmark/
          if-no-files-found: error
      
      - name: 🔋 Start Test Docker without Torch Preprocessing - Parallel GPU
        id: start_without_torch
        if: ${{ inputs.test_name == '' || inputs.test_name == 'regression_without_torch' }}
        run: |
          USE_INFERENCE_MODELS=false PORT=9101 INFERENCE_TEST_DOCKER_ARGS='-e USE_PYTORCH_FOR_PREPROCESSING=False' INFERENCE_SERVER_REPO=roboflow-inference-server-gpu-parallel make start_test_docker_gpu
          docker exec inference-test python3 -c 'from inference.core.env import USE_PYTORCH_FOR_PREPROCESSING; assert USE_PYTORCH_FOR_PREPROCESSING is False'
      - name: 🧪 Regression Tests without Torch Preprocessing - Parallel GPU
        id: regression_tests_without_torch_preprocessing
        if: ${{ inputs.test_name == '' || inputs.test_name == 'regression_without_torch' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          asl_instance_segmentation_API_KEY: ${{ secrets.ASL_INSTANCE_SEGMENTATION_API_KEY }}
          asl_poly_instance_seg_API_KEY: ${{ secrets.ASL_POLY_INSTANCE_SEG_API_KEY }}
          bccd_favz3_API_KEY: ${{ secrets.BCCD_FAVZ3_API_KEY }}
          bccd_i4nym_API_KEY: ${{ secrets.BCCD_I4NYM_API_KEY }}
          cats_and_dogs_smnpl_API_KEY: ${{ secrets.CATS_AND_DOGS_SMNPL_API_KEY }}
          coins_xaz9i_API_KEY: ${{ secrets.COINS_XAZ9I_API_KEY }}
          melee_API_KEY: ${{ secrets.MELEE_API_KEY }}
          yolonas_test_API_KEY: ${{ secrets.YOLONAS_TEST_API_KEY }}
        run: |
          docker run --rm --network container:inference-test \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/app,readonly" \
            -e IS_PARALLEL_SERVER=true -e SKIP_VISUALISATION_TESTS=true -e FUNCTIONAL=true -e PORT=9101 \
            -e API_KEY -e asl_instance_segmentation_API_KEY -e asl_poly_instance_seg_API_KEY \
            -e bccd_favz3_API_KEY -e bccd_i4nym_API_KEY -e cats_and_dogs_smnpl_API_KEY \
            -e coins_xaz9i_API_KEY -e melee_API_KEY -e yolonas_test_API_KEY \
            "$INFERENCE_PARALLEL_TEST_IMAGE" -p no:cacheprovider \
            tests/inference/integration_tests/regression_test.py tests/inference/integration_tests/batch_regression_test.py
      - name: 🚨 Show server logs on error
        if: ${{ always() && steps.start_without_torch.outcome != 'skipped' }}
        run: docker logs inference-test
      - name: 🧹 Cleanup Test Docker - Parallel GPU
        if: ${{ always() && steps.start_without_torch.outcome != 'skipped' }}
        run: make stop_test_docker
      
      - name: 🔋 Start Test Docker with Torch Preprocessing - Parallel GPU
        id: start_with_torch
        if: ${{ !cancelled() && steps.parallel_unit_tests.outcome == 'success' && (inputs.test_name == '' || inputs.test_name == 'regression_with_torch') }}
        run: |
          USE_INFERENCE_MODELS=false PORT=9101 INFERENCE_TEST_DOCKER_ARGS='-e USE_PYTORCH_FOR_PREPROCESSING=True' INFERENCE_SERVER_REPO=roboflow-inference-server-gpu-parallel make start_test_docker_gpu
          docker exec inference-test python3 -c 'from inference.core.env import USE_PYTORCH_FOR_PREPROCESSING; assert USE_PYTORCH_FOR_PREPROCESSING is True'
      - name: 🧪 Regression Tests with Torch Preprocessing - Parallel GPU
        id: regression_tests_with_torch_preprocessing
        if: ${{ !cancelled() && steps.start_with_torch.outcome == 'success' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          asl_instance_segmentation_API_KEY: ${{ secrets.ASL_INSTANCE_SEGMENTATION_API_KEY }}
          asl_poly_instance_seg_API_KEY: ${{ secrets.ASL_POLY_INSTANCE_SEG_API_KEY }}
          bccd_favz3_API_KEY: ${{ secrets.BCCD_FAVZ3_API_KEY }}
          bccd_i4nym_API_KEY: ${{ secrets.BCCD_I4NYM_API_KEY }}
          cats_and_dogs_smnpl_API_KEY: ${{ secrets.CATS_AND_DOGS_SMNPL_API_KEY }}
          coins_xaz9i_API_KEY: ${{ secrets.COINS_XAZ9I_API_KEY }}
          melee_API_KEY: ${{ secrets.MELEE_API_KEY }}
          yolonas_test_API_KEY: ${{ secrets.YOLONAS_TEST_API_KEY }}
        run: |
          docker run --rm --network container:inference-test \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/app,readonly" \
            -e IS_PARALLEL_SERVER=true -e SKIP_VISUALISATION_TESTS=true -e FUNCTIONAL=true -e PORT=9101 \
            -e API_KEY -e asl_instance_segmentation_API_KEY -e asl_poly_instance_seg_API_KEY \
            -e bccd_favz3_API_KEY -e bccd_i4nym_API_KEY -e cats_and_dogs_smnpl_API_KEY \
            -e coins_xaz9i_API_KEY -e melee_API_KEY -e yolonas_test_API_KEY \
            "$INFERENCE_PARALLEL_TEST_IMAGE" -p no:cacheprovider \
            tests/inference/integration_tests/regression_test.py tests/inference/integration_tests/batch_regression_test.py
      - name: 🚨 Show server logs on error
        if: ${{ always() && steps.start_with_torch.outcome != 'skipped' }}
        run: docker logs inference-test
      - name: 🧹 Cleanup Test Docker - Parallel GPU
        if: ${{ always() && steps.start_with_torch.outcome != 'skipped' }}
        run: make stop_test_docker
