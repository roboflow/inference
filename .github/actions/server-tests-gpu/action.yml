name: Server GPU regression steps
description: Shared server test stages for legacy and saved-image workflows
inputs:
  private_logs:
    description: Suppress runtime and test output in public CI logs
    default: "false"
  test_name:
    description: Empty runs every existing GPU test stage
    default: ""
  server_image:
    description: legacy inference image or the new inference_server image
    default: legacy
  reset_model_cache:
    description: Discard the runner's cached model weights before this run
    default: "false"
  API_KEY:
    description: Test credential supplied by the calling workflow
    required: false
  ASL_INSTANCE_SEGMENTATION_API_KEY:
    description: Test credential supplied by the calling workflow
    required: false
  ASL_POLY_INSTANCE_SEG_API_KEY:
    description: Test credential supplied by the calling workflow
    required: false
  BCCD_FAVZ3_API_KEY:
    description: Test credential supplied by the calling workflow
    required: false
  BCCD_I4NYM_API_KEY:
    description: Test credential supplied by the calling workflow
    required: false
  CATS_AND_DOGS_SMNPL_API_KEY:
    description: Test credential supplied by the calling workflow
    required: false
  COINS_XAZ9I_API_KEY:
    description: Test credential supplied by the calling workflow
    required: false
  MELEE_API_KEY:
    description: Test credential supplied by the calling workflow
    required: false
  YOLONAS_TEST_API_KEY:
    description: Test credential supplied by the calling workflow
    required: false
runs:
  using: composite
  steps:
    # Model weights stay on the self-hosted runner between runs, under the
    # runner user's home, so later stages and later runs skip the download.
    # Each USE_INFERENCE_MODELS leg mounts its own directory as the container's
    # MODEL_CACHE_DIR (/tmp/cache, which also holds the inference-models and
    # Hugging Face caches), so two legs on one host never clear or evict each
    # other's weights. DISK_CACHE_CLEANUP=False keeps /model/clear and
    # hot-cache eviction from deleting the cached files. The script discards
    # the cache when MODEL_CACHE_KEY changes (bump it to invalidate every
    # runner), when it is older than MODEL_CACHE_MAX_AGE_DAYS, or on the
    # reset_model_cache input; the wipe runs inside the test image, not sudo.
    - name: Prepare persistent model cache
      shell: bash
      env:
        MODEL_CACHE_KEY: v1
        MODEL_CACHE_MAX_AGE_DAYS: "14"
        MODEL_CACHE_RESET: ${{ inputs.reset_model_cache }}
      run: python3 .github/scripts/ci_model_cache.py
    - name: Show NVIDIA driver - GPU
      if: ${{ (inputs.test_name == '' || inputs.test_name == 'fast_track') && inputs.server_image == 'legacy' }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: nvidia-smi

    - name: Verify CUDA OpenCV - GPU
      if: ${{ (inputs.test_name == '' || inputs.test_name == 'fast_track') && inputs.server_image == 'legacy' }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: |
        docker run --rm --gpus all --entrypoint sh \
          -e OPENCV_REQUIRE_CUDA_BUILD=true \
          -e OPENCV_REQUIRE_CUDA_RUNTIME=true \
          -v "$PWD/docker/scripts/verify_opencv.sh:/tmp/verify_opencv:ro" \
          "${INFERENCE_TEST_IMAGE:-roboflow/roboflow-inference-server-gpu:test}" \
          /tmp/verify_opencv

    - name: Verify NVIDIA GStreamer codecs - GPU
      if: ${{ (inputs.test_name == '' || inputs.test_name == 'fast_track') && inputs.server_image == 'legacy' }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: |
        docker run --rm --gpus all --entrypoint sh \
          -e GSTREAMER_REQUIRE_NVCODEC=true \
          -e GSTREAMER_REQUIRE_NVCODEC_RUNTIME=true \
          -v "$PWD/docker/scripts/verify_gstreamer.sh:/tmp/verify_gstreamer:ro" \
          "${INFERENCE_TEST_IMAGE:-roboflow/roboflow-inference-server-gpu:test}" \
          /tmp/verify_gstreamer

    - name: Verify CUDA GStreamer tensor bridge - GPU
      if: ${{ (inputs.test_name == '' || inputs.test_name == 'fast_track') && inputs.server_image == 'legacy' }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: |
        docker run --rm --gpus all --entrypoint python3 \
          -v "$PWD/docker/scripts/verify_gstreamer_cuda_tensor_runtime.py:/tmp/verify_gstreamer_cuda_tensor_runtime.py:ro" \
          "${INFERENCE_TEST_IMAGE:-roboflow/roboflow-inference-server-gpu:test}" \
          /tmp/verify_gstreamer_cuda_tensor_runtime.py

    - name: 🔋 Start Test Docker without Torch Preprocessing - GPU
      if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'regression_without_torch' }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: |
        USE_INFERENCE_MODELS="$MODEL_MODE" PORT=9101 USE_PYTORCH_FOR_PREPROCESSING=False INFERENCE_SERVER_REPO="${INFERENCE_SERVER_REPO:-roboflow-inference-server-gpu}" INFERENCE_TEST_DOCKER_ARGS="$MODEL_CACHE_DOCKER_ARGS" make start_test_docker_gpu
        CI_IMAGE_ACTION=port python3 .github/scripts/ci_image.py
    - name: 🧪 Regression Tests without Torch Preprocessing - GPU
      id: regression_tests_without_torch
      if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'regression_without_torch' }}
      env:
        API_KEY: ${{ inputs.API_KEY }}
        asl_instance_segmentation_API_KEY: ${{ inputs.ASL_INSTANCE_SEGMENTATION_API_KEY }}
        asl_poly_instance_seg_API_KEY: ${{ inputs.ASL_POLY_INSTANCE_SEG_API_KEY }}
        bccd_favz3_API_KEY: ${{ inputs.BCCD_FAVZ3_API_KEY }}
        bccd_i4nym_API_KEY: ${{ inputs.BCCD_I4NYM_API_KEY }}
        cats_and_dogs_smnpl_API_KEY: ${{ inputs.CATS_AND_DOGS_SMNPL_API_KEY }}
        coins_xaz9i_API_KEY: ${{ inputs.COINS_XAZ9I_API_KEY }}
        melee_API_KEY: ${{ inputs.MELEE_API_KEY }}
        yolonas_test_API_KEY: ${{ inputs.YOLONAS_TEST_API_KEY }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: |
        source .venv/bin/activate
        USE_INFERENCE_MODELS="$MODEL_MODE" MINIMUM_FPS=25 FUNCTIONAL=true PORT="${TEST_PORT:-9101}" SKIP_LMM_TEST=True python3 -m pytest tests/inference/integration_tests/ $PYTEST_EXTRA_ARGS
    - name: 🧹 Cleanup Test Docker - GPU
      if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'regression_without_torch' }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: make stop_test_docker

    - name: 🔋 Start Test Docker with Torch Preprocessing - GPU
      if: ${{ inputs.test_name == 'regression_with_torch' || (inputs.test_name == '' && inputs.server_image == 'legacy') }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: |
        USE_INFERENCE_MODELS="$MODEL_MODE" PORT=9101 USE_PYTORCH_FOR_PREPROCESSING=True INFERENCE_SERVER_REPO="${INFERENCE_SERVER_REPO:-roboflow-inference-server-gpu}" INFERENCE_TEST_DOCKER_ARGS="$MODEL_CACHE_DOCKER_ARGS" make start_test_docker_gpu
        CI_IMAGE_ACTION=port python3 .github/scripts/ci_image.py
    - name: 🧪 Regression Tests with Torch Preprocessing - GPU
      id: regression_tests_with_torch
      if: ${{ inputs.test_name == 'regression_with_torch' || (inputs.test_name == '' && inputs.server_image == 'legacy') }}
      env:
        API_KEY: ${{ inputs.API_KEY }}
        asl_instance_segmentation_API_KEY: ${{ inputs.ASL_INSTANCE_SEGMENTATION_API_KEY }}
        asl_poly_instance_seg_API_KEY: ${{ inputs.ASL_POLY_INSTANCE_SEG_API_KEY }}
        bccd_favz3_API_KEY: ${{ inputs.BCCD_FAVZ3_API_KEY }}
        bccd_i4nym_API_KEY: ${{ inputs.BCCD_I4NYM_API_KEY }}
        cats_and_dogs_smnpl_API_KEY: ${{ inputs.CATS_AND_DOGS_SMNPL_API_KEY }}
        coins_xaz9i_API_KEY: ${{ inputs.COINS_XAZ9I_API_KEY }}
        melee_API_KEY: ${{ inputs.MELEE_API_KEY }}
        yolonas_test_API_KEY: ${{ inputs.YOLONAS_TEST_API_KEY }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: |
        source .venv/bin/activate
        USE_INFERENCE_MODELS="$MODEL_MODE" MINIMUM_FPS=25 FUNCTIONAL=true PORT="${TEST_PORT:-9101}" SKIP_LMM_TEST=True python3 -m pytest tests/inference/integration_tests/ $PYTEST_EXTRA_ARGS
    - name: 🧹 Cleanup Test Docker - GPU
      if: ${{ inputs.test_name == 'regression_with_torch' || (inputs.test_name == '' && inputs.server_image == 'legacy') }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: make stop_test_docker

    - name: 🔋 Start Test Docker - GPU
      if: ${{ inputs.test_name == '' || inputs.test_name == 'paligemma' }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: |
        USE_INFERENCE_MODELS="$MODEL_MODE" PORT=9101 INFERENCE_SERVER_REPO="${INFERENCE_SERVER_REPO:-roboflow-inference-server-gpu}" INFERENCE_TEST_DOCKER_ARGS="$MODEL_CACHE_DOCKER_ARGS" make start_test_docker_gpu
        CI_IMAGE_ACTION=port python3 .github/scripts/ci_image.py
    - name: 🧪 Regression Paligemma - GPU
      id: paligemma_tests
      if: ${{ inputs.test_name == '' || inputs.test_name == 'paligemma' }}
      env:
        melee_API_KEY: ${{ inputs.MELEE_API_KEY }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: |
        source .venv/bin/activate
        USE_INFERENCE_MODELS="$MODEL_MODE" PORT="${TEST_PORT:-9101}" python3 -m pytest tests/inference/integration_tests/test_paligemma.py
    - name: 🧹 Cleanup Test Docker - GPU
      if: ${{ inputs.test_name == '' || inputs.test_name == 'paligemma' }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: make stop_test_docker
    - name: 🔋 Start Test Docker - GPU
      if: ${{ inputs.test_name == '' || inputs.test_name == 'florence' }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: |
        USE_INFERENCE_MODELS="$MODEL_MODE" PORT=9101 INFERENCE_SERVER_REPO="${INFERENCE_SERVER_REPO:-roboflow-inference-server-gpu}" INFERENCE_TEST_DOCKER_ARGS="$MODEL_CACHE_DOCKER_ARGS" make start_test_docker_gpu
        CI_IMAGE_ACTION=port python3 .github/scripts/ci_image.py
    - name: 🧪 Regression Florence - GPU
      id: florence_tests
      if: ${{ inputs.test_name == '' || inputs.test_name == 'florence' }}
      env:
        melee_API_KEY: ${{ inputs.MELEE_API_KEY }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: |
        source .venv/bin/activate
        USE_INFERENCE_MODELS="$MODEL_MODE" PORT="${TEST_PORT:-9101}" python3 -m pytest tests/inference/integration_tests/test_florence.py
    - name: 🧹 Cleanup Test Docker - GPU
      if: ${{ inputs.test_name == '' || inputs.test_name == 'florence' }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: make stop_test_docker
    - name: 🔋 Start Test Docker - SAM2
      if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam2' }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: |
        USE_INFERENCE_MODELS="$MODEL_MODE" PORT=9101 INFERENCE_SERVER_REPO="${INFERENCE_SERVER_REPO:-roboflow-inference-server-gpu}" INFERENCE_TEST_DOCKER_ARGS="$MODEL_CACHE_DOCKER_ARGS" make start_test_docker_gpu
        CI_IMAGE_ACTION=port python3 .github/scripts/ci_image.py
    - name: 🧪 Regression Tests - SAM2
      id: sam2_tests
      if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam2' }}
      env:
        API_KEY: ${{ inputs.API_KEY }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: |
        source .venv/bin/activate
        USE_INFERENCE_MODELS="$MODEL_MODE" PORT="${TEST_PORT:-9101}" SKIP_SAM2_TESTS=False python3 -m pytest tests/inference/integration_tests/test_sam2.py
    - name: 🧹 Cleanup Test Docker - SAM2
      if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam2' }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: make stop_test_docker
    - name: 🔋 Start Test Docker - SAM3
      if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam3' }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: |
        USE_INFERENCE_MODELS="$MODEL_MODE" PORT=9101 INFERENCE_SERVER_REPO="${INFERENCE_SERVER_REPO:-roboflow-inference-server-gpu}" INFERENCE_TEST_DOCKER_ARGS="$MODEL_CACHE_DOCKER_ARGS -e MAX_ACTIVE_MODELS=1 -e DISK_CACHE_CLEANUP=False" make start_test_docker_gpu
        CI_IMAGE_ACTION=port python3 .github/scripts/ci_image.py
    - name: 🧪 Regression Tests - SAM3
      id: sam3_tests
      if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam3' }}
      env:
        API_KEY: ${{ inputs.API_KEY }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: |
        source .venv/bin/activate
        USE_INFERENCE_MODELS="$MODEL_MODE" PORT="${TEST_PORT:-9101}" SKIP_SAM3_TESTS=False python3 -m pytest tests/inference/integration_tests/test_sam3.py
    - name: 🧹 Cleanup Test Docker - SAM3
      if: ${{ inputs.test_name == '' || inputs.test_name == 'fast_track' || inputs.test_name == 'sam3' }}
      shell: ${{ inputs.private_logs == 'true' && 'python3 .github/scripts/ci_private_shell.py {0}' || 'bash' }}
      run: make stop_test_docker
