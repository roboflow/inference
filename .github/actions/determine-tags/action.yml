name: "Determine Image Tags"
description: "Determine Docker image tags based on inputs, version, branch, and base image name"
inputs:
  custom_tag:
    description: "Custom tag to use for the image (overrides VERSION)"
    required: false
    default: ""
  version:
    description: "Version of the image (e.g., 0.0.1, without the 'v')"
    required: true
  release_version:
    description: "Runtime version corresponding to the GitHub release tag; defaults to version. Set for independently versioned images."
    required: false
    default: ""
  tag_prefix:
    description: "Optional image tag prefix, including separator (e.g. cu124-)"
    required: false
    default: ""
  base_image:
    description: "Base image name for the Docker tags (e.g., 'roboflow/roboflow-inference-server-gpu')"
    required: true
  token:
    description: "GitHub token for accessing repository data"
    required: true
  force_push:
    description: "Force push the release tag (only outputs the version tag)"
    required: false
    default: "false"
outputs:
  image_tags:
    description: "Comma-separated list of Docker image tags"
    value: ${{ steps.image_tags.outputs.image_tags }}
runs:
  using: "composite"
  steps:
    - name: Determine Image Tags
      shell: bash
      id: image_tags
      env:
        CUSTOM_TAG: ${{ inputs.custom_tag }}
        VERSION: ${{ inputs.version }}
        RELEASE_VERSION: ${{ inputs.release_version }}
        RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        TAG_PREFIX: ${{ inputs.tag_prefix }}
        BASE_IMAGE: ${{ inputs.base_image }}
        TOKEN: ${{ inputs.token }}
        FORCE_PUSH: ${{ inputs.force_push }}
        BRANCH: ${{ github.ref_name }}
        EVENT_NAME: ${{ github.event_name }}
        TARGET_BRANCH: ${{ github.event.release.target_commitish }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        TAG_PREFIX="${TAG_PREFIX:-}"
        RELEASE_VERSION="${RELEASE_VERSION:-$VERSION}"
        RELEASE_PRERELEASE="${RELEASE_PRERELEASE:-false}"
        for value in "$TAG_PREFIX" "$RELEASE_VERSION" "$RELEASE_PRERELEASE" "$CUSTOM_TAG" "$VERSION" "$BASE_IMAGE" "$BRANCH" "$TARGET_BRANCH" "$REPOSITORY"; do
          if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
            echo "Tag inputs must not contain line breaks." >&2
            exit 1
          fi
        done
        if [[ ! "$BASE_IMAGE" =~ ^[a-z0-9][a-z0-9._:/-]*$ ]]; then
          echo "Invalid image repository." >&2
          exit 1
        fi
        if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
          echo "Invalid image version." >&2
          exit 1
        fi
        if [[ -n "$CUSTOM_TAG" && ! "$CUSTOM_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
          echo "Invalid custom tag." >&2
          exit 1
        fi

        if [[ -n "$TAG_PREFIX" && ! "$TAG_PREFIX" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]; then
          echo "Invalid image tag prefix." >&2
          exit 1
        fi

        IMAGE_TAGS=""
        ALLOW_LATEST=false
        if [ "$EVENT_NAME" = "release" ]; then
          RELEASE="${BRANCH#v}"
          # Accept historical short final and dotted RC spellings, as well as
          # equivalent post-release spellings. Never discard a release suffix.
          # Keep the checkout's image version spelling in the published tag.
          normalize_version() {
            local value="${1#v}"
            if [[ "$value" =~ ^([0-9]+\.[0-9]+)$ ]]; then
              value="${BASH_REMATCH[1]}.0"
            elif [[ "$value" =~ ^([0-9]+\.[0-9]+\.[0-9]+)[.-]?rc[.-]?([0-9]+)$ ]]; then
              value="${BASH_REMATCH[1]}rc${BASH_REMATCH[2]}"
            fi
            if [[ "$value" =~ ^([0-9]+\.[0-9]+\.[0-9]+)[.-]?post([0-9]+)$ ]]; then
              value="${BASH_REMATCH[1]}.post${BASH_REMATCH[2]}"
            fi
            printf '%s' "$value"
          }
          NORMALIZED_RELEASE="$(normalize_version "$RELEASE")"
          NORMALIZED_VERSION="$(normalize_version "$VERSION")"
          if [ "$NORMALIZED_RELEASE" != "$(normalize_version "$RELEASE_VERSION")" ]; then
            echo "Release tag does not match the checked-out runtime version. Correct the tag/source pairing, or use workflow_dispatch for a version-only historical image." >&2
            exit 1
          fi
          # Positive final-version allowlist: alpha, beta, RC and development
          # versions can never promote a stable alias, even if mislabeled.
          stable_version='^[0-9]+\.[0-9]+\.[0-9]+([.-]?post[0-9]+)?$'
          IMAGE_VERSION="$VERSION"
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            if [[ "$NORMALIZED_RELEASE" =~ $stable_version ]]; then
              echo "A prerelease requires a prerelease runtime version. Correct the GitHub prerelease flag or use a candidate version, then rerun." >&2
              exit 1
            fi
            if [[ "$NORMALIZED_VERSION" =~ $stable_version ]]; then
              # An unchanged Models package can accompany a runtime RC. Give
              # its image a distinct RC tag instead of replacing the final tag.
              IMAGE_VERSION="${VERSION}-${RELEASE}"
            fi
          elif [ "$RELEASE_PRERELEASE" = "false" ]; then
            if [[ ! "$NORMALIZED_RELEASE" =~ $stable_version || ! "$NORMALIZED_VERSION" =~ $stable_version ]]; then
              echo "A candidate version must be marked as a GitHub prerelease. Correct the release metadata, then rerun; no tags were emitted." >&2
              exit 1
            fi
          else
            echo "Missing or invalid release prerelease status." >&2
            exit 1
          fi

          IMAGE_TAGS="$BASE_IMAGE:${TAG_PREFIX}${IMAGE_VERSION}"
          if [ "$RELEASE_PRERELEASE" = "false" ]; then
            if ! LATEST_RELEASE=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              --retry 3 --retry-all-errors --retry-max-time 90 \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.github.com/repos/$REPOSITORY/releases/latest" \
              | jq -er 'select(.prerelease == false and .draft == false) | .tag_name | select(type == "string" and length > 0)'); then
              echo "Cannot verify the selected stable release. Check GitHub API availability/access and release metadata, then rerun this job; no tags were emitted." >&2
              exit 1
            fi
            # Equivalent package versions can identify different Git tags.
            # Only the exact release selected by GitHub may move latest.
            if [ "$BRANCH" = "$LATEST_RELEASE" ]; then
              ALLOW_LATEST=true
              IMAGE_TAGS="$IMAGE_TAGS,$BASE_IMAGE:${TAG_PREFIX}latest"
            fi
          fi
        elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          # Manual publication only writes the requested version/custom tag.
          TAG="$VERSION${CUSTOM_TAG:+-$CUSTOM_TAG}"
          IMAGE_TAGS="$BASE_IMAGE:${TAG_PREFIX}${TAG}"
        elif [ "$EVENT_NAME" = "push" ]; then
          PUSH_TAG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/-\{2,\}/-/g' | sed 's/^-//;s/-$//')
          IMAGE_TAGS="$BASE_IMAGE:${TAG_PREFIX}${PUSH_TAG}"
        fi

        # Clean up leading/trailing commas
        IMAGE_TAGS=$(echo "$IMAGE_TAGS" | sed 's/^,//;s/,$//')

        # Echo the computed tags
        echo "Computed image tags: $IMAGE_TAGS"

        if [ -z "$IMAGE_TAGS" ]; then
          echo "No valid image tags found."
          exit 1
        fi

        # Validate final tags after adding version prefixes or normalizing refs.
        IFS=',' read -r -a tags <<< "$IMAGE_TAGS"
        for image_tag in "${tags[@]}"; do
          if [[ "$image_tag" != "$BASE_IMAGE:"* ]]; then
            echo "Generated tags must use the configured image repository." >&2
            exit 1
          fi
          tag="${image_tag#"$BASE_IMAGE:"}"
          if [ "$tag" = "${TAG_PREFIX}latest" ] && [ "$ALLOW_LATEST" != true ]; then
            echo "Only the selected stable release can update latest." >&2
            exit 1
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid generated Docker tag." >&2
            exit 1
          fi
        done
        printf 'image_tags=%s\n' "$IMAGE_TAGS" >> "$GITHUB_OUTPUT"
