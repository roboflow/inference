name: Retry test shard
description: Retry a failing test command at most three times and retain each attempt
inputs:
  command:
    description: Existing test command
    required: true
  attempts:
    description: Maximum attempts; ordinary PR runs keep one
    default: '1'
  working-directory:
    description: Directory in which the test command runs
    default: '.'
runs:
  using: composite
  steps:
    - name: Run test attempts
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RETRY_COMMAND: ${{ inputs.command }}
        RETRY_ATTEMPTS: ${{ inputs.attempts }}
      run: |
        log_dir="$(mktemp -d "$RUNNER_TEMP/release-test-attempts.XXXXXX")"
        export RETRY_LOG_DIR="$log_dir"
        bash "$GITHUB_WORKSPACE/.github/scripts/retry.sh"
