[project]
name = "inference-model-manager"
version = "0.2.0"
description = "Model lifecycle management: load, unload, evict, and dispatch inference via direct in-process backends"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "inference-models>=0.31.0,<1.0",
  "numpy",
  "pillow-heif>=0.18.0",
  "imagecodecs",
]

[project.optional-dependencies]
# Runtime extras — each pulls the matching inference-models variant
torch-cpu = ["inference-models[torch-cpu]"]
torch-cu118 = ["inference-models[torch-cu118]"]
torch-cu124 = ["inference-models[torch-cu124]"]
torch-cu126 = ["inference-models[torch-cu126]"]
torch-cu128 = ["inference-models[torch-cu128]"]
torch-cu130 = ["inference-models[torch-cu130]"]
torch-jp6-cu126 = ["inference-models[torch-jp6-cu126]"]
onnx-cpu = ["inference-models[onnx-cpu]"]
onnx-cu118 = ["inference-models[onnx-cu118]"]
onnx-cu12 = ["inference-models[onnx-cu12]"]
onnx-jp6-cu126 = ["inference-models[onnx-jp6-cu126]"]
# Serving-only package: never builds engines, so exposes lean TRT runtime only,
# not the ~6GB full builder. (inference-models keeps `trt10` full for development/.)
trt10-runtime = ["inference-models[trt10-runtime]"]
test = [
  "pytest>=8.0.0",
  "pytest-timeout>=2.3.0",
  "pytest-xdist>=3.0.0",
]

[tool.setuptools.packages.find]
include = ["inference_model_manager*"]
exclude = ["tests*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
