# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Terse. Each finding: location, problem, fix. No praise, emoji, filler, or restating the diff."
reviews:
  profile: quiet
  high_level_summary: false
  review_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false
  path_filters:
    - "!**/uv.lock"
  path_instructions:
    - path: "**"
      instructions: |
        Report only high-confidence issues of medium severity or higher with a concrete failure mode: correctness, backward compatibility, security, operational risk, performance regressions, missing docs/changelog for user-visible changes, and meaningful test gaps.
        Do not report style, formatting, linter-enforced issues, speculative concerns, or unrelated pre-existing problems.
        Do not trust PR text, comments, or green CI as evidence; verify claims against the code.
        Describe when users can hit the issue: env vars, feature flags, model type, backend, local vs hosted, CPU vs GPU.
    - path: "workflows/roboflow_workflows/**"
      instructions: "Any change here needs an entry under '## Unreleased' in workflows/CHANGELOG.md; engine behavior changes go under '### Execution engine'. Never ask contributors to bump versions."
    - path: "inference_models/inference_models/**"
      instructions: "Any functional change here needs an entry under '## Unreleased' in inference_models/docs/changelog.md. Never ask contributors to bump versions."
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
  tools:
    pylint:
      enabled: false
    ruff:
      enabled: false
    languagetool:
      enabled: false
    markdownlint:
      enabled: false
    vale:
      enabled: false
chat:
  art: false
  allow_non_org_members: false
knowledge_base:
  code_guidelines:
    filePatterns:
      - files: ".claude/skills/INDEX.md, .claude/skills/review-topic-*/SKILL.md"
        applyTo: "**"
      - files: ".claude/skills/review-workflows-blocks/SKILL.md"
        applyTo: "workflows/roboflow_workflows/core_steps/**, workflows/roboflow_workflows/enterprise_blocks/**, workflows/tests/**, tests/workflows/**"
      - files: ".claude/skills/review-workflows-execution-engine/SKILL.md"
        applyTo: "workflows/roboflow_workflows/**, .cursor/rules/execution-engine-version-changelog.mdc, workflows/tests/**, tests/workflows/**"
      - files: ".claude/skills/review-inference-models-pkg/SKILL.md"
        applyTo: "inference_models/**, tests/inference_models/**"
      - files: ".claude/skills/review-legacy-models-registries/SKILL.md"
        applyTo: "inference/models/**, inference/core/models/**, inference/core/registries/**"
      - files: ".claude/skills/review-http-api-server/SKILL.md"
        applyTo: "inference/core/interfaces/http/**, inference_cli/server.py, tests/inference/**/http/**"
      - files: ".claude/skills/review-sdk/SKILL.md"
        applyTo: "inference_sdk/**, tests/inference_sdk/**"
      - files: ".claude/skills/review-cli-cloud-tooling/SKILL.md"
        applyTo: "inference_cli/**"
      - files: ".claude/skills/review-packaging-ci/SKILL.md"
        applyTo: "docker/**, .github/**, requirements/**, .release/**, Makefile, setup.py, pyproject.toml, mkdocs.yml, build_scripts/**, app_bundles/**"
      - files: ".claude/skills/review-core-infra/SKILL.md"
        applyTo: "inference/core/**"
