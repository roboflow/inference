# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Terse. Each finding: location, problem, fix. No praise, emoji, filler, or restating the diff."
reviews:
  profile: quiet
  high_level_summary: false
  review_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false
  auto_review:
    enabled: false
  path_filters:
    - "!**/uv.lock"
  path_instructions:
    - path: "**"
      instructions: |
        Report only high-confidence issues of medium severity or higher with a concrete failure mode: correctness, backward compatibility, security, operational risk, performance regressions, missing docs/changelog for user-visible changes, and meaningful test gaps.
        Do not report style, formatting, linter-enforced issues, speculative concerns, or unrelated pre-existing problems.
        Do not trust PR text, comments, or green CI as evidence; verify claims against the code.
        Describe when users can hit the issue: env vars, feature flags, model type, backend, local vs hosted, CPU vs GPU.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
  tools:
    pylint:
      enabled: false
    ruff:
      enabled: false
    languagetool:
      enabled: false
    markdownlint:
      enabled: false
    vale:
      enabled: false
chat:
  art: false
  auto_reply: false
  allow_non_org_members: false
knowledge_base:
  code_guidelines:
    filePatterns:
      - files: ".claude/skills/INDEX.md, .claude/skills/review-*/SKILL.md"
        applyTo: "**"
