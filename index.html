<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <link rel="canonical" href="https:&#x2f;&#x2f;docs.roboflow.com&#x2f;deployment&#x2f;self-hosted&#x2f;self-hosted">
    
    
    <script>
        var destination = new URL("https://docs.roboflow.com/deployment/self-hosted/self-hosted");
        var campaign = new URLSearchParams(window.location.search);
        // Forward only campaign keys consumed by app.roboflow.com/scripts/utm.js.
        ["utm_source", "utm_medium", "utm_campaign", "ref", "fbclid"].forEach(function (key) {
            if (campaign.has(key) && !destination.searchParams.has(key)) {
                destination.searchParams.set(key, campaign.get(key));
            }
        });
        if (window.location.hash) {
            destination.hash = window.location.hash;
        }
        location.href = destination.href;
    </script>
    
    <meta http-equiv="refresh" content="0; url=https:&#x2f;&#x2f;docs.roboflow.com&#x2f;deployment&#x2f;self-hosted&#x2f;self-hosted">
</head>
<body>
You're being redirected to a <a href="https:&#x2f;&#x2f;docs.roboflow.com&#x2f;deployment&#x2f;self-hosted&#x2f;self-hosted">new destination</a>.
</body>
</html>
